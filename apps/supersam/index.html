<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Supersam</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Canvas, HUD in den Ecken, Touch-Hälften als Overlay. Bewusst nur ein Look (Pixel-Welt im SNES-Stil). */
:root{
  --night:#16233a; --ember:#f2a65a; --cream:#f6ead2; --ink:#0d1524; --dim:rgba(246,234,210,.25); --sky:#7fe0ff;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
.hud{position:fixed;font-family:var(--pixel);font-size:14px;text-shadow:2px 2px 0 var(--ink);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hl{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;align-items:center;gap:10px}
#hc{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);white-space:nowrap}
#hr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:6px;align-items:center}
#home{pointer-events:auto;font-family:var(--pixel);font-size:14px;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);
  min-width:44px;min-height:36px;cursor:pointer}
#home:focus-visible,#gear:focus-visible{outline:2px solid var(--ember)}
#gear{pointer-events:auto;font-family:var(--pixel);font-size:14px;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);min-width:44px;min-height:36px;cursor:pointer}
#debug{justify-content:flex-start;z-index:10}
.tunes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(110px,1.4fr) 3.5em;gap:8px 12px;align-items:center;width:100%;max-width:680px;text-align:left;font-size:11px}
.tunes label{min-width:0}
.tunes input[type=range]{width:100%;accent-color:var(--ember);min-height:28px}
.tunes output{font-variant-numeric:tabular-nums;color:var(--ember);text-align:right}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:11px;max-width:680px}
.checks label{display:flex;align-items:center;gap:6px;min-height:32px}
.checks input{accent-color:var(--ember);width:18px;height:18px}
#dbgout{width:100%;max-width:680px;min-height:80px;font-family:ui-monospace,monospace;font-size:11px;background:#0d1524;color:var(--cream);border:2px solid var(--dim)}
#dbginfo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:ui-monospace,monospace;font-size:11px;
  background:rgba(13,21,36,.7);padding:3px 8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;gap:3px}
.flow small{font-size:10px;opacity:.85}
.flowbar{width:110px;height:8px;background:var(--dim);position:relative;box-shadow:2px 2px 0 var(--ink)}
.flowbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ember)}
.flowbar b{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.6}
.pill{font-size:10px;padding:2px 6px;border:2px solid var(--dim);opacity:.45}
.pill.on{opacity:1;border-color:var(--sky);color:var(--sky)}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:50%;transform:translateX(-50%);font-family:var(--pixel);
  font-size:13px;color:var(--ember);text-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap}
#msg.show{opacity:1;transition:none}
.zone{position:fixed;bottom:0;top:0;width:50%;pointer-events:none;display:flex;align-items:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);box-sizing:border-box;transition:background .08s}
.zone.l{left:0;justify-content:flex-start;padding-left:calc(env(safe-area-inset-left,0px) + 16px);border-right:1px dashed rgba(246,234,210,.1)}
.zone.r{right:0;justify-content:flex-end;padding-right:calc(env(safe-area-inset-right,0px) + 16px)}
.zone span{font-family:var(--pixel);font-size:18px;opacity:.3;text-shadow:2px 2px 0 var(--ink)}
.zone.on{background:linear-gradient(to top,rgba(242,166,90,.16),transparent 40%)}
.zone.on span{opacity:.9;color:var(--ember)}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(13,21,36,.8);text-align:center;touch-action:pan-y;font-family:var(--pixel);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.panel h1{margin:0;font-size:clamp(24px,5vw,42px);color:var(--ember);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel h2{margin:0;font-size:18px;color:var(--sky);text-shadow:2px 2px 0 var(--ink)}
.panel p{margin:0;max-width:40em;line-height:1.6;font-size:12px;color:var(--cream)}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 16px;text-align:left;font-size:11px;opacity:.9}
.keys b{color:var(--ember);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--pixel);font-size:15px;background:var(--ember);color:var(--ink);border:0;padding:11px 20px;min-height:44px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--dim);box-shadow:none;font-size:12px}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.ability{border:2px solid var(--sky);padding:10px 16px;max-width:36em}
.stats{font-size:13px;line-height:1.8}
#start{background:linear-gradient(to top,rgba(13,21,36,.8),rgba(13,21,36,0) 38%);justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#rotate{display:none;z-index:20;background:var(--night)}
@media (orientation:portrait){#rotate{display:flex}}
.phone{width:40px;height:66px;border:4px solid var(--cream);border-radius:8px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="zone l" id="zl"><span>◀</span></div>
<div class="zone r" id="zr"><span>▶</span></div>
<div class="hud" id="hl">
  <button id="home" type="button" aria-label="Zurück zur Hubwelt">⌂ Hub</button>
  <button id="gear" type="button" aria-label="Menü öffnen">☰ Menü</button>
  <div class="flow"><small id="flowlbl">Schwung ×1</small><div class="flowbar"><i id="flowfill"></i><b style="left:33%"></b><b style="left:66%"></b></div></div>
</div>
<div class="hud" id="hc">◆ 0/3 · ● 0</div>
<div class="hud" id="hr"></div>
<div id="msg"></div>

<div class="panel" id="start" aria-label="Supersam">
  <div class="row">
    <button class="btn" id="play" type="button">Spielen</button>
    <button class="btn ghost" id="wipe" type="button">Fortschritt löschen</button>
  </div>
  <p id="wipeinfo" hidden>Fortschritt gelöscht.</p>
</div>

<div class="panel" id="done" hidden>
  <h1 id="donetitle">Geschafft!</h1>
  <div class="stats" id="donestats"></div>
  <div class="ability" id="donenew" hidden><h2 id="newname"></h2><p id="newhow"></p></div>
  <p id="donehint"></p>
  <button class="btn" id="donebtn" type="button">Zur Hubwelt</button>
</div>

<div class="panel" id="pause" hidden>
  <h1>Pause</h1>
  <div class="row" style="flex-direction:column;align-items:stretch;min-width:220px">
    <button class="btn" id="presume" type="button">Weiter</button>
    <button class="btn ghost" id="phub" type="button">Zur Hubwelt</button>
    <button class="btn ghost" id="pmain" type="button">Hauptmenü</button>
  </div>
  <div class="tunes" style="max-width:380px">
    <label for="v-music">Musik</label><input type="range" id="v-music" min="0" max="1" step="0.05"><output id="o-music" for="v-music"></output>
    <label for="v-sfx">Effekte</label><input type="range" id="v-sfx" min="0" max="1" step="0.05"><output id="o-sfx" for="v-sfx"></output>
  </div>
</div>
<div class="panel" id="debug" hidden>
  <h1>Debug</h1>
  <p>Änderungen wirken sofort und bleiben in diesem Browser gespeichert.</p>
  <div class="tunes" id="tunes"></div>
  <div class="checks">
    <label><input type="checkbox" id="d-info"> Messwerte anzeigen</label>
    <label><input type="checkbox" id="d-hitbox"> Hitboxen zeigen</label>
    <label><input type="checkbox" id="d-god"> Unverwundbar</label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="a-double"> Doppelsprung</label>
    <label><input type="checkbox" id="a-wall"> Wandsprung</label>
    <label><input type="checkbox" id="a-dash"> Dash</label>
    <label><input type="checkbox" id="a-glide"> Gleiten</label>
  </div>
  <div class="row">
    <button class="btn ghost" id="dbgreset" type="button">Werte zurücksetzen</button>
    <button class="btn ghost" id="dbgcopy" type="button">Werte kopieren</button>
    <button class="btn" id="dbgclose" type="button">Weiter</button>
  </div>
  <textarea id="dbgout" hidden readonly aria-label="Aktuelle Werte"></textarea>
</div>
<div id="dbginfo" hidden></div>

<div class="panel" id="rotate">
  <div class="phone"></div>
  <p>Bitte dreh dein Handy ins Querformat.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const TS=16, SKY_H=270; let VIEW_H=180; // VIEW_H: sichtbare Welthöhe (kleiner = näher dran)
const C={ember:'#f2a65a',cream:'#f6ead2',ink:'#0d1524',gold:'#ffd166',sky:'#7fe0ff',
  grassD:'#457a3a',earthD:'#523726',stoneD:'#5b6372',stoneL:'#98a1b0',water:'#3f7fb0',waterL:'#7fb8dc',waterD:'#2e5f88',
  pine:'#2f5e3f',pineD:'#234a31',leaf:'#4f8a43',bark:'#5a3b26',beetle:'#d84a4a',crumble:'#c69a6a'};

// ---------- Speicherstand ----------
const SAVE_KEY='daumensprung-v2';
const blankSave=()=>({ab:{double:false,wall:false,dash:false,glide:false},crystals:{},done:{},best:{},wallet:0});
let save=blankSave();
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s){ save=Object.assign(blankSave(),s); save.ab=Object.assign(blankSave().ab,s.ab||{}); } }catch(_){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(_){} }

const NAMES={0:'Hubwelt',1:'Wald',2:'Felsen',3:'See',4:'Gipfel'};
const WORLD_COL={0:'#f6ead2',1:'#6aa84f',2:'#c69a6a',3:'#4fa3d9',4:'#b9a7ff'};
const AB_OF={1:'double',2:'wall',3:'dash',4:'glide'};
const AB_INFO={
  double:{name:'Doppelsprung',short:'2×',how:'In der Luft den Sprungdaumen kurz heben und wieder aufsetzen. Damit erreichst du Kanten, die etwa doppelt so hoch liegen.'},
  wall:{name:'Wandsprung',short:'Wand',how:'Lauf in der Luft gegen eine Wand, dann rutschst du langsam. Setz den Sprungdaumen auf, um dich abzustoßen. Bleib mit dem Laufdaumen zur Wand gedrückt und wiederhole das, um hochzuklettern.'},
  dash:{name:'Dash',short:'Dash',how:'Tipp den Laufdaumen schnell zweimal. Du schießt nach vorn, auch einmal pro Sprung in der Luft. Rissige Felsen zerbrechen dabei.'},
  glide:{name:'Gleiten',short:'Gleit',how:'Halte im Fallen einen Daumen als Sprungdaumen gedrückt, dann segelst du langsam. In hellen Aufwinden trägt dich das Blatt nach oben.'}
};
const NEED_FOR_DOOR={2:'double',3:'wall',4:'dash'};

// ---------- Sprites (SNES-Stil) ----------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function spr(rows,pal){ const h=rows.length,w=rows[0].length,c=mk(w,h),g=c.getContext('2d');
  rows.forEach((row,y)=>{ if(row.length!==w) console.warn('Sprite-Zeile falsch',y,row);
    for(let x=0;x<row.length;x++){ const col=pal[row[x]]; if(col){g.fillStyle=col;g.fillRect(x,y,1,1);} } }); return c; }
function flipX(src){ const c=mk(src.width,src.height),g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }
const pair=c=>({r:c,l:flipX(c)});
const withRows=(base,rep)=>base.map((r,i)=>rep[i]??r);

// Sam: kleiner blonder Junge, 16x16, Hitbox 10x14
const HERO_PAL={k:'#1a1020',h:'#fff3b0',y:'#ffd85a',Y:'#d9a630',s:'#ffcfa0',S:'#e0a070',w:'#ffffff',e:'#1a1020',r:'#d84a4a',R:'#9a2a36',b:'#3a6ac8',B:'#2a4a90',f:'#5a3b26'};
const HERO=[
  "....kkkkkk......",
  "...khhyyyyk.....",
  "..khyyyyyyyk....",
  "..kyyyyyyyyyk...",
  "..kyYyssssyyk...",
  "..kYyssswesk....",
  "..kYsssswesk....",
  "...kSssssssk....",
  "....kkSSkkk.....",
  "...krrrrrrk.....",
  "..krRrrrrrsk....",
  "..kRRrrrrRkk....",
  "...kbbbbbbk.....",
  "...kbBk.kBbk....",
  "...kffk.kffk....",
  "...kkkk.kkkk...."];
const HERO_FR={
  idle:pair(spr(HERO,HERO_PAL)),
  blink:pair(spr(withRows(HERO,{5:"..kYyssssssk....",6:"..kYsssskksk...."}),HERO_PAL)),
  runA:pair(spr(withRows(HERO,{13:"..kbBk...kBbk...",14:"..kffk....kffk..",15:"..kkkk....kkkk.."}),HERO_PAL)),
  runB:pair(spr(withRows(HERO,{13:"....kbBBk.......",14:".....kffk.......",15:".....kkkk......."}),HERO_PAL)),
  jump:pair(spr(withRows(HERO,{13:"....kbbbbk......",14:"....kffffk......",15:"................"}),HERO_PAL))
};
const BEETLE_PAL={k:'#1a1020',r:'#d84a4a',R:'#8e2a36',l:'#ff9a8a',w:'#ffffff'};
const BEETLE=[
  "....kkkkkk......",
  "...klllrrrk.....",
  "..kllrrkrrrk....",
  ".klrrrrkrrrrk...",
  ".krrkkrkrkkrkkk.",
  ".krrkkrkrkkrkwk.",
  ".kRrrrrkrrrRkkk.",
  ".kRRRRRkRRRRk...",
  "..kkkkkkkkkkk...",
  "..k.k..k..k.....",
  ".k...k..k..k....",
  "................"];
const BEETLE_A=pair(spr(BEETLE,BEETLE_PAL));
const BEETLE_B=pair(spr(withRows(BEETLE,{9:"...k..k..k.k....",10:"...k..k...k.k..."}),BEETLE_PAL));
const COIN_PAL={b:'#8a5a14',l:'#fff3b0',y:'#ffd166',Y:'#e0a030'};
const COIN=[
  spr(["..bbbb..",".blllyb.","blyyyyYb","blyYYyYb","blyYyyYb","blyYyyYb","blyyyyYb","bYyyyyYb",".bYYYYb.","..bbbb.."],COIN_PAL),
  spr(["...bb...","..blyb..","..blYb..","..blYb..","..blYb..","..blYb..","..blYb..","..blYb..","..bYYb..","...bb..."],COIN_PAL),
  spr(["...b....","...lb...","...lb...","...lb...","...lb...","...lb...","...lb...","...lb...","...lb...","...b...."],COIN_PAL)];
const COIN_SEQ=[COIN[0],COIN[1],COIN[2],COIN[1]];
const CRYSTAL=spr([
  "....kk....",
  "...kwck...",
  "..kwccck..",
  ".kwcccCCk.",
  "kwccccCCdk",
  "kccccCCddk",
  "kcccCCdddk",
  ".kcCCdddk.",
  "..kCdddk..",
  "...kddk...",
  "....kk...."],{k:'#1a1020',w:'#ffffff',c:'#7fe0ff',C:'#3a9ad0',d:'#1d5a8a'});
const LEAF=spr([
  "....kkkkkkkk....",
  "..kkllllllllkk..",
  ".klllgggggglllk.",
  "kgggggGGGGgggggk",
  "kGGGGk.kk.kGGGGk",
  ".kkkk..kk..kkkk.",
  ".......kb.......",
  ".......kb......."],{k:'#1a1020',l:'#9be06a',g:'#6aa84f',G:'#457a3a',b:'#5a3b26'});
const SPIKE=spr([
  "................","................","................","................",
  "................","................","................","................",
  "...kk......kk...",
  "...nk......nk...",
  "..knmk....knmk..",
  "..knmk....knmk..",
  ".knmmMk..knmmMk.",
  ".knmmMk..knmmMk.",
  "knmmmMMkknmmmMMk",
  "kkkkkkkkkkkkkkkk"],{k:'#2a2a3a',n:'#ffffff',m:'#dfe6ef',M:'#8a97aa'});
const SPRING_PAL={k:'#1a1020',l:'#ff9a8a',r:'#e04848',R:'#9a2a2a',g:'#c9d3e0',G:'#6a7486'};
const SPRING_ROWS=[
  "..kkkkkkkkkkkk..",
  "..klllllllllrk..",
  "..kRRRRRRRRRRk..",
  "..kkkkkkkkkkkk..",
  "....kggggggk....",
  "...kGGGGGGGGk...",
  "....kggggggk....",
  "...kGGGGGGGGk...",
  "....kggggggk....",
  "..kkkkkkkkkkkk..",
  "..kGGGGGGGGGGk..",
  "..kkkkkkkkkkkk.."];
const SPRING=spr(SPRING_ROWS,SPRING_PAL);
const SPRING_C=spr(["................","................",SPRING_ROWS[0],SPRING_ROWS[1],SPRING_ROWS[2],SPRING_ROWS[3],SPRING_ROWS[4],SPRING_ROWS[7],SPRING_ROWS[8],SPRING_ROWS[9],SPRING_ROWS[10],SPRING_ROWS[11]],SPRING_PAL);

function rngFrom(seed){ let s=seed; return ()=>(s=(s*16807)%2147483647)/2147483647; }
function tileCanvas(seed,fn){ const c=mk(16,16),g=c.getContext('2d'),r=rngFrom(seed);
  const px=(x,y,col,w=1,h=1)=>{g.fillStyle=col;g.fillRect(x,y,w,h);}; fn(px,r); return c; }
function dirt(px,r){
  px(0,0,'#7a5236',16,16);
  for(let i=0;i<14;i++) px(Math.floor(r()*15),Math.floor(r()*16),'#5e3c26',2,1);
  for(let i=0;i<4;i++){ const x=Math.floor(r()*14),y=Math.floor(r()*14); px(x,y,'#a8784c',2,1); px(x,y+1,'#4a2e1c',2,1); }
}
function topLayer(px,r,cols){
  for(let x=0;x<16;x++){ const len=1+Math.floor(r()*3); px(x,0,cols[0]); px(x,1,cols[1],1,3); px(x,4,cols[2],1,len); px(x,4+len,cols[3]); }
  for(let i=0;i<3;i++) px(Math.floor(r()*15),1+Math.floor(r()*2),cols[0],2,1);
}
function stoneBlocks(px,r){
  px(0,0,'#7b8494',16,16);
  for(const [x,y,w,h] of [[0,0,8,8],[8,0,8,8],[-4,8,8,8],[4,8,8,8],[12,8,8,8]]){
    px(x,y,'#a3abb9',w,1); px(x,y,'#a3abb9',1,h); px(x,y+h-1,'#555d6b',w,1); px(x+w-1,y,'#555d6b',1,h); }
  for(let i=0;i<6;i++) px(Math.floor(r()*16),Math.floor(r()*16),'#6a7282');
}
const T={
  grass:[0,1,2].map(i=>tileCanvas(11+i,(px,r)=>{dirt(px,r);topLayer(px,r,['#9be06a','#6aa84f','#4f8a3c','#3a2a1e']);})),
  forest:[0,1,2].map(i=>tileCanvas(81+i,(px,r)=>{dirt(px,r);topLayer(px,r,['#7cc45a','#4f8a3c','#3a6a2e','#2a1e16']);})),
  dirt:[0,1,2].map(i=>tileCanvas(21+i,(px,r)=>dirt(px,r))),
  snow:[0,1,2].map(i=>tileCanvas(31+i,(px,r)=>{dirt(px,r);topLayer(px,r,['#ffffff','#e3eaf3','#c3cfdd','#7a8a9e']);})),
  stone:[0,1].map(i=>tileCanvas(41+i,(px,r)=>stoneBlocks(px,r))),

function makeLevel(id){
  const d=DEFS[id], w=d.w, h=d.h;
  const L={id,name:d.name,style:d.style,sky:d.sky,w,h,
    grid:Array.from({length:h},()=>Array(w).fill(' ')),up:Array.from({length:h},()=>Array(w).fill(false)),
    coins:[],crystals:[],movers:[],enemies:[],springs:[],checkpoints:[],doors:[],goal:null,start:{x:48,y:0},decor:[],crumbles:new Map()};
  const set=(c,r,ch)=>{ if(c>=0&&c<w&&r>=0&&r<h) L.grid[r][c]=ch; };
  const rect=(c0,r0,c1,r1,ch='#')=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) set(c,r,ch); };
  let ci=0;
  const b={
    ground:(c0,c1,top=d.top)=>rect(c0,top,c1,h-1),
    rect, clear:(c0,r0,c1,r1)=>rect(c0,r0,c1,r1,' '),
    plat:(r,c0,c1)=>rect(c0,r,c1,r,'='), crumb:(r,c0,c1)=>rect(c0,r,c1,r,'B'),
    crack:(c0,r0,c1,r1)=>rect(c0,r0,c1,r1,'X'), spikes:(r,c0,c1)=>rect(c0,r,c1,r,'^'),
    water:(c0,c1,top)=>{ for(let r=top;r<h;r++) for(let c=c0;c<=c1;c++) if(L.grid[r]?.[c]===' ') L.grid[r][c]='~'; },
    updraft:(c0,c1,r0,r1)=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.up[r]) L.up[r][c]=true; },
    coin:(c,r)=>L.coins.push({x:c*TS+8,y:r*TS+8,got:false}),
    coins:(r,c0,c1)=>{ for(let c=c0;c<=c1;c++) b.coin(c,r); },
    crystal:(c,r)=>{ const cid=id+'-'+(ci++); L.crystals.push({id:cid,x:c*TS+8,y:r*TS+8,got:!!save.crystals[cid]}); },
    enemy:(c,r)=>{ const x=c*TS+2,y=(r+1)*TS-10; L.enemies.push({x,y,x0:x,w:12,h:10,dir:-1,alive:true,squish:0}); },
    spring:(c,r)=>L.springs.push({x:c*TS,top:(r+1)*TS-11,bottom:(r+1)*TS,t:0}),
    cp:(c,r)=>L.checkpoints.push({x:c*TS,bottom:(r+1)*TS,on:false}),
    mover:(c,r,dc,dr,mw=3,period=3.5)=>L.movers.push({x0:c*TS,y0:r*TS,x1:(c+dc)*TS,y1:(r+dr)*TS,w:mw*TS,period,x:c*TS,y:r*TS,dx:0,dy:0}),
    start:(c,r)=>{ L.start={x:c*TS+3,y:(r+1)*TS-14}; },
    goal:(c,r)=>{ L.goal={x:c*TS,bottom:(r+1)*TS}; },
    door:(c,r,world)=>L.doors.push({x:c*TS,bottom:(r+1)*TS,world,t:0})
  };
  d.build(b);
  if(id!=='hub') L.doors.push({x:1*TS,bottom:L.start.y+14,world:0,t:0});
  // Deko
  const rnd=rngFrom(typeof id==='number'?id*101+7:5);
  const free=(c,r,n)=>{ for(let k=1;k<=n;k++) if(r-k<0||L.grid[r-k][c]!==' ') return false; return true; };
  for(let r=1;r<h;r++) for(let c=0;c<w;c++){
    if(L.grid[r][c]!=='#'||L.grid[r-1][c]!==' ') continue;
    const y=r*TS, x=c*TS+rnd()*10, s=L.style;
    if(free(c,r,4)){
      if(s==='forest'&&rnd()<.45) L.decor.push({k:'pine',x,y,h:28+rnd()*30,back:true});
      else if(s==='snow'&&rnd()<.22) L.decor.push({k:'pine',x,y,h:22+rnd()*22,back:true,snow:true});
      else if(s==='meadow'&&rnd()<.1) L.decor.push({k:'tree',x,y,h:26+rnd()*12,back:true});
      else if(s==='stone'&&rnd()<.18) L.decor.push({k:'rock',x,y,s:5+rnd()*7,back:true});
    }
    const wet=(L.grid[r][c-1]==='~'||L.grid[r][c+1]==='~'||L.grid[r+1]?.[c-1]==='~'||L.grid[r+1]?.[c+1]==='~');
    if(s==='lake'&&wet) L.decor.push({k:'reed',x:c*TS+6,y});
    if(rnd()<.45&&s!=='snow') L.decor.push({k:(s==='meadow'||s==='lake')&&rnd()<.45?'flower':'tuft',x:c*TS+rnd()*13,y,col:['#f6ead2','#f28fad','#ffd166','#9ad0ff'][Math.floor(rnd()*4)]});
  }
  return L;
}

const ptrs=new Map(); let keyL=false, keyR=false, keyJump=false;
let L_=false, R_=false, wasBoth=false, jumpSide=0, neutral=false, firstAt=0, standAt=false, lastTap={side:0,t:0};
const TOGETHER_MS=120;
const zl=document.getElementById('zl'), zr=document.getElementById('zr');
function recompute(){
  let l=false,r=false;
  for(const x of ptrs.values()){ if(x<innerWidth/2) l=true; else r=true; }
  const pL=L_, pR=R_;
  L_=l||keyL; R_=r||keyR;
  const now=performance.now();
  if(!pL&&!pR&&(L_||R_)){ firstAt=now; standAt=P.ground&&Math.abs(P.vx)<10; }
  const both=L_&&R_;
  if(both&&!wasBoth){
    const together = P.ground && ((!pL&&!pR&&Math.abs(P.vx)<10) || (now-firstAt<TOGETHER_MS&&standAt));
    if(together){ jumpSide=0; neutral=true; P.vx=0; }
    else { neutral=false; jumpSide = (pL&&!pR) ? 1 : (pR&&!pL) ? -1 : -P.face; }
    triggerJump();
  }
  if((jumpSide===-1&&!L_)||(jumpSide===1&&!R_)) jumpSide=0;
  wasBoth=both;
  zl.classList.toggle('on',L_); zr.classList.toggle('on',R_);
}
function triggerJump(){ if(state==='play') P.buffer=PH.buffer; }
function requestDash(side){
  if(state!=='play'||!save.ab.dash||P.dashCD>0||P.dashT>0) return;
  if(!P.ground&&P.airDash) return;
  P.dashT=PH.dashT; P.dashDir=side; P.face=side; P.dashCD=.35; P.kickT=0; if(!P.ground) P.airDash=true;
  addFlow(4); sfx('dash'); burst(P.x+P.w/2,P.y+P.h/2,C.cream,6,60);
}
addEventListener('pointerdown',e=>{
  if(state!=='play') return;
  const side=e.clientX<innerWidth/2?-1:1, now=performance.now();
  const otherHeld=[...ptrs.values()].some(x=>(x<innerWidth/2?-1:1)!==side);
  if(!otherHeld && lastTap.side===side && now-lastTap.t<260){ requestDash(side); lastTap={side:0,t:0}; }
  else lastTap={side,t:now};
  ptrs.set(e.pointerId,e.clientX); recompute();
});
addEventListener('pointermove',e=>{ if(ptrs.has(e.pointerId)){ ptrs.set(e.pointerId,e.clientX); recompute(); } });
const up=e=>{ if(ptrs.delete(e.pointerId)) recompute(); };
addEventListener('pointerup',up); addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchmove',e=>{ if(state==='play') e.preventDefault(); },{passive:false});
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(['ArrowLeft','a','A'].includes(e.key)) keyL=true;
  else if(['ArrowRight','d','D'].includes(e.key)) keyR=true;
  else if([' ','ArrowUp','w','W'].includes(e.key)){ keyJump=true; triggerJump(); e.preventDefault(); }
  else if(e.key==='Shift') requestDash(P.face);
  recompute();
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keyL=false;
  if(['ArrowRight','d','D'].includes(e.key)) keyR=false;
  if([' ','ArrowUp','w','W'].includes(e.key)) keyJump=false;
  recompute();
});
function clearInput(){ ptrs.clear(); keyL=keyR=keyJump=false; recompute(); }

const AU={ctx:null,master:null,music:null,sfx:null,noise:null,p25:null,p12:null,song:null,step:0,next:0,timer:0,vol:{music:.5,sfx:.7}};
try{ const a=JSON.parse(localStorage.getItem('daumensprung-audio')||'null'); if(a) Object.assign(AU.vol,a); }catch(_){}
function saveAudio(){ try{ localStorage.setItem('daumensprung-audio',JSON.stringify(AU.vol)); }catch(_){} }
function pulseWave(ac,duty){ const n=32, re=new Float32Array(n), im=new Float32Array(n); for(let i=1;i<n;i++) re[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*duty); return ac.createPeriodicWave(re,im); }
function audioInit(){
  if(AU.ctx){ try{ AU.ctx.resume(); }catch(_){} return; }
  const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  try{
    const ac=new A(); AU.ctx=ac;
    AU.master=ac.createGain(); AU.master.gain.value=.9;
    const comp=ac.createDynamicsCompressor(); AU.master.connect(comp); comp.connect(ac.destination);
    AU.music=ac.createGain(); AU.music.gain.value=AU.vol.music; AU.music.connect(AU.master);
    AU.sfx=ac.createGain(); AU.sfx.gain.value=AU.vol.sfx; AU.sfx.connect(AU.master);
    const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=buf;
    AU.p25=pulseWave(ac,.25); AU.p12=pulseWave(ac,.125);
    AU.timer=setInterval(schedule,25);
  }catch(_){ AU.ctx=null; }
}
document.addEventListener('visibilitychange',()=>{ if(!AU.ctx) return; try{ document.hidden?AU.ctx.suspend():AU.ctx.resume(); }catch(_){} });
const mtof=m=>440*Math.pow(2,(m-69)/12);
const atime=()=>AU.ctx.currentTime;
function tone(t,freq,dur,{wave='square',vol=.1,dest=AU.sfx,to=null,attack=.004}={}){
  const ac=AU.ctx, o=ac.createOscillator(), g=ac.createGain();
  if(wave==='p25') o.setPeriodicWave(AU.p25); else if(wave==='p12') o.setPeriodicWave(AU.p12); else o.type=wave;
  o.frequency.setValueAtTime(freq,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,{vol=.1,type='bandpass',freq=1000,to=null,q=1,dest=AU.sfx}={}){
  const ac=AU.ctx, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=AU.noise; f.type=type; f.frequency.setValueAtTime(freq,t); if(to) f.frequency.exponentialRampToValueAtTime(to,t+dur); f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
}
const SFX={
  jump:()=>{ const t=atime(); tone(t,280,.12,{wave:'p25',vol:.11,to:560}); },
  double:()=>{ const t=atime(); tone(t,460,.08,{wave:'p25',vol:.1,to:820}); tone(t+.06,700,.1,{wave:'p12',vol:.08,to:1200}); },
  kick:()=>{ const t=atime(); noise(t,.06,{vol:.14,freq:2500}); tone(t,380,.1,{wave:'p25',vol:.1,to:700}); },
  land:()=>{ const t=atime(); noise(t,.07,{vol:.16,type:'lowpass',freq:500}); },
  coin:()=>{ const t=atime(); tone(t,988,.06,{wave:'p25',vol:.08}); tone(t+.06,1319,.16,{wave:'p25',vol:.08}); },
  crystal:()=>{ const t=atime(); [72,76,79,84,88].forEach((m,i)=>tone(t+i*.05,mtof(m),.25,{wave:'triangle',vol:.14})); tone(t+.25,mtof(96),.4,{wave:'p12',vol:.05}); },
  stomp:()=>{ const t=atime(); tone(t,240,.14,{wave:'square',vol:.11,to:70}); noise(t,.08,{vol:.12,type:'lowpass',freq:900}); },
  dash:()=>{ const t=atime(); noise(t,.2,{vol:.2,freq:500,to:3500,q:2}); },
  spring:()=>{ const t=atime(); tone(t,180,.3,{wave:'triangle',vol:.18,to:900}); },
  crumble:()=>{ const t=atime(); noise(t,.3,{vol:.08,type:'lowpass',freq:700}); },
  smash:()=>{ const t=atime(); noise(t,.4,{vol:.3,freq:900,q:.7}); tone(t,120,.2,{wave:'square',vol:.1,to:50}); },
  hurt:()=>{ const t=atime(); tone(t,520,.45,{wave:'p25',vol:.11,to:90}); },
  splash:()=>{ const t=atime(); noise(t,.4,{vol:.2,freq:1200,to:300}); },
  checkpoint:()=>{ const t=atime(); tone(t,660,.1,{wave:'p25',vol:.09}); tone(t+.1,990,.2,{wave:'p25',vol:.09}); },
  door:()=>{ const t=atime(); tone(t,300,.4,{wave:'triangle',vol:.15,to:1200}); noise(t,.4,{vol:.06,freq:800,to:4000}); },
  fanfare:()=>{ const t=atime(); [[67,0],[72,.12],[76,.24],[79,.36],[84,.5]].forEach(([m,d])=>tone(t+d,mtof(m),d===.5?.7:.14,{wave:'p25',vol:.11}));
    [60,64,67].forEach(m=>tone(t+.5,mtof(m),.7,{wave:'triangle',vol:.1})); },
  tier:n=>{ const t=atime(); tone(t,mtof(76+n*4),.15,{wave:'p12',vol:.08}); tone(t+.07,mtof(83+n*4),.22,{wave:'p12',vol:.08}); }
};
function sfx(name,arg){ if(!AU.ctx||AU.vol.sfx<=0) return; try{ SFX[name](arg); }catch(_){} }

// Bass: R Grundton, F Quinte, O Oktave. Schichten wachsen mit dem Schwung.
const SCALES={major:[0,2,4,5,7,9,11],mixo:[0,2,4,5,7,9,10],minor:[0,2,3,5,7,8,10],lydian:[0,2,4,6,7,9,11]};

    lead:["1-3-5-3-8---5-3-","2-5-7-5-9---7-5-","6-8-3-1-6---5-3-","4-6-8-6-5-4-3-2-"],
    bass:"R---.-R-F---.-R-",kick:"x...x...x...x...",snare:"....x.......x...",hat:"x.x.x.x.x.x.x.x."},

    lead:["5-5-8-5-7-8-9---","7-9-7-4-2---4-5-","6-8-6-4-6---8-9-","8---7-5-3-5-1---"],
    bass:"R-R-O-R-R-R-F-O-",kick:"x.....x.x.......",snare:"....x.......x...",hat:"xxxxxxxxxxxxxxxx"},
  2:{bpm:108,root:52,scale:'minor',chords:[1,6,7,1],

    bass:"R--R--R-F--F--O-",kick:"x..x..x.x..x....",snare:"....x.......x..x",hat:"x.x.x.x.x.x.x.x."},

    bass:"R-------F-------",kick:"x.......x.......",snare:"............x...",hat:"..x...x...x...x."},
  4:{bpm:90,root:57,scale:'minor',chords:[1,4,6,5],
    lead:["8-------5---3---","6-------4---8---","3-------8---6---","7-------5---2---"],
    bass:"R-------R---F---",kick:"x...............",snare:"........x.......",hat:"....x.......x..."}
};
function playStep(i,t){
  const S=AU.song, bar=Math.floor(i/16)%4, st=i%16, sd=60/S.bpm/4, ch=S.chords[bar], T=L?tier():0, sc=SCALES[S.scale];
  const deg=d=>{ const k=d-1; return sc[((k%7)+7)%7]+12*Math.floor(k/7); };
  const hold=(str,from)=>{ let n=1; while(str[from+n]==='-') n++; return n; };
  const M=AU.music;
  const b=S.bass[st];
  if(b==='R'||b==='F'||b==='O'){ const n=S.root-24+(b==='F'?deg(ch+4):deg(ch)+(b==='O'?12:0)); tone(t,mtof(n),sd*hold(S.bass,st)*.95,{wave:'triangle',vol:.22,dest:M,attack:.005}); }
  const l=S.lead[bar][st];
  if(l>='1'&&l<='9'){ const n=S.root+12+deg(+l), dur=sd*hold(S.lead[bar],st)*.9;
    tone(t,mtof(n),dur,{wave:'p25',vol:.085,dest:M,attack:.006});
    if(T>=3) tone(t,mtof(n+12),dur,{wave:'p12',vol:.035,dest:M}); }
  if(T>=2){ const tones=[ch,ch+2,ch+4,ch+7]; tone(t,mtof(S.root+12+deg(tones[st%4])),sd*.8,{wave:'p12',vol:.03,dest:M}); }
  if(S.kick[st]==='x') tone(t,150,.14,{wave:'sine',vol:.42,to:45,dest:M});
  if(T>=1){
    if(S.snare[st]==='x') noise(t,.13,{vol:.16,freq:1800,dest:M});
    if(S.hat[st]==='x') noise(t,.035,{vol:.05,type:'highpass',freq:7000,dest:M});
  }
}
function schedule(){
  if(!AU.ctx||!AU.song) return;
  const ac=AU.ctx; if(AU.next<ac.currentTime-.2) AU.next=ac.currentTime+.05;
  while(AU.next<ac.currentTime+.12){ try{ playStep(AU.step,AU.next); }catch(_){} AU.next+=60/AU.song.bpm/4; AU.step++; }
}
function playSong(id){ if(!AU.ctx) return; const s=SONGS[id]||SONGS.hub; if(AU.song===s) return; AU.song=s; AU.step=0; AU.next=AU.ctx.currentTime+.15; }

// ---------- Physik ----------
function wallContact(){
  const r0=Math.floor((P.y+2)/TS), r1=Math.floor((P.y+P.h-2)/TS);
  const cl=Math.floor((P.x-1)/TS), cr=Math.floor((P.x+P.w+.5)/TS);
  for(let r=r0;r<=r1;r++){ if(solid(cr,r)) return 1; if(solid(cl,r)) return -1; }
  return 0;
}
function inUpdraft(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.up[r]?.[c]) return true;
  return false;
}
function breakCrack(c,r){
  const st=[[c,r]];
  while(st.length){ const [x,y]=st.pop(); if(tileAt(x,y)!=='X') continue; L.grid[y][x]=' ';
    for(let i=0;i<4;i++) particles.push({x:x*TS+Math.random()*16,y:y*TS+Math.random()*16,vx:(Math.random()-.5)*120,vy:-Math.random()*120,t:.6,col:'#b3a8c2'});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  shake=.15; addFlow(6); sfx('smash');
}
function moveX(dt){
  P.x+=P.vx*dt;
  const side=Math.sign(P.vx); if(!side) return;
  const r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  const c=side>0?Math.floor((P.x+P.w)/TS):Math.floor(P.x/TS);
  if(P.dashT>0) for(let r=r0;r<=r1;r++) if(tileAt(c,r)==='X') breakCrack(c,r);
  let hit=false; for(let r=r0;r<=r1;r++) if(solid(c,r)) hit=true;
  if(hit){
    if(Math.abs(P.vx)>70&&P.dashT<=0&&!(save.ab.wall&&!P.ground)) addFlow(-12);
    P.x=side>0?c*TS-P.w:(c+1)*TS; P.vx=0; P.dashT=0;
  }
}
function land(){ if(P.vy>200){P.squash=1;dust(4);sfx('land');} P.vy=0; P.ground=true; }
function moveY(dt){
  const wasGround=P.ground, prevBottom=P.y+P.h; P.ground=false;
  P.y+=P.vy*dt;
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS);
  if(P.vy>0){ const r=Math.floor((P.y+P.h)/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)){
      P.y=r*TS-P.h; if(wasGround) P.vy=0; else land(); P.ground=true; break; } }
  else if(P.vy<0){ const r=Math.floor(P.y/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)){P.y=(r+1)*TS;P.vy=0;break;} }
  P.plat=null;
  if(P.vy>=0) for(const m of L.movers){
    if(P.x+P.w>m.x+1 && P.x<m.x+m.w-1 && prevBottom<=m.y+2+Math.max(0,-m.dy) && P.y+P.h>=m.y){
      P.y=m.y-P.h; if(!wasGround) land(); else P.vy=0; P.ground=true; P.plat=m; break; }
  }
}
function dust(n){ for(let i=0;i<n;i++) particles.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-.5)*60,vy:-Math.random()*40,t:.35,col:C.cream}); }
function burst(x,y,col,n=8,sp=70){ for(let i=0;i<n;i++){const a=i/n*Math.PI*2; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.4,col});} }
function doJump(v){ P.vy=v; P.buffer=0; P.coyote=0; P.ground=false; P.plat=null; P.squash=-1; P.hold=0; P.rising=true; P.cut=false; dust(5); }
function hazard(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r);
    if(t==='^'){ const x=c*TS+3,y=r*TS+8; if(P.x+P.w>x&&P.x<x+10&&P.y+P.h>y&&P.y<y+8) return 'spike'; }
    if(t==='~'){ const top=tileAt(c,r-1)==='~'?r*TS:r*TS+6; if(P.y+P.h>top+4) return 'water'; }
  }
  return null;
}

function update(dt){
  if(state!=='play') return;
  time+=dt;
  for(const m of L.movers){ const s=(1-Math.cos(clock/m.period*Math.PI*2))/2;
    const nx=m.x0+(m.x1-m.x0)*s, ny=m.y0+(m.y1-m.y0)*s; m.dx=nx-m.x; m.dy=ny-m.y; m.x=nx; m.y=ny; }
  if(P.plat){ P.x+=P.plat.dx; P.y+=P.plat.dy; }
  P.wallDir=(!P.ground&&save.ab.wall)?wallContact():0;

  // Richtung: nur der Laufdaumen lenkt
  let dir;
  if(jumpSide){ const runHeld=jumpSide===-1?R_:L_; if(!runHeld&&P.ground&&P.buffer<=0) jumpSide=0; dir=runHeld?-jumpSide:0; }
  if(!jumpSide) dir=(L_&&!R_)?-1:(R_&&!L_)?1:0;
  if(P.kickT>0){ P.kickT-=dt; dir=0; }

  const updraft=save.ab.glide&&!P.ground&&inUpdraft();
  const held=jumpSide!==0||(neutral&&(L_||R_))||keyJump;
  let maxS=PH.max+tier()*PH.tierBonus;
  if(updraft&&held) maxS=Math.min(maxS,PH.upSpeed);

  if(P.dashT>0){
    P.dashT-=dt; P.vx=P.dashDir*PH.dashSpeed; P.vy=0;
    if(P.dashT<=0) P.vx=P.dashDir*maxS;
  } else {
    const acc=P.ground?PH.accG:PH.accA, fr=P.ground?PH.fricG:PH.fricA;
    const before=Math.abs(P.vx);
    if(dir){ P.vx+=dir*acc*dt; P.face=dir; }
    else if(P.kickT<=0){ const s=Math.sign(P.vx); P.vx-=s*fr*dt; if(Math.sign(P.vx)!==s) P.vx=0; }
    if(Math.abs(P.vx)>maxS&&P.kickT<=0) P.vx=Math.sign(P.vx)*Math.max(maxS,Math.min(Math.abs(P.vx),before-350*dt));
  }
  P.dashCD-=dt;

  // Sprünge: Boden, Wand, Luft
  P.coyote=P.ground?PH.coyote:P.coyote-dt;
  P.buffer-=dt;
  if(P.buffer>0&&P.dashT<=0){
    if(P.coyote>0){ doJump(-PH.jump); sfx('jump'); }
    else if(P.wallDir){ doJump(-PH.kickY); sfx('kick'); P.vx=-P.wallDir*PH.kickX; P.face=-P.wallDir; P.kickT=PH.kickT; P.usedDouble=false; addFlow(5);
      for(let i=0;i<5;i++) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h/2,vx:-P.wallDir*Math.random()*60,vy:(Math.random()-.5)*60,t:.35,col:C.cream}); }
    else if(save.ab.double&&!P.usedDouble){ P.usedDouble=true; doJump(-PH.airJump); sfx('double'); addFlow(3); burst(P.x+P.w/2,P.y+P.h,C.sky,6,50); }
  }

  if(P.dashT<=0){
    let gMul=1;
    if(P.rising){
      if(P.vy>=0) P.rising=false;
      else if(P.cut) gMul=PH.cutGrav;
      else if(held&&P.hold<PH.holdMax){ P.hold+=dt; gMul=PH.holdGrav; }
      else if(!held&&P.hold<PH.holdMax){ P.cut=true; gMul=PH.cutGrav; }
    }
    P.vy=Math.min(PH.fall,P.vy+PH.grav*gMul*dt);
    if(P.wallDir&&dir===P.wallDir&&P.vy>PH.slide){ P.vy=PH.slide; if(Math.random()<.3) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h,vx:0,vy:-10,t:.3,col:C.cream}); }
    P.glide=save.ab.glide&&!P.ground&&held&&!P.wallDir&&(P.vy>0||updraft);
    if(P.glide&&updraft) P.vy=Math.max(-PH.upMax,P.vy-PH.upLift*dt);
    else if(P.glide&&P.vy>PH.glideFall) P.vy=PH.glideFall;
  }
  moveX(dt); moveY(dt);
  if(P.ground||P.wallDir){ P.usedDouble=false; P.airDash=false; }
  if(neutral&&P.ground&&!P.rising&&P.buffer<=0) neutral=false;
  P.squash*=Math.pow(.001,dt);
  if(P.ground&&dir) P.run+=dt*Math.abs(P.vx)/10;

  // Schwung
  const sp=Math.abs(P.vx);
  if(P.dashT>0){}
  else if(sp>=PH.max*.85) addFlow((P.ground?13:8)*dt);
  else if(P.ground&&sp<25) addFlow(-40*dt);
  else addFlow(-5*dt);
  const Tn=tier(); if(Tn>lastTier) sfx('tier',Tn); lastTier=Tn;
  bestTier=Math.max(bestTier,Tn);
  trailT-=dt;
  if((tier()>=2||P.dashT>0)&&trailT<=0){ trail.push({x:P.x,y:P.y,face:P.face,t:.25}); trailT=.04; }
  for(const t of trail) t.t-=dt; trail=trail.filter(t=>t.t>0);
  if(tier()===3&&Math.random()<.3) particles.push({x:P.x+Math.random()*P.w,y:P.y+Math.random()*P.h,vx:-P.vx*.2,vy:-20,t:.4,col:C.gold});

  // Bröckelblöcke
  if(P.ground&&!P.plat){ const r=Math.floor((P.y+P.h+1)/TS);
    for(let c=Math.floor(P.x/TS);c<=Math.floor((P.x+P.w-.01)/TS);c++){ const k=c+','+r; if(tileAt(c,r)==='B'&&!L.crumbles.has(k)) L.crumbles.set(k,{t:.45,gone:false}); } }
  for(const [k,b] of L.crumbles){
    b.t-=dt; const [c,r]=k.split(',').map(Number);
    if(!b.gone&&b.t<=0){ L.grid[r][c]=' '; b.gone=true; b.t=3.5; sfx('crumble'); for(let i=0;i<5;i++) particles.push({x:c*TS+Math.random()*16,y:r*TS+8,vx:(Math.random()-.5)*30,vy:Math.random()*20,t:.6,col:C.crumble}); }
    else if(b.gone&&b.t<=0){ const over=P.x+P.w>c*TS&&P.x<c*TS+TS&&P.y+P.h>r*TS&&P.y<r*TS+TS; if(!over){ L.grid[r][c]='B'; L.crumbles.delete(k);} }
  }
  // Federn
  for(const s of L.springs){ s.t=Math.max(0,s.t-dt);
    if(P.vy>0&&P.x+P.w>s.x+2&&P.x<s.x+14&&P.y+P.h>=s.top&&P.y+P.h<=s.top+10){
      P.y=s.top-P.h; P.vy=-PH.spring; P.rising=true; P.cut=false; P.hold=PH.holdMax; P.ground=false; P.usedDouble=false; s.t=.25; P.squash=-1; addFlow(4); sfx('spring'); burst(s.x+8,s.top,C.cream,6,50); } }
  // Käfer
  for(const e of L.enemies){
    if(!e.alive){ e.squish=Math.max(0,e.squish-dt); continue; }
    e.x+=e.dir*28*dt;
    const front=e.dir>0?e.x+e.w:e.x, fc=Math.floor(front/TS), er=Math.floor((e.y+e.h-1)/TS);
    if(solid(fc,er)||!solid(fc,er+1)){ e.dir*=-1; e.x+=e.dir*2; }
    if(P.x+P.w>e.x+1&&P.x<e.x+e.w-1&&P.y+P.h>e.y+1&&P.y<e.y+e.h){
      if(P.dashT>0||(P.vy>0&&P.y+P.h-e.y<9)){ e.alive=false; e.squish=.5; sfx('stomp'); if(P.dashT<=0){ P.vy=-PH.stomp; P.rising=true; P.cut=false; P.hold=0; P.usedDouble=false; } addFlow(12); burst(e.x+6,e.y+4,C.beetle,8,60); }
      else if(!dbg.god){ die(); return; }
    }
  }
  // Münzen, Kristalle
  for(const k of L.coins) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<10&&Math.abs(P.y+P.h/2-k.y)<12){ k.got=true; levelCoins++; sfx('coin'); save.wallet+=1+tier(); addFlow(1.5); burst(k.x,k.y,C.gold); }
  for(const k of L.crystals) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<11&&Math.abs(P.y+P.h/2-k.y)<13){ k.got=true; save.crystals[k.id]=true; sfx('crystal'); persist(); addFlow(20); burst(k.x,k.y,C.sky,12,80); showMsg('Kristall gefunden!'); }
  // Checkpoints
  for(const k of L.checkpoints) if(!k.on&&P.x>k.x&&Math.abs(P.y+P.h-k.bottom)<48){ k.on=true; cpPos={x:k.x+3,y:k.bottom-P.h}; burst(k.x+1,k.bottom-30,C.ember,10,60); showMsg('Checkpoint'); sfx('checkpoint'); }
  // Gefahren
  const hz=hazard();
  if(hz&&!dbg.god){ if(hz==='water') sfx('splash'); if(hz==='water') for(let i=0;i<10;i++) particles.push({x:P.x+5,y:P.y+P.h,vx:(Math.random()-.5)*80,vy:-60-Math.random()*80,t:.6,col:C.waterL}); die(); return; }
  if(P.y>L.h*TS+24){ die(); return; }
  // Ziel / Türen
  if(L.goal&&P.x+P.w>L.goal.x+2&&P.x<L.goal.x+14&&P.y+P.h>L.goal.bottom-28&&P.y<L.goal.bottom){ finishLevel(); return; }
  for(const d of L.doors){
    const over=P.x+P.w>d.x+2&&P.x<d.x+14&&Math.abs(P.y+P.h-d.bottom)<20;
    if(!over) d.armed=true; // eine Tür wirkt erst, nachdem man sie einmal verlassen hat
    const inside=d.armed&&over&&P.ground&&Math.abs(P.y+P.h-d.bottom)<4&&Math.abs(P.vx)<25;
    d.t=inside?d.t+dt:Math.max(0,d.t-dt*2);
    if(d.t>=.7){ clearInput(); sfx('door'); const n=d.world; if(n===0){ const w=L.id; loadLevel('hub',w); showMsg('Hubwelt'); } else { loadLevel(n); showMsg(`Welt ${n} · ${NAMES[n]}`); } return; }
  }
}

}
function camera(dt){
  const tx=P.x-viewW*.4+P.face*20;
  camX+=(tx-camX)*Math.min(1,dt*6);
  camX=Math.max(0,Math.min(L.w*TS-viewW,camX));
  const ty=P.y+P.h/2-VIEW_H*.55;
  camY+=(ty-camY)*Math.min(1,dt*5);
  camY=Math.max(0,Math.min(L.h*TS-VIEW_H,camY));
}

// ---------- Debug ----------
const PH_DEFAULT={...PH}, VIEW_DEFAULT=180, TUNE_KEY='daumensprung-tune';
const dbg={info:false,hitbox:false,god:false};
const TUNES=[
  ['max','Höchsttempo Laufen',20,150,1],
  ['accG','Beschleunigen am Boden',100,1500,10],
  ['fricG','Abbremsen am Boden',100,1500,10],
  ['accA','Lenken in der Luft',50,1200,10],
  ['jump','Sprungkraft',200,420,5],
  ['grav','Schwerkraft',600,1800,10],
  ['holdMax','Haltezeit hoher Sprung (s)',0.05,0.4,0.01],
  ['airJump','Doppelsprung-Kraft',150,400,5],
  ['tierBonus','Tempo-Bonus je Schwungstufe',0,30,1],
  ['dashSpeed','Dash-Tempo',80,400,5],
  ['dashT','Dash-Dauer (s)',0.08,0.4,0.01],
  ['kickX','Wandsprung seitlich',30,200,5],
  ['kickY','Wandsprung hoch',200,420,5],
  ['glideFall','Fallen beim Gleiten',10,100,1],
  ['viewH','Zoom: sichtbare Höhe (kleiner = näher)',120,270,6]];
try{ const t=JSON.parse(localStorage.getItem(TUNE_KEY)||'null'); if(t){ Object.assign(PH,t.ph||{}); if(t.viewH) VIEW_H=t.viewH; Object.assign(dbg,t.dbg||{}); } }catch(_){}
function tuneValues(){ const ph={}; for(const [k] of TUNES) if(k!=='viewH') ph[k]=PH[k]; return {ph,viewH:VIEW_H}; }
function saveTune(){ try{ localStorage.setItem(TUNE_KEY,JSON.stringify({...tuneValues(),dbg})); }catch(_){} }
const fmt=(v,step)=>step<1?(+v).toFixed(2):String(Math.round(v));
const debugEl=document.getElementById('debug'), tunesEl=document.getElementById('tunes'), dbgOut=document.getElementById('dbgout'), dbgInfo=document.getElementById('dbginfo');
function buildTunes(){
  tunesEl.innerHTML='';
  for(const [k,label,min,max,step] of TUNES){
    const id='t-'+k, val=k==='viewH'?VIEW_H:PH[k];
    const lab=document.createElement('label'); lab.htmlFor=id; lab.textContent=label;
    const inp=document.createElement('input'); Object.assign(inp,{type:'range',id,min,max,step,value:val});
    const out=document.createElement('output'); out.htmlFor=id; out.textContent=fmt(val,step);
    inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); if(k==='viewH'){ VIEW_H=v; resize(); } else PH[k]=v; out.textContent=fmt(v,step); saveTune(); });
    tunesEl.append(lab,inp,out);
  }
  for(const k of ['info','hitbox','god']){ const cb=document.getElementById('d-'+k); cb.checked=dbg[k]; }
  for(const a of ['double','wall','dash','glide']){ const cb=document.getElementById('a-'+a); cb.checked=save.ab[a]; }
}
for(const k of ['info','hitbox','god']) document.getElementById('d-'+k).addEventListener('change',e=>{ dbg[k]=e.target.checked; dbgInfo.hidden=!dbg.info; saveTune(); });
for(const a of ['double','wall','dash','glide']) document.getElementById('a-'+a).addEventListener('change',e=>{ save.ab[a]=e.target.checked; persist(); });
let debugFrom='start';
const pauseEl=document.getElementById('pause');
for(const k of ['music','sfx']){ const inp=document.getElementById('v-'+k), out=document.getElementById('o-'+k);
  inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); AU.vol[k]=v; if(AU[k]) AU[k].gain.value=v; out.textContent=Math.round(v*100)+'%'; saveAudio(); });
  inp.addEventListener('change',()=>{ if(k==='sfx') sfx('coin'); }); }
function syncVol(){ for(const k of ['music','sfx']){ document.getElementById('v-'+k).value=AU.vol[k]; document.getElementById('o-'+k).textContent=Math.round(AU.vol[k]*100)+'%'; } }
function openPause(){ syncVol(); state='pause'; clearInput(); document.getElementById('phub').hidden=(L.id==='hub'); pauseEl.hidden=false; }
function resume(){ pauseEl.hidden=true; state='play'; last=performance.now(); }
document.getElementById('presume').addEventListener('click',resume);
document.getElementById('phub').addEventListener('click',()=>{ const w=L.id; loadLevel('hub',w); resume(); });
document.getElementById('pmain').addEventListener('click',()=>{ pauseEl.hidden=true; state='start'; document.getElementById('wipeinfo').hidden=true; startEl.hidden=false; });
function openDebug(from){ debugFrom=from; if(from==='pause') pauseEl.hidden=true; else startEl.hidden=true; dbgOut.hidden=true; buildTunes(); debugEl.hidden=false; }
// Debug ist versteckt: „Spielen“ bzw. „☰ Menü“ 1,5 Sekunden gedrückt halten
function longPress(el,ms,onLong,onShort){
  let timer=0, fired=false;
  el.addEventListener('pointerdown',e=>{ e.stopPropagation(); fired=false; clearTimeout(timer); timer=setTimeout(()=>{ fired=true; onLong(); },ms); });
  for(const ev of ['pointerup','pointerleave','pointercancel']) el.addEventListener(ev,()=>clearTimeout(timer));
  el.addEventListener('click',e=>{ if(fired){ fired=false; e.preventDefault(); return; } onShort(); });
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
longPress(document.getElementById('play'),1500,()=>openDebug('start'),begin);
const gearBtn=document.getElementById('gear');
longPress(gearBtn,1500,()=>{ if(state==='play'){ state='pause'; clearInput(); openDebug('pause'); } },()=>{ if(state==='play') openPause(); });
document.getElementById('dbgclose').addEventListener('click',()=>{ debugEl.hidden=true; if(debugFrom==='pause') resume(); else startEl.hidden=false; });
document.getElementById('dbgreset').addEventListener('click',()=>{ Object.assign(PH,PH_DEFAULT); VIEW_H=VIEW_DEFAULT; resize(); saveTune(); buildTunes(); });
document.getElementById('dbgcopy').addEventListener('click',()=>{
  const txt=JSON.stringify(tuneValues(),null,1); dbgOut.value=txt; dbgOut.hidden=false;
  const sel=()=>{ dbgOut.focus(); dbgOut.select(); };
  try{ navigator.clipboard.writeText(txt).then(()=>showMsg('Werte kopiert'),sel); }catch(_){ sel(); }
});
dbgInfo.hidden=!dbg.info;

// ---------- HUD ----------
const flowFill=document.getElementById('flowfill'), flowLbl=document.getElementById('flowlbl'), hc=document.getElementById('hc'), hr=document.getElementById('hr');
function updateHud(){
  if(!L) return;
  if(dbg.info) dbgInfo.textContent=`vx ${P.vx.toFixed(0)} · vy ${P.vy.toFixed(0)} · max ${(PH.max+tier()*PH.tierBonus).toFixed(0)} · Schwung ${flow.toFixed(0)}`;
  if(L.id==='hub'){
    const total=Object.keys(save.crystals).length;
    hc.textContent=`◆ ${total}/13 · ● ${save.wallet}`;
    hr.innerHTML=['double','wall','dash','glide'].map(a=>`<span class="pill${save.ab[a]?' on':''}">${AB_INFO[a].short}</span>`).join('');
  } else {
    hc.textContent=`◆ ${L.crystals.filter(k=>k.got).length}/${L.crystals.length} · ● ${levelCoins}/${L.coins.length}`;
    hr.textContent=time.toFixed(1)+'s';
  }
  flowFill.style.width=flow+'%';
  flowLbl.textContent=`Schwung ×${tier()+1}`;
}

// ---------- Loop mit festem Zeitschritt ----------
const STEP=1/60; let acc=0, last=performance.now(), hudT=0;
function frame(now){
  let dt=Math.min(.1,(now-last)/1000); last=now;
  if(matchMedia('(orientation: portrait)').matches&&innerWidth<900) dt=0;
  acc+=dt;
  while(acc>=STEP){ clock+=STEP; if(L){ update(STEP); tickParticles(STEP); camera(STEP); } if(shake>0) shake-=STEP; acc-=STEP; }
  if(L) draw();
  hudT-=dt; if(hudT<=0){ updateHud(); hudT=.1; }
  requestAnimationFrame(frame);
}
resize(); loadLevel('hub'); requestAnimationFrame(frame);
window.__dz={playStep,schedule,audioInit,playSong,sfx,SFX,AU,loadLevel,update,P,save,get L(){return L;},setState:s=>{state=s;},finishLevel};
})();
</script>
