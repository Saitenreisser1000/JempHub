<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Supersam</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Canvas, HUD in den Ecken, Touch-Hälften als Overlay. Bewusst nur ein Look (Pixel-Welt im SNES-Stil). */
:root{
  --night:#16233a; --ember:#f2a65a; --cream:#f6ead2; --ink:#0d1524; --dim:rgba(246,234,210,.25); --sky:#7fe0ff;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
.hud{position:fixed;font-family:var(--pixel);font-size:14px;text-shadow:2px 2px 0 var(--ink);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hl{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;align-items:center;gap:10px}
#hc{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);white-space:nowrap}
#hr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:6px;align-items:center}
#home{pointer-events:auto;font-family:var(--pixel);font-size:14px;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);
  min-width:44px;min-height:36px;cursor:pointer}
#home:focus-visible,#gear:focus-visible{outline:2px solid var(--ember)}
#gear{pointer-events:auto;font-family:var(--pixel);font-size:14px;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);min-width:44px;min-height:36px;cursor:pointer}
#debug{justify-content:flex-start;z-index:10}
.tunes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(110px,1.4fr) 3.5em;gap:8px 12px;align-items:center;width:100%;max-width:680px;text-align:left;font-size:11px}
.tunes label{min-width:0}
.tunes input[type=range]{width:100%;accent-color:var(--ember);min-height:28px}
.tunes output{font-variant-numeric:tabular-nums;color:var(--ember);text-align:right}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:11px;max-width:680px}
.checks label{display:flex;align-items:center;gap:6px;min-height:32px}
.checks input{accent-color:var(--ember);width:18px;height:18px}
#dbgout{width:100%;max-width:680px;min-height:80px;font-family:ui-monospace,monospace;font-size:11px;background:#0d1524;color:var(--cream);border:2px solid var(--dim)}
#dbginfo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:ui-monospace,monospace;font-size:11px;
  background:rgba(13,21,36,.7);padding:3px 8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;gap:3px}
.flow small{font-size:10px;opacity:.85}
.flowbar{width:110px;height:8px;background:var(--dim);position:relative;box-shadow:2px 2px 0 var(--ink)}
.flowbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ember)}
.flowbar b{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink);opacity:.6}
.pill{font-size:10px;padding:2px 6px;border:2px solid var(--dim);opacity:.45}
.pill.on{opacity:1;border-color:var(--sky);color:var(--sky)}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:50%;transform:translateX(-50%);font-family:var(--pixel);
  font-size:13px;color:var(--ember);text-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap}
#msg.show{opacity:1;transition:none}
#celebrate{position:fixed;left:0;right:0;top:20%;text-align:center;pointer-events:none;font-family:var(--pixel);--glow:#ffd166;z-index:5}
#celebrate h2{margin:0;font-size:clamp(28px,7vw,56px);color:#ffffff;letter-spacing:.04em;
  text-shadow:0 0 6px var(--glow),0 0 18px var(--glow),0 0 40px var(--glow),3px 3px 0 var(--ink);
  animation:pop .55s cubic-bezier(.2,1.6,.4,1) both,glow 1s ease-in-out .55s infinite alternate}
#celebrate p{margin:10px 0 0;font-size:14px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);animation:rise .4s .45s both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.4)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#celebrate h2,#celebrate p{animation:none}}
.zone{position:fixed;bottom:0;top:0;width:50%;pointer-events:none;display:flex;align-items:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);box-sizing:border-box;transition:background .08s}
.zone.l{left:0;justify-content:flex-start;padding-left:calc(env(safe-area-inset-left,0px) + 16px);border-right:1px dashed rgba(246,234,210,.1)}
.zone.r{right:0;justify-content:flex-end;padding-right:calc(env(safe-area-inset-right,0px) + 16px)}
.zone span{font-family:var(--pixel);font-size:18px;opacity:.3;text-shadow:2px 2px 0 var(--ink)}
.zone.on{background:linear-gradient(to top,rgba(242,166,90,.16),transparent 40%)}
.zone.on span{opacity:.9;color:var(--ember)}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(13,21,36,.8);text-align:center;touch-action:pan-y;font-family:var(--pixel);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.panel h1{margin:0;font-size:clamp(24px,5vw,42px);color:var(--ember);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel h2{margin:0;font-size:18px;color:var(--sky);text-shadow:2px 2px 0 var(--ink)}
.panel p{margin:0;max-width:40em;line-height:1.6;font-size:12px;color:var(--cream)}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 16px;text-align:left;font-size:11px;opacity:.9}
.keys b{color:var(--ember);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--pixel);font-size:15px;background:var(--ember);color:var(--ink);border:0;padding:11px 20px;min-height:44px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--dim);box-shadow:none;font-size:12px}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.ability{border:2px solid var(--sky);padding:10px 16px;max-width:36em}
.stats{font-size:13px;line-height:1.8}
#start{background:linear-gradient(to top,rgba(13,21,36,.8),rgba(13,21,36,0) 38%);justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#rotate{display:none;z-index:20;background:var(--night)}
@media (orientation:portrait){#rotate{display:flex}}
.phone{width:40px;height:66px;border:4px solid var(--cream);border-radius:8px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="zone l" id="zl"><span>◀</span></div>
<div class="zone r" id="zr"><span>▶</span></div>
<div class="hud" id="hl">
  <button id="home" type="button" aria-label="Zurück zur Hubwelt">⌂ Hub</button>
  <button id="gear" type="button" aria-label="Menü öffnen">☰ Menü</button>
  <div class="flow"><small id="flowlbl">Schwung ×1</small><div class="flowbar"><i id="flowfill"></i><b style="left:33%"></b><b style="left:66%"></b></div></div>
</div>
<div class="hud" id="hc">◆ 0/3 · ● 0</div>
<div class="hud" id="hr"></div>
<div id="msg"></div>
<div id="celebrate" hidden><h2 id="celebname"></h2><p id="celebtip"></p></div>

<div class="panel" id="start" aria-label="Supersam">
  <div class="row">
    <button class="btn" id="play" type="button">Spielen</button>
    <button class="btn ghost" id="wipe" type="button">Fortschritt löschen</button>
  </div>
  <p id="wipeinfo" hidden>Fortschritt gelöscht.</p>
</div>

<div class="panel" id="done" hidden>
  <h1 id="donetitle">Geschafft!</h1>
  <div class="stats" id="donestats"></div>
  <div class="ability" id="donenew" hidden><h2 id="newname"></h2><p id="newhow"></p></div>
  <p id="donehint"></p>
  <button class="btn" id="donebtn" type="button">Zur Hubwelt</button>
</div>

<div class="panel" id="pause" hidden>
  <h1>Pause</h1>
  <div class="row" style="flex-direction:column;align-items:stretch;min-width:220px">
    <button class="btn" id="presume" type="button">Weiter</button>
    <button class="btn ghost" id="phub" type="button">Zur Hubwelt</button>
    <button class="btn ghost" id="pmain" type="button">Hauptmenü</button>
  </div>
  <div class="tunes" style="max-width:380px">
    <label for="v-music">Musik</label><input type="range" id="v-music" min="0" max="1" step="0.05"><output id="o-music" for="v-music"></output>
    <label for="v-sfx">Effekte</label><input type="range" id="v-sfx" min="0" max="1" step="0.05"><output id="o-sfx" for="v-sfx"></output>
  </div>
  <div class="checks"><label><input type="checkbox" id="v-vib"> Vibration</label></div>
</div>
<div class="panel" id="debug" hidden>
  <button class="btn ghost" id="dbgx" type="button" style="align-self:flex-end">✕ Schließen</button>
  <h1>Debug</h1>
  <p>Änderungen wirken sofort und bleiben in diesem Browser gespeichert.</p>
  <div class="tunes" id="tunes"></div>
  <div class="checks">
    <label><input type="checkbox" id="d-info"> Messwerte anzeigen</label>
    <label><input type="checkbox" id="d-hitbox"> Hitboxen zeigen</label>
    <label><input type="checkbox" id="d-god"> Unverwundbar</label>
    <label><input type="checkbox" id="d-fx"> Licht-Effekte (WebGL)</label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="a-double"> Doppelsprung</label>
    <label><input type="checkbox" id="a-wall"> Wandsprung</label>
    <label><input type="checkbox" id="a-dash"> Dash</label>
    <label><input type="checkbox" id="a-glide"> Gleiten</label>
  </div>
  <div class="row">
    <button class="btn ghost" id="dbgreset" type="button">Werte zurücksetzen</button>
    <button class="btn ghost" id="dbgcopy" type="button">Werte kopieren</button>
    <button class="btn" id="dbgclose" type="button">Weiter</button>
  </div>
  <textarea id="dbgout" hidden readonly aria-label="Aktuelle Werte"></textarea>
</div>
<div id="dbginfo" hidden></div>

<div class="panel" id="rotate">
  <div class="phone"></div>
  <p>Bitte dreh dein Handy ins Querformat.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const bgCanvas=document.createElement('canvas'), bgCtx=bgCanvas.getContext('2d');
const TS=16, SKY_H=270; let VIEW_H=120; // VIEW_H: sichtbare Welthöhe (kleiner = näher dran)
const C={ember:'#f2a65a',cream:'#f6ead2',ink:'#0d1524',gold:'#ffd166',sky:'#7fe0ff',
  grassD:'#457a3a',earthD:'#523726',stoneD:'#5b6372',stoneL:'#98a1b0',water:'#3f7fb0',waterL:'#7fb8dc',waterD:'#2e5f88',
  pine:'#2f5e3f',pineD:'#234a31',leaf:'#4f8a43',bark:'#5a3b26',beetle:'#d84a4a',crumble:'#c69a6a'};

// ---------- Speicherstand ----------
const SAVE_KEY='daumensprung-v2';
const blankSave=()=>({ab:{double:false,wall:false,dash:false,glide:false},crystals:{},stars:{},done:{},best:{},wallet:0});
let save=blankSave();
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s){ save=Object.assign(blankSave(),s); save.ab=Object.assign(blankSave().ab,s.ab||{}); } }catch(_){}
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(_){} }

const NAMES={0:'Hubwelt',1:'Wald',2:'Felsen',3:'See',4:'Gipfel'};
const WORLD_COL={0:'#f6ead2',1:'#6aa84f',2:'#c69a6a',3:'#4fa3d9',4:'#b9a7ff'};
const AB_OF={1:'double',2:'wall',3:'dash',4:'glide'};
const AB_TIP={double:'In der Luft nochmal springen',wall:'An Wänden abstoßen und klettern',dash:'Laufdaumen zweimal tippen',glide:'Daumen halten und segeln'};
const AB_INFO={
  double:{name:'Doppelsprung',short:'2×',how:'In der Luft den Sprungdaumen kurz heben und wieder aufsetzen. Damit erreichst du Kanten, die etwa doppelt so hoch liegen.'},
  wall:{name:'Wandsprung',short:'Wand',how:'Lauf in der Luft gegen eine Wand, dann rutschst du langsam. Setz den Sprungdaumen auf, um dich abzustoßen. Bleib mit dem Laufdaumen zur Wand gedrückt und wiederhole das, um hochzuklettern.'},
  dash:{name:'Dash',short:'Dash',how:'Tipp den Laufdaumen schnell zweimal. Du schießt nach vorn, auch einmal pro Sprung in der Luft. Rissige Felsen zerbrechen dabei.'},
  glide:{name:'Gleiten',short:'Gleit',how:'Halte im Fallen einen Daumen als Sprungdaumen gedrückt, dann segelst du langsam. In hellen Aufwinden trägt dich das Blatt nach oben.'}
};
const NEED_FOR_DOOR={2:'double',3:'wall',4:'dash'};

// ---------- Sprites (SNES-Stil) ----------
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function spr(rows,pal){ const h=rows.length,w=rows[0].length,c=mk(w,h),g=c.getContext('2d');
  rows.forEach((row,y)=>{ if(row.length!==w) console.warn('Sprite-Zeile falsch',y,row);
    for(let x=0;x<row.length;x++){ const col=pal[row[x]]; if(col){g.fillStyle=col;g.fillRect(x,y,1,1);} } }); return c; }
function flipX(src){ const c=mk(src.width,src.height),g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }
const pair=c=>({r:c,l:flipX(c)});
const withRows=(base,rep)=>base.map((r,i)=>rep[i]??r);

// Sam: kleiner blonder Junge, 16x16, Hitbox 10x14
const HERO_PAL={k:'#1a1020',h:'#fff3b0',y:'#ffd85a',Y:'#d9a630',s:'#ffcfa0',S:'#e0a070',w:'#ffffff',e:'#1a1020',r:'#d84a4a',R:'#9a2a36',b:'#3a6ac8',B:'#2a4a90',f:'#5a3b26'};
const HERO=[
  "....kkkkkk......",
  "...khhyyyyk.....",
  "..khyyyyyyyk....",
  "..kyyyyyyyyyk...",
  "..kyYyssssyyk...",
  "..kYyssswesk....",
  "..kYsssswesk....",
  "...kSssssssk....",
  "....kkSSkkk.....",
  "...krrrrrrk.....",
  "..krRrrrrrsk....",
  "..kRRrrrrRkk....",
  "...kbbbbbbk.....",
  "...kbBk.kBbk....",
  "...kffk.kffk....",
  "...kkkk.kkkk...."];
const HERO_FR={
  idle:pair(spr(HERO,HERO_PAL)),
  blink:pair(spr(withRows(HERO,{5:"..kYyssssssk....",6:"..kYsssskksk...."}),HERO_PAL)),
  runA:pair(spr(withRows(HERO,{13:"..kbBk...kBbk...",14:"..kffk....kffk..",15:"..kkkk....kkkk.."}),HERO_PAL)),
  runB:pair(spr(withRows(HERO,{13:"....kbBBk.......",14:".....kffk.......",15:".....kkkk......."}),HERO_PAL)),
  jump:pair(spr(withRows(HERO,{13:"....kbbbbk......",14:"....kffffk......",15:"................"}),HERO_PAL))
};
const BEETLE_PAL={k:'#1a1020',r:'#d84a4a',R:'#8e2a36',l:'#ff9a8a',w:'#ffffff'};
const BEETLE=[
  "....kkkkkk......",
  "...klllrrrk.....",
  "..kllrrkrrrk....",
  ".klrrrrkrrrrk...",
  ".krrkkrkrkkrkkk.",
  ".krrkkrkrkkrkwk.",
  ".kRrrrrkrrrRkkk.",
  ".kRRRRRkRRRRk...",
  "..kkkkkkkkkkk...",
  "..k.k..k..k.....",
  ".k...k..k..k....",
  "................"];
const BEETLE_A=pair(spr(BEETLE,BEETLE_PAL));
const BEETLE_B=pair(spr(withRows(BEETLE,{9:"...k..k..k.k....",10:"...k..k...k.k..."}),BEETLE_PAL));
// Weitere Gegner (Sprites mit Blick nach links)
const pairL=c=>({l:c,r:flipX(c)});
const EPAL={igel:{k:'#1a1020',s:'#e8e0d0',b:'#8a5a3a',B:'#5a3a22',f:'#e8c8a0',w:'#ffffff',n:'#1a1020'},
  wespe:{k:'#1a1020',w:'#ffffff',y:'#ffd23f',e:'#1a1020'},skorpion:{k:'#1a1020',r:'#c8502e',R:'#7a2a18',w:'#ffe08a'},
  frosch:{k:'#1a1020',g:'#6ac04a',G:'#3f8a34',y:'#e8f0a0',w:'#ffffff',e:'#1a1020'},fisch:{k:'#1a1020',o:'#ff8a3a',Y:'#ffd23f',w:'#ffffff'},
  geist:{k:'#2a3560',w:'#e8f4ff',b:'#3a5aa8'}};
const ES={
  igel:[pairL(spr(["..k.k.k.k.......",".kskskskskk.....","kssbsbsbsssk....","ksbsbsbsbsssk...","kffbbbbbbbbsk...","kwfbbbbbbbbbk...","nffBbbbbbbbbk...",".kffBBBBBBBk....","..kkkkkkkkkk....","...kk...kk......","................","................"],EPAL.igel)),pairL(spr(["..k.k.k.k.......",".kskskskskk.....","kssbsbsbsssk....","ksbsbsbsbsssk...","kffbbbbbbbbsk...","kwfbbbbbbbbbk...","nffBbbbbbbbbk...",".kffBBBBBBBk....","..kkkkkkkkkk....","..kk...kk.......","................","................"],EPAL.igel))],
  wespe:[pairL(spr(["......ww..ww....",".....wwwwwwww...","......ww..ww....","....kkkkkkk.....","...kyykkyykk....","..kewkyykyyyk...","..kkkkyykyykkk..","...kyykkyyk..k..","....kkkkkkk.....","................","................","................"],EPAL.wespe)),pairL(spr(["................","......ww..ww....",".....wwwwwwww...","....kkkkkkk.....","...kyykkyykk....","..kewkyykyyyk...","..kkkkyykyykkk..","...kyykkyyk..k..","....kkkkkkk.....","................","................","................"],EPAL.wespe))],
  skorpion:[pairL(spr(["......kkk.......",".....krrrk......","....krk.krk.....","....kk...krk....","..........krk...","..kk..kkkkkrrk..",".krrkkrrrrrrrk..","krwrrrrrrrrrk...","krrrRRRRRRRk....",".kkkkkkkkkk.....","..k.k.k.k.k.....","................"],EPAL.skorpion)),pairL(spr(["......kkk.......",".....krrrk......","....krk.krk.....","....kk...krk....","..........krk...","..kk..kkkkkrrk..",".krrkkrrrrrrrk..","krwrrrrrrrrrk...","krrrRRRRRRRk....",".kkkkkkkkkk.....",".k.k.k.k.k......","................"],EPAL.skorpion))],
  frosch:[pairL(spr(["................","................","...kk....kk.....","..kwek..kwek....","..kggkkkkggk....",".kggggggggggk...",".kgGggggggGgk...","kgGGggyyggGGgk..","kGGGgyyyygGGGk..","kkGGkkkkkkGGkk..",".kkk......kkk...","................"],EPAL.frosch)),pairL(spr(["................","...kk....kk.....","..kwek..kwek....","..kggkkkkggk....",".kggggggggggk...",".kgGggggggGgk...","kgGGggyyggGGgk..","kGGGgyyyygGGGk..","kkGGkkkkkkGGkk..","kGk........kGk..","kk..........kk..","................"],EPAL.frosch))],
  fisch:[pairL(spr(["................","................","....kkkkkk......","..kkoooooYk..kk.",".kowkoooooYkkok.",".kookoooooookok.",".koooooooooYkok.","..kkoooooYk..kk.","....kkkkkk......","................","................","................"],EPAL.fisch)),pairL(spr(["................","................","....kkkkkk......","..kkoooooYk.kk..",".kowkoooooYkok..",".kookoooooookk..",".koooooooooYkok.","..kkoooooYk..kk.","....kkkkkk......","................","................","................"],EPAL.fisch))],
  geist:[pairL(spr([".....kkkkk......","....kwwwwwk.....","...kwwwwwwwk....","..kwwwwwwwwwk...","..kwkkwkkwwwk...","..kwbkwbkwwwk...","..kwwwwwwwwwk...","..kwwwkkwwwwk...","..kwwwwwwwwwk...","..kwwwwwwwwwk...","..kwkwwkwwkwk...","..kk.kk.kk.kk..."],EPAL.geist)),pairL(spr([".....kkkkk......","....kwwwwwk.....","...kwwwwwwwk....","..kwwwwwwwwwk...","..kwkkwkkwwwk...","..kwbkwbkwwwk...","..kwwwwwwwwwk...","..kwwwkkwwwwk...","..kwwwwwwwwwk...","..kwwwwwwwwwk...","..kwwkwwkwwkk...","...kk.kk.kk....."],EPAL.geist))]
};

function rngFrom(seed){ let s=seed; return ()=>(s=(s*16807)%2147483647)/2147483647; }
function tileCanvas(seed,fn){ const c=mk(16,16),g=c.getContext('2d'),r=rngFrom(seed);

function dirt(px,r,p=PAL.meadow.dirt){
  px(0,0,p.base,16,16);
  for(let i=0;i<14;i++) px(Math.floor(r()*15),Math.floor(r()*16),p.dk,2,1);
  for(let i=0;i<4;i++){ const x=Math.floor(r()*14),y=Math.floor(r()*14); px(x,y,p.lt,2,1); px(x,y+1,p.sh,2,1); }
}
function topLayer(px,r,cols){
  for(let x=0;x<16;x++){ const len=1+Math.floor(r()*3); px(x,0,cols[0]); px(x,1,cols[1],1,3); px(x,4,cols[2],1,len); px(x,4+len,cols[3]); }
  for(let i=0;i<3;i++) px(Math.floor(r()*15),1+Math.floor(r()*2),cols[0],2,1);
}
function stoneBlocks(px,r,p){
  px(0,0,p.base,16,16);
  for(const [x,y,w,h] of [[0,0,8,8],[8,0,8,8],[-4,8,8,8],[4,8,8,8],[12,8,8,8]]){
    px(x,y,p.lt,w,1); px(x,y,p.lt,1,h); px(x,y+h-1,p.dk,w,1); px(x+w-1,y,p.dk,1,h); }
  for(let i=0;i<6;i++) px(Math.floor(r()*16),Math.floor(r()*16),p.speck);
}
function tileBody(px,r,s){ if(PAL[s].stone) stoneBlocks(px,r,PAL[s].stone); else dirt(px,r,PAL[s].dirt); }

function makeLevel(id){
  const d=DEFS[id], w=d.w, h=d.h;
  const L={id,name:d.name,style:d.style,zones:d.zones||null,w,h,
    grid:Array.from({length:h},()=>Array(w).fill(' ')),up:Array.from({length:h},()=>Array(w).fill(false)),back:Array.from({length:h},()=>Array(w).fill(false)),
    coins:[],crystals:[],stars:[],reveal:new Set(),movers:[],enemies:[],springs:[],checkpoints:[],doors:[],goal:null,start:{x:48,y:0},decor:[],crumbles:new Map()};
  const set=(c,r,ch)=>{ if(c>=0&&c<w&&r>=0&&r<h) L.grid[r][c]=ch; };
  const rect=(c0,r0,c1,r1,ch='#')=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) set(c,r,ch); };
  let ci=0, si=0;
  const b={
    ground:(c0,c1,top=d.top)=>rect(c0,top,c1,h-1),
    rect, clear:(c0,r0,c1,r1)=>rect(c0,r0,c1,r1,' '),
    plat:(r,c0,c1)=>rect(c0,r,c1,r,'='), crumb:(r,c0,c1)=>rect(c0,r,c1,r,'B'),
    crack:(c0,r0,c1,r1)=>rect(c0,r0,c1,r1,'X'), spikes:(r,c0,c1)=>rect(c0,r,c1,r,'^'),
    water:(c0,c1,top)=>{ for(let r=top;r<h;r++) for(let c=c0;c<=c1;c++) if(L.grid[r]?.[c]===' ') L.grid[r][c]='~'; },
    updraft:(c0,c1,r0,r1)=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.up[r]) L.up[r][c]=true; },
    coin:(c,r)=>L.coins.push({x:c*TS+8,y:r*TS+8,got:false}),
    coins:(r,c0,c1)=>{ for(let c=c0;c<=c1;c++) b.coin(c,r); },
    star:(c,r)=>{ const sid=id+'-s'+(si++); L.stars.push({id:sid,x:c*TS+8,y:r*TS+8,got:!!save.stars[sid]}); },
    hidden:(c0,r0,c1,r1)=>rect(c0,r0,c1,r1,'H'),
    back:(c0,r0,c1,r1)=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.back[r]) L.back[r][c]=true; },   // dunkle Felswand hinter Höhlen   // Geheimgang: sieht aus wie Boden, ist durchlässig
    crystal:(c,r)=>{ const cid=id+'-'+(ci++); L.crystals.push({id:cid,x:c*TS+8,y:r*TS+8,got:!!save.crystals[cid]}); },
    enemy:(c,r,type='beetle',o={})=>{ const T=ETYPE[type], w=T.w, h=T.h;
      const x=c*TS+(TS-w)/2, y=type==='fisch'?r*TS+14:T.fly?r*TS+(TS-h)/2:(r+1)*TS-h;
      const e={type,x,y,w,h,dir:-1,alive:true,squish:0,t:hash(c*13+r)*6,vx:0,vy:0,state:'idle',timer:1+hash(c*7)*1.5,range:3,bob:0,ground:true,...o};
      e.spawn={...e}; L.enemies.push(e); },
    spring:(c,r)=>L.springs.push({x:c*TS,top:(r+1)*TS-11,bottom:(r+1)*TS,t:0}),
    cp:(c,r)=>L.checkpoints.push({x:c*TS,bottom:(r+1)*TS,on:false}),
    mover:(c,r,dc,dr,mw=3,period=3.5)=>L.movers.push({x0:c*TS,y0:r*TS,x1:(c+dc)*TS,y1:(r+dr)*TS,w:mw*TS,period,x:c*TS,y:r*TS,dx:0,dy:0}),
    start:(c,r)=>{ L.start={x:c*TS+3,y:(r+1)*TS-14}; },
    goal:(c,r)=>{ L.goal={x:c*TS,bottom:(r+1)*TS}; },
    door:(c,r,world)=>L.doors.push({x:c*TS,bottom:(r+1)*TS,world,t:0}),
    // Hügel: h Kacheln hoch, flat Kacheln Plateau; gentle = sanfte Hänge
    hill:(c,hh,flat,gentle=false,base=d.top)=>{ let x=c; const down=(x,r)=>rect(x,r,x,h-1);
      for(let i=0;i<hh;i++){ const r=base-1-i; if(gentle){ set(x,r,'('); down(x,r+1); x++; set(x,r,')'); down(x,r+1); x++; } else { set(x,r,'/'); down(x,r+1); x++; } }
      for(let k=0;k<flat;k++){ down(x,base-hh); x++; }
      for(let i=hh-1;i>=0;i--){ const r=base-1-i; if(gentle){ set(x,r,'['); down(x,r+1); x++; set(x,r,']'); down(x,r+1); x++; } else { set(x,r,'\\'); down(x,r+1); x++; } }
      return x; },
    // Senke: h Kacheln tief in den Boden
    // Rampe von Oberflächenreihe a nach b (steil oder sanft)
    ramp:(c,a,bb,gentle=false)=>{ let x=c; const down=(x,r)=>rect(x,r,x,h-1);
      if(bb>a){ for(let r=a;r<bb;r++){ if(gentle){ set(x,r,'['); down(x,r+1); x++; set(x,r,']'); down(x,r+1); x++; } else { set(x,r,'\\'); down(x,r+1); x++; } } }
      else { for(let r=a-1;r>=bb;r--){ if(gentle){ set(x,r,'('); down(x,r+1); x++; set(x,r,')'); down(x,r+1); x++; } else { set(x,r,'/'); down(x,r+1); x++; } } }
      return x; },
    dip:(c,hh,flat,gentle=false,base=d.top)=>{ let x=c; const carve=(x,r)=>{ for(let k=base;k<r;k++) set(x,k,' '); };
      for(let i=0;i<hh;i++){ const r=base+i; if(gentle){ carve(x,r); set(x,r,'['); x++; carve(x,r); set(x,r,']'); x++; } else { carve(x,r); set(x,r,'\\'); x++; } }
      for(let k=0;k<flat;k++){ carve(x,base+hh); x++; }
      for(let i=hh-1;i>=0;i--){ const r=base+i; if(gentle){ carve(x,r); set(x,r,'('); x++; carve(x,r); set(x,r,')'); x++; } else { carve(x,r); set(x,r,'/'); x++; } }
      return x; }
  };
  d.build(b);
  if(id!=='hub') L.doors.push({x:1*TS,bottom:L.start.y+14,world:0,t:0});
  // Deko
  const rnd=rngFrom(typeof id==='number'?id*101+7:5);
  const free=(c,r,n)=>{ for(let k=1;k<=n;k++) if(r-k<0||L.grid[r-k][c]!==' ') return false; return true; };
  for(let r=1;r<h;r++) for(let c=0;c<w;c++){
    if(L.grid[r][c]!=='#'||L.grid[r-1][c]!==' ') continue;
    const y=r*TS, x=c*TS+rnd()*10, s=styleAt(c,L);
    if(free(c,r,4)){
      if(s==='forest'&&rnd()<.5) L.decor.push({k:'pine',x,y,h:28+rnd()*34,back:true});
      else if(s==='snow'&&rnd()<.24) L.decor.push({k:'pine',x,y,h:22+rnd()*24,back:true,snow:true});
      else if(s==='meadow'&&rnd()<.12) L.decor.push({k:'tree',x,y,h:26+rnd()*12,back:true});
      else if(s==='stone'&&rnd()<.1) L.decor.push({k:'cactus',x,y,h:14+rnd()*12,back:true});
      else if(s==='stone'&&rnd()<.16) L.decor.push({k:'rock',x,y,s:4+rnd()*6,back:true});
      else if(s==='lake'&&rnd()<.12) L.decor.push({k:'bush',x,y,back:true});
    }
    const wet=(L.grid[r][c-1]==='~'||L.grid[r][c+1]==='~'||L.grid[r+1]?.[c-1]==='~'||L.grid[r+1]?.[c+1]==='~');
    if(s==='lake'&&wet) L.decor.push({k:'reed',x:c*TS+6,y});
    const fx=c*TS+rnd()*13, q=rnd();
    if(s==='meadow'&&q<.5) L.decor.push({k:q<.25?'flower':'tuft',x:fx,y,col:['#f6ead2','#f28fad','#ffd166','#9ad0ff'][Math.floor(rnd()*4)]});
    else if(s==='forest'&&q<.45) L.decor.push(q<.1?{k:'mushroom',x:fx,y}:{k:'tuft',x:fx,y,col:'#2e5e28'});
    else if(s==='stone'&&q<.25) L.decor.push({k:'tuft',x:fx,y,col:'#b47c3a'});
    else if(s==='lake'&&q<.3) L.decor.push(q<.1?{k:'shell',x:fx,y}:{k:'flower',x:fx,y,col:['#ffffff','#9ad0ff','#f28fad'][Math.floor(rnd()*3)]});
    else if(s==='snow'&&q<.12) L.decor.push({k:'ice',x:fx,y});
  }
  return L;
}

const ptrs=new Map(); let keyL=false, keyR=false, keyJump=false;
let L_=false, R_=false, wasBoth=false, jumpSide=0, neutral=false, firstAt=0, standAt=false, lastTap={side:0,t:0};
const TOGETHER_MS=120;
const zl=document.getElementById('zl'), zr=document.getElementById('zr');
function recompute(){
  let l=false,r=false;
  for(const x of ptrs.values()){ if(x<innerWidth/2) l=true; else r=true; }
  const pL=L_, pR=R_;
  L_=l||keyL; R_=r||keyR;
  const now=performance.now();
  if(!pL&&!pR&&(L_||R_)){ firstAt=now; standAt=P.ground&&Math.abs(P.vx)<10; }
  const both=L_&&R_;
  if(both&&!wasBoth){
    const together = P.ground && ((!pL&&!pR&&Math.abs(P.vx)<10) || (now-firstAt<TOGETHER_MS&&standAt));
    if(together){ jumpSide=0; neutral=true; P.vx=0; }
    else { neutral=false; jumpSide = (pL&&!pR) ? 1 : (pR&&!pL) ? -1 : -P.face; }
    triggerJump();
  }
  if((jumpSide===-1&&!L_)||(jumpSide===1&&!R_)) jumpSide=0;
  wasBoth=both;
  zl.classList.toggle('on',L_); zr.classList.toggle('on',R_);
}
function triggerJump(){ if(state==='play') P.buffer=PH.buffer; }
function requestDash(side){
  if(state!=='play'||!save.ab.dash||P.dashCD>0||P.dashT>0) return;
  if(!P.ground&&P.airDash) return;
  P.dashT=PH.dashT; P.dashDir=side; P.face=side; P.dashCD=.35; P.kickT=0; if(!P.ground) P.airDash=true;
  addFlow(4); sfx('dash'); burst(P.x+P.w/2,P.y+P.h/2,C.cream,6,60);
}
addEventListener('pointerdown',e=>{
  if(state!=='play') return;
  const side=e.clientX<innerWidth/2?-1:1, now=performance.now();
  const otherHeld=[...ptrs.values()].some(x=>(x<innerWidth/2?-1:1)!==side);
  if(!otherHeld && lastTap.side===side && now-lastTap.t<260){ requestDash(side); lastTap={side:0,t:0}; }
  else lastTap={side,t:now};
  ptrs.set(e.pointerId,e.clientX); recompute();
});
addEventListener('pointermove',e=>{ if(ptrs.has(e.pointerId)){ ptrs.set(e.pointerId,e.clientX); recompute(); } });
const up=e=>{ if(ptrs.delete(e.pointerId)) recompute(); };

  else if([' ','ArrowUp','w','W'].includes(e.key)){ keyJump=true; triggerJump(); e.preventDefault(); }
  else if(e.key==='Shift') requestDash(P.face);
  recompute();
});

function pulseWave(ac,duty){ const n=32, re=new Float32Array(n), im=new Float32Array(n); for(let i=1;i<n;i++) re[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*duty); return ac.createPeriodicWave(re,im); }

  const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  try{
    const ac=new A(); AU.ctx=ac;
    AU.master=ac.createGain(); AU.master.gain.value=.9;
    const comp=ac.createDynamicsCompressor(); AU.master.connect(comp); comp.connect(ac.destination);
    AU.music=ac.createGain(); AU.music.gain.value=AU.vol.music; AU.music.connect(AU.master);
    AU.sfx=ac.createGain(); AU.sfx.gain.value=AU.vol.sfx; AU.sfx.connect(AU.master);
    const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=buf;

function tone(t,freq,dur,{wave='square',vol=.1,dest=AU.sfx,to=null,attack=.004}={}){
  const ac=AU.ctx, o=ac.createOscillator(), g=ac.createGain();
  if(wave==='p25') o.setPeriodicWave(AU.p25); else if(wave==='p12') o.setPeriodicWave(AU.p12); else o.type=wave;
  o.frequency.setValueAtTime(freq,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,{vol=.1,type='bandpass',freq=1000,to=null,q=1,dest=AU.sfx}={}){
  const ac=AU.ctx, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=AU.noise; f.type=type; f.frequency.setValueAtTime(freq,t); if(to) f.frequency.exponentialRampToValueAtTime(to,t+dur); f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
}

  checkpoint:()=>{ const t=atime(); tone(t,660,.1,{wave:'p25',vol:.09}); tone(t+.1,990,.2,{wave:'p25',vol:.09}); },
  door:()=>{ const t=atime(); tone(t,300,.4,{wave:'triangle',vol:.15,to:1200}); noise(t,.4,{vol:.06,freq:800,to:4000}); },
  secret:()=>{ const t=atime(); [79,74,70,67,74,79,86].forEach((m,i)=>tone(t+i*.07,mtof(m),.35,{wave:'triangle',vol:.12})); noise(t,.6,{vol:.05,type:'highpass',freq:5000,to:9000}); },
  unlock:()=>{ const t=atime(); [60,64,67,72,76,79,84,88].forEach((m,i)=>tone(t+i*.06,mtof(m),.3,{wave:'p25',vol:.1}));
    [72,76,79].forEach(m=>tone(t+.55,mtof(m),.9,{wave:'triangle',vol:.12})); tone(t+.55,mtof(96),.9,{wave:'p12',vol:.05}); noise(t+.5,.6,{vol:.08,type:'highpass',freq:6000}); },
  fanfare:()=>{ const t=atime(); [[67,0],[72,.12],[76,.24],[79,.36],[84,.5]].forEach(([m,d])=>tone(t+d,mtof(m),d===.5?.7:.14,{wave:'p25',vol:.11}));
    [60,64,67].forEach(m=>tone(t+.5,mtof(m),.7,{wave:'triangle',vol:.1})); },
  tier:n=>{ const t=atime(); tone(t,mtof(76+n*4),.15,{wave:'p12',vol:.08}); tone(t+.07,mtof(83+n*4),.22,{wave:'p12',vol:.08}); }
};
// ---------- Juice: Trefferpause, Kamera-Impuls, Vibration ----------
let hitstop=0, punch=0, punchT=0;
// Trefferpause nur bei echten Treffern; beim Einsammeln nur ein weicher Zoom-Stoß
const JUICE={secret:{p:.03,v:[20,30,20]},stomp:{hs:.05,p:.025,v:25},smash:{hs:.05,p:.035,v:35},crystal:{p:.035,v:30},spring:{v:20},
  land:{v:10},hurt:{v:[40,30,60]},dash:{v:15},tier:{v:12},unlock:{p:.06,v:[30,40,30,40,80]},kick:{v:10},double:{v:8}};
function juice(name){ const j=JUICE[name]; if(!j) return;
  if(j.hs) hitstop=Math.max(hitstop,j.hs); if(j.p) punchT=Math.max(punchT,j.p);
  if(j.v&&AU.vol.vib!==false){ try{ navigator.vibrate?.(j.v); }catch(_){} } }
function sfx(name,arg){ juice(name); if(!AU.ctx||AU.vol.sfx<=0) return; try{ SFX[name](arg); }catch(_){} }

// Musik: 4 Takte à 16 Sechzehntel. Melodie in Tonleiterstufen (1–9), '-' hält, '.' Pause.
// Bass: R Grundton, F Quinte, O Oktave. Schichten wachsen mit dem Schwung.
const SCALES={major:[0,2,4,5,7,9,11],mixo:[0,2,4,5,7,9,10],minor:[0,2,3,5,7,8,10],lydian:[0,2,4,6,7,9,11]};

    bass:"R-R-O-R-R-R-F-O-",kick:"x.....x.x.......",snare:"....x.......x...",hat:"xxxxxxxxxxxxxxxx"},
  2:{bpm:108,root:52,scale:'minor',chords:[1,6,7,1],
    lead:["1--31-5---3-1---","8--68-3---1-6---","7--57-9---7-4---","5-4-3-2-1---.-.-"],
    bass:"R--R--R-F--F--O-",kick:"x..x..x.x..x....",snare:"....x.......x..x",hat:"x.x.x.x.x.x.x.x."},

    bass:"R-------F-------",kick:"x.......x.......",snare:"............x...",hat:"..x...x...x...x."},

    bass:"R-------R---F---",kick:"x...............",snare:"........x.......",hat:"....x.......x..."}
};
function playStep(i,t){
  const S=AU.song, bar=Math.floor(i/16)%4, st=i%16, sd=60/S.bpm/4, ch=S.chords[bar], T=L?tier():0, sc=SCALES[S.scale];
  const deg=d=>{ const k=d-1; return sc[((k%7)+7)%7]+12*Math.floor(k/7); };
  const hold=(str,from)=>{ let n=1; while(str[from+n]==='-') n++; return n; };
  const M=AU.music;
  const b=S.bass[st];
  if(b==='R'||b==='F'||b==='O'){ const n=S.root-24+(b==='F'?deg(ch+4):deg(ch)+(b==='O'?12:0)); tone(t,mtof(n),sd*hold(S.bass,st)*.95,{wave:'triangle',vol:.22,dest:M,attack:.005}); }
  const l=S.lead[bar][st];
  if(l>='1'&&l<='9'){ const n=S.root+12+deg(+l), dur=sd*hold(S.lead[bar],st)*.9;
    tone(t,mtof(n),dur,{wave:'p25',vol:.085,dest:M,attack:.006});
    if(T>=3) tone(t,mtof(n+12),dur,{wave:'p12',vol:.035,dest:M}); }
  if(T>=2){ const tones=[ch,ch+2,ch+4,ch+7]; tone(t,mtof(S.root+12+deg(tones[st%4])),sd*.8,{wave:'p12',vol:.03,dest:M}); }
  if(S.kick[st]==='x') tone(t,150,.14,{wave:'sine',vol:.42,to:45,dest:M});
  if(T>=1){
    if(S.snare[st]==='x') noise(t,.13,{vol:.16,freq:1800,dest:M});
    if(S.hat[st]==='x') noise(t,.035,{vol:.05,type:'highpass',freq:7000,dest:M});
  }
}
function schedule(){
  if(!AU.ctx||!AU.song) return;
  const ac=AU.ctx; if(AU.next<ac.currentTime-.2) AU.next=ac.currentTime+.05;
  while(AU.next<ac.currentTime+.12){ try{ playStep(AU.step,AU.next); }catch(_){} AU.next+=60/AU.song.bpm/4; AU.step++; }
}
function playSong(id){ if(!AU.ctx) return; const s=SONGS[id]||SONGS.hub; if(AU.song===s) return; AU.song=s; AU.step=0; AU.next=AU.ctx.currentTime+.15; }

  const y=Math.round(cy-8-Math.max(0,1-celebT*2)*20+Math.sin(clock*4)*1.5);

// ---------- Physik ----------
function wallContact(){
  const r0=Math.floor((P.y+2)/TS), r1=Math.floor((P.y+P.h-2)/TS);
  const cl=Math.floor((P.x-1)/TS), cr=Math.floor((P.x+P.w+.5)/TS);
  for(let r=r0;r<=r1;r++){ if(solid(cr,r)&&!inner(cr,r)) return 1; if(solid(cl,r)&&!inner(cl,r)) return -1; }
  return 0;
}
function inUpdraft(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.up[r]?.[c]) return true;
  return false;
}
function breakCrack(c,r){
  const st=[[c,r]];
  while(st.length){ const [x,y]=st.pop(); if(tileAt(x,y)!=='X') continue; L.grid[y][x]=' ';
    for(let i=0;i<4;i++) particles.push({x:x*TS+Math.random()*16,y:y*TS+Math.random()*16,vx:(Math.random()-.5)*120,vy:-Math.random()*120,t:.6,col:'#b3a8c2'});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  shake=.15; addFlow(6); sfx('smash');
}
function moveX(dt){
  P.x+=P.vx*dt;
  const side=Math.sign(P.vx); if(!side) return;
  const r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  const c=side>0?Math.floor((P.x+P.w)/TS):Math.floor(P.x/TS);
  if(P.dashT>0) for(let r=r0;r<=r1;r++) if(tileAt(c,r)==='X') breakCrack(c,r);
  let hit=false, step=null;
  for(let r=r0;r<=r1;r++) if(solid(c,r)){
    if(r===r1&&inner(c,r)) continue;                      // Erde unter Hängen bremst nicht
    if(r===r1&&(P.ground||P.slope)&&P.y+P.h-r*TS<=8&&!solid(c,r-1)){ step=r*TS; continue; } // kleine Kante hochsteigen
    hit=true; }
  if(!hit&&step!==null) P.y=step-P.h;
  if(hit){
    if(Math.abs(P.vx)>70&&P.dashT<=0&&!(save.ab.wall&&!P.ground)) addFlow(-12);
    P.x=side>0?c*TS-P.w:(c+1)*TS; P.vx=0; P.dashT=0;
  }
}
function land(){ if(P.vy>200){P.squash=1;dust(4);sfx('land');} else if(P.vy>110){ P.squash=.5; dust(2); } P.vy=0; P.ground=true; }
function moveY(dt){
  const wasGround=P.ground, prevBottom=P.y+P.h; P.ground=false;
  P.y+=P.vy*dt;
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS);
  if(P.vy>0){ const r=Math.floor((P.y+P.h)/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)&&!inner(c,r)){
      P.y=r*TS-P.h; if(wasGround) P.vy=0; else land(); P.ground=true; break; } }
  else if(P.vy<0){ const r=Math.floor(P.y/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)){P.y=(r+1)*TS;P.vy=0;break;} }
  // Schrägen: auf die Oberfläche unter der Fußmitte setzen; bergab angeklebt bleiben
  P.slope=false;
  if(P.vy>=0){ const foot=P.y+P.h, sy=slopeSurface(P.x+P.w/2,foot-1);
    if(sy!==null){
      if(foot>sy){ P.y=sy-P.h; if(!wasGround&&!P.ground) land(); else P.vy=0; P.ground=true; P.slope=true; }
      else if(!P.ground&&wasGround&&sy-foot<=8){ P.y=sy-P.h; P.vy=0; P.ground=true; P.slope=true; } } }
  P.plat=null;
  if(P.vy>=0) for(const m of L.movers){
    if(P.x+P.w>m.x+1 && P.x<m.x+m.w-1 && prevBottom<=m.y+2+Math.max(0,-m.dy) && P.y+P.h>=m.y){
      P.y=m.y-P.h; if(!wasGround) land(); else P.vy=0; P.ground=true; P.plat=m; break; }
  }
}
function dust(n){ for(let i=0;i<n;i++) particles.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-.5)*60,vy:-Math.random()*40,t:.35,col:C.cream}); }
function burst(x,y,col,n=8,sp=70){ for(let i=0;i<n;i++){const a=i/n*Math.PI*2; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.4,col});} }
function doJump(v){ P.vy=v; P.buffer=0; P.coyote=0; P.ground=false; P.plat=null; P.squash=-1; P.hold=0; P.rising=true; P.cut=false; dust(5); }
function hazard(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r);
    if(t==='^'){ const x=c*TS+3,y=r*TS+8; if(P.x+P.w>x&&P.x<x+10&&P.y+P.h>y&&P.y<y+8) return 'spike'; }
    if(t==='~'){ const top=tileAt(c,r-1)==='~'?r*TS:r*TS+6; if(P.y+P.h>top+4) return 'water'; }
  }
  return null;
}

function update(dt){
  if(state!=='play') return;
  time+=dt;
  for(const m of L.movers){ const s=(1-Math.cos(clock/m.period*Math.PI*2))/2;
    const nx=m.x0+(m.x1-m.x0)*s, ny=m.y0+(m.y1-m.y0)*s; m.dx=nx-m.x; m.dy=ny-m.y; m.x=nx; m.y=ny; }
  if(P.plat){ P.x+=P.plat.dx; P.y+=P.plat.dy; }
  P.wallDir=(!P.ground&&save.ab.wall)?wallContact():0;

  // Richtung: nur der Laufdaumen lenkt
  let dir;
  if(jumpSide){ const runHeld=jumpSide===-1?R_:L_; if(!runHeld&&P.ground&&P.buffer<=0) jumpSide=0; dir=runHeld?-jumpSide:0; }
  if(!jumpSide) dir=(L_&&!R_)?-1:(R_&&!L_)?1:0;
  if(P.kickT>0){ P.kickT-=dt; dir=0; }

  const updraft=save.ab.glide&&!P.ground&&inUpdraft();
  const held=jumpSide!==0||(neutral&&(L_||R_))||keyJump;
  let maxS=PH.max+tier()*PH.tierBonus;
  if(updraft&&held) maxS=Math.min(maxS,PH.upSpeed);

  if(P.dashT>0){
    P.dashT-=dt; P.vx=P.dashDir*PH.dashSpeed; P.vy=0;
    if(P.dashT<=0) P.vx=P.dashDir*maxS;
  } else {
    const acc=P.ground?PH.accG:PH.accA, fr=P.ground?PH.fricG:PH.fricA;
    const before=Math.abs(P.vx);
    if(dir){ P.vx+=dir*acc*dt; P.face=dir; }
    else if(P.kickT<=0){ const s=Math.sign(P.vx); P.vx-=s*fr*dt; if(Math.sign(P.vx)!==s) P.vx=0; }
    if(Math.abs(P.vx)>maxS&&P.kickT<=0) P.vx=Math.sign(P.vx)*Math.max(maxS,Math.min(Math.abs(P.vx),before-350*dt));
  }
  P.dashCD-=dt;

  // Sprünge: Boden, Wand, Luft
  P.coyote=P.ground?PH.coyote:P.coyote-dt;
  P.buffer-=dt;
  if(P.buffer>0&&P.dashT<=0){
    if(P.coyote>0){ doJump(-PH.jump); sfx('jump'); }
    else if(P.wallDir){ doJump(-PH.kickY); sfx('kick'); P.vx=-P.wallDir*PH.kickX; P.face=-P.wallDir; P.kickT=PH.kickT; P.usedDouble=false; addFlow(5);
      for(let i=0;i<5;i++) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h/2,vx:-P.wallDir*Math.random()*60,vy:(Math.random()-.5)*60,t:.35,col:C.cream}); }
    else if(save.ab.double&&!P.usedDouble){ P.usedDouble=true; doJump(-PH.airJump); sfx('double'); addFlow(3); burst(P.x+P.w/2,P.y+P.h,C.sky,6,50); }
  }

  if(P.dashT<=0){
    let gMul=1;
    if(P.rising){
      if(P.vy>=0) P.rising=false;
      else if(P.cut) gMul=PH.cutGrav;
      else if(held&&P.hold<PH.holdMax){ P.hold+=dt; gMul=PH.holdGrav; }
      else if(!held&&P.hold<PH.holdMax){ P.cut=true; gMul=PH.cutGrav; }
    }
    P.vy=Math.min(PH.fall,P.vy+PH.grav*gMul*dt);
    if(P.wallDir&&dir===P.wallDir&&P.vy>PH.slide){ P.vy=PH.slide; if(Math.random()<.3) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h,vx:0,vy:-10,t:.3,col:C.cream}); }
    P.glide=save.ab.glide&&!P.ground&&held&&!P.wallDir&&(P.vy>0||updraft);
    if(P.glide&&updraft) P.vy=Math.max(-PH.upMax,P.vy-PH.upLift*dt);
    else if(P.glide&&P.vy>PH.glideFall) P.vy=PH.glideFall;
  }
  moveX(dt); moveY(dt);
  if(P.ground||P.wallDir){ P.usedDouble=false; P.airDash=false; }
  if(neutral&&P.ground&&!P.rising&&P.buffer<=0) neutral=false;
  P.squash*=Math.pow(.001,dt);
  if(P.ground&&dir) P.run+=dt*Math.abs(P.vx)/10;
  if(P.ground){
    const turning=dir&&Math.sign(P.vx)===-dir&&Math.abs(P.vx)>25, braking=!dir&&Math.abs(P.vx)>30;
    if((turning||braking)&&Math.random()<.55) particles.push({x:P.x+P.w/2+Math.sign(P.vx)*4,y:P.y+P.h,vx:-P.vx*.25+(Math.random()-.5)*20,vy:-10-Math.random()*25,t:.3,col:C.cream});
    else if(Math.abs(P.vx)>=PH.max*.95&&Math.random()<.12) particles.push({x:P.x+P.w/2-Math.sign(P.vx)*5,y:P.y+P.h,vx:-P.vx*.15,vy:-8-Math.random()*12,t:.25,col:C.cream});
  }
  if(tier()===3||P.dashT>0) ribbon.push({x:P.x+P.w/2,y:P.y+P.h*.55,t:.28});

  // Schwung
  const sp=Math.abs(P.vx);
  if(P.dashT>0){}
  else if(sp>=PH.max*.85) addFlow((P.ground?13:8)*dt);
  else if(P.ground&&sp<25) addFlow(-40*dt);

  for(const t of trail) t.t-=dt; trail=trail.filter(t=>t.t>0);
  if(tier()===3&&Math.random()<.3) particles.push({x:P.x+Math.random()*P.w,y:P.y+Math.random()*P.h,vx:-P.vx*.2,vy:-20,t:.4,col:C.gold});

  // Bröckelblöcke
  if(P.ground&&!P.plat){ const r=Math.floor((P.y+P.h+1)/TS);
    for(let c=Math.floor(P.x/TS);c<=Math.floor((P.x+P.w-.01)/TS);c++){ const k=c+','+r; if(tileAt(c,r)==='B'&&!L.crumbles.has(k)) L.crumbles.set(k,{t:.45,gone:false}); } }
  for(const [k,b] of L.crumbles){

    else if(b.gone&&b.t<=0){ const over=P.x+P.w>c*TS&&P.x<c*TS+TS&&P.y+P.h>r*TS&&P.y<r*TS+TS; if(!over){ L.grid[r][c]='B'; L.crumbles.delete(k);} }
  }
  // Federn

    if(P.vy>0&&P.x+P.w>s.x+2&&P.x<s.x+14&&P.y+P.h>=s.top&&P.y+P.h<=s.top+10){
      P.y=s.top-P.h; P.vy=-PH.spring; P.rising=true; P.cut=false; P.hold=PH.holdMax; P.ground=false; P.usedDouble=false; s.t=.25; P.squash=-1; addFlow(4); sfx('spring'); burst(s.x+8,s.top,C.cream,6,50); } }
  // Gegner
  if(updateEnemies(dt)) return;
  // Münzen, Kristalle
  for(const k of L.coins) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<10&&Math.abs(P.y+P.h/2-k.y)<12){ k.got=true; levelCoins++; sfx('coin'); save.wallet+=1+tier(); if(tier()>0) floaters.push({x:k.x,y:k.y-6,txt:'+'+(1+tier()),t:.7,col:'#ffd166'}); addFlow(1.5); burst(k.x,k.y,C.gold); }
  for(const k of L.stars) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<11&&Math.abs(P.y+P.h/2-k.y)<12){ k.got=true; save.stars[k.id]=true; persist(); sfx('secret'); addFlow(20); burst(k.x,k.y,'#ffe14d',14,90); showMsg('Geheimnis gefunden!'); floaters.push({x:k.x,y:k.y-8,txt:'★',t:1.1,col:'#ffe14d'}); }
  { const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(tileAt(c,r)==='H'&&!L.reveal.has(c+','+r)) revealHidden(c,r); }
  for(const k of L.crystals) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<11&&Math.abs(P.y+P.h/2-k.y)<13){ k.got=true; save.crystals[k.id]=true; sfx('crystal'); persist(); addFlow(20); burst(k.x,k.y,C.sky,12,80); showMsg('Kristall gefunden!'); floaters.push({x:k.x,y:k.y-8,txt:'◆',t:1,col:'#7fe0ff'}); }
  // Checkpoints
  for(const k of L.checkpoints) if(!k.on&&P.x>k.x&&Math.abs(P.y+P.h-k.bottom)<48){ k.on=true; cpPos={x:k.x+3,y:k.bottom-P.h}; burst(k.x+1,k.bottom-30,C.ember,10,60); showMsg('Checkpoint'); sfx('checkpoint'); }
  // Gefahren
  const hz=hazard();

  if(P.y>L.h*TS+24){ die(); return; }

  for(const d of L.doors){
    const over=P.x+P.w>d.x+2&&P.x<d.x+14&&Math.abs(P.y+P.h-d.bottom)<20;

    const inside=d.armed&&over&&P.ground&&Math.abs(P.y+P.h-d.bottom)<4&&Math.abs(P.vx)<25;

    if(d.t>=.7){ clearInput(); sfx('door'); const n=d.world; if(n===0){ const w=L.id; loadLevel('hub',w); showMsg('Hubwelt'); } else { loadLevel(n); showMsg(`Welt ${n} · ${NAMES[n]}`); } return; }
  }
}
let ribbon=[], floaters=[];
// ---------- Gegner-Verhalten ----------
function walkStep(e,speed,dt){ e.x+=e.dir*speed*dt; const front=e.dir>0?e.x+e.w:e.x, fc=Math.floor(front/TS), er=Math.floor((e.y+e.h-1)/TS);
  if(solid(fc,er)||!solid(fc,er+1)||tileAt(fc,er)==='^'){ e.dir*=-1; e.x+=e.dir*2; return true; } return false; }
function revealHidden(c,r){
  const st=[[c,r]]; let n=0;
  while(st.length){ const [x,y]=st.pop(), k=x+','+y; if(tileAt(x,y)!=='H'||L.reveal.has(k)) continue; L.reveal.add(k); n++; st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  if(n){ sfx('secret'); showMsg('Geheimgang!'); }
}
function killEnemy(e,bounce){ e.alive=false; e.squish=.5; sfx('stomp');
  if(bounce){ P.vy=-PH.stomp; P.rising=true; P.cut=false; P.hold=0; P.usedDouble=false; }
  addFlow(12); burst(e.x+e.w/2,e.y+4,ETYPE[e.type].col,8,60); }
function updateEnemies(dt){
  const pcx=P.x+P.w/2, pcy=P.y+P.h/2;
  for(const e of L.enemies){
    if(!e.alive){ e.squish=Math.max(0,e.squish-dt); continue; }
    e.t+=dt; const dx=pcx-(e.x+e.w/2), dy=pcy-(e.y+e.h/2);
    switch(e.type){
      case 'beetle': walkStep(e,28,dt); break;
      case 'igel': walkStep(e,22,dt); break;
      case 'wespe': { const nx=e.spawn.x+Math.sin(e.t*.9)*e.range*TS; e.dir=nx>e.x?1:-1; e.x=nx; e.y=e.spawn.y+Math.sin(e.t*3)*5; break; }
      case 'skorpion':
        if(e.state==='wind'){ e.timer-=dt; if(e.timer<=0){ e.state='charge'; e.timer=.9; } }
        else if(e.state==='charge'){ e.timer-=dt; if(walkStep(e,95,dt)||e.timer<=0){ e.state='rest'; e.timer=1; } }
        else if(e.state==='rest'){ e.timer-=dt; if(e.timer<=0) e.state='idle'; }
        else { walkStep(e,18,dt); if(Math.abs(dx)<TS*5&&Math.abs(dy)<TS*1.5){ e.dir=Math.sign(dx)||e.dir; e.state='wind'; e.timer=.45; } }
        break;
      case 'frosch': {
        e.vy+=900*dt; e.y+=e.vy*dt; e.x+=e.vx*dt;
        const fc=Math.floor((e.vx>0?e.x+e.w:e.x)/TS), er=Math.floor((e.y+e.h-1)/TS); if(e.vx&&solid(fc,er)){ e.x-=e.vx*dt; e.vx=0; }
        const c0=Math.floor((e.x+1)/TS), c1=Math.floor((e.x+e.w-1)/TS), rb=Math.floor((e.y+e.h)/TS);
        e.ground=false; if(e.vy>=0) for(let c=c0;c<=c1;c++) if(solid(c,rb)){ e.y=rb*TS-e.h; e.vy=0; e.vx=0; e.ground=true; break; }
        if(e.ground){ e.timer-=dt; if(e.timer<=0){
          let d=Math.abs(dx)<TS*6?(Math.sign(dx)||e.dir):-e.dir;
          const lc=Math.floor((e.x+e.w/2+d*TS*2.2)/TS); if(!solid(lc,rb)) d=-d;   // nicht in Abgründe hüpfen
          e.dir=d; e.vx=d*55; e.vy=-270; e.timer=1.3+Math.random()*.6; } }
        if(e.y>L.h*TS+40) e.alive=false;
        break; }
      case 'fisch':
        if(e.state==='leap'){ e.vy+=650*dt; e.y+=e.vy*dt; if(e.vy>0&&e.y>=e.spawn.y){ e.y=e.spawn.y; e.state='idle'; e.timer=1.8+Math.random()*1.2; } }
        else { e.timer-=dt; if(e.timer<=0){ e.state='leap'; e.vy=-340; } }
        break;
      case 'geist': {
        const near=Math.hypot(dx,dy)<TS*7, tx=near?dx:e.spawn.x-e.x, ty=near?dy:e.spawn.y-e.y, d=Math.hypot(tx,ty)||1, sp=near?24:14;
        if(d>2){ e.x+=tx/d*sp*dt; e.y+=ty/d*sp*dt; } if(Math.abs(tx)>1) e.dir=tx>0?1:-1; e.bob=Math.sin(e.t*2.4)*2;
        break; }
    }
    const T=ETYPE[e.type];
    if(e.type==='fisch'&&(e.state!=='leap'||e.y>e.spawn.y-10)) continue;
    const by=e.y+e.bob;
    if(P.x+P.w>e.x+1&&P.x<e.x+e.w-1&&P.y+P.h>by+1&&P.y<by+e.h){
      if(P.dashT>0&&T.dash) killEnemy(e,false);
      else if(T.stomp&&P.vy>0&&P.y+P.h-by<9) killEnemy(e,true);
      else if(!dbg.god){ die(); return true; }
    }
  }
  return false;
}
function tickParticles(dt){ for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; p.t-=dt; } particles=particles.filter(p=>p.t>0);
  for(const r of ribbon) r.t-=dt; ribbon=ribbon.filter(r=>r.t>0);
  for(const f of floaters){ f.y-=22*dt; f.t-=dt; } floaters=floaters.filter(f=>f.t>0); }
function drawRibbon(){

    ctx.globalAlpha=k*.55; ctx.strokeStyle=col; ctx.lineWidth=1+k*4; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }

function drawSpeedlines(){

  const W=cv.width, H=cv.height, seed=Math.floor(clock*24), dir=Math.sign(P.vx)||P.face;

  for(let i=0;i<16;i++){ const r=hash(i*7.3+seed), y=Math.round(hash(i*3.1+seed*.7)*H), len=W*(.08+r*.16), th=Math.max(1,Math.round(H/300));

// ---------- Themen der Welten ----------
// Jede Welt hat eigenen Himmel, eigene Hintergrundebenen, Partikel und Bodenkacheln.
const THEMES={
  meadow:{top:'#4a8ad6',mid:'#9fd2f0',bot:'#eaf6e4',r:['#8fb8da','#7fae86','#5c925c','#3d6e44'],tint:0},
  forest:{top:'#2c6a74',mid:'#9cc684',bot:'#f4dd88',r:['#80a89c','#4f8060','#2f5e3f','#1a3926'],tint:.05},

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
const mod=(v,n)=>((v%n)+n)%n;
function hash(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
const stars=Array.from({length:90},(_,i)=>({x:hash(i*1.3),y:hash(i*2.9)*.62,s:i%4===0?2:1}));

function styleAt(c,lv=L){ if(!lv.zones) return lv.style; for(const z of lv.zones) if(c<z.to) return z.s; return lv.zones[lv.zones.length-1].s; }
function themeBlend(){
  if(!L||state==='start') return {a:'meadow',b:'meadow',t:0};
  if(!L.zones) return {a:L.style,b:L.style,t:0};
  const c=(camX+viewW/2)/TS, Z=L.zones, F=6;
  for(let i=0;i<Z.length;i++){
    if(c>=Z[i].to&&i<Z.length-1) continue;
    const prev=i?Z[i-1].to:-1e9;
    if(i<Z.length-1&&c>Z[i].to-F) return {a:Z[i].s,b:Z[i+1].s,t:(c-(Z[i].to-F))/(2*F)};
    if(i>0&&c<prev+F) return {a:Z[i-1].s,b:Z[i].s,t:(c-(prev-F))/(2*F)};
    return {a:Z[i].s,b:Z[i].s,t:0};
  }
  return {a:L.style,b:L.style,t:0};

// ---------- Parallax-Ebenen ----------
function parY(par){ if(!L||state==='start') return 0; return Math.max(-30,Math.min(70,(L.h*TS-viewH-camY)*par*.45)); }
function ridge(color,base,amp1,amp2,f,par,step,peaks,sharp,flat){
  const oy=parY(par);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,SKY_H);
  for(let x=0;x<=skyW+step;x+=step){ const wx=x+camX*par;
    let y=base+oy-Math.sin(wx*f)*amp1-Math.sin(wx*f*2.7+1.3)*amp2;
    if(sharp) y-=Math.abs(Math.sin(wx*f*1.9+.7))*sharp;
    if(peaks) y-=Math.max(0,Math.sin(wx*f*.6+2))**6*peaks;
    if(flat) y=Math.round(y/flat)*flat;
    ctx.lineTo(x,Math.round(y)); }
  ctx.lineTo(skyW+step,SKY_H); ctx.closePath(); ctx.fill();
}
function layerItems(spacing,par,fn){ const off=camX*par, i0=Math.floor(off/spacing)-2, n=Math.ceil(skyW/spacing)+4;
  for(let i=i0;i<i0+n;i++) fn(Math.round(i*spacing-off+hash(i*3.1+spacing)*spacing*.5),hash(i+spacing*7),i); }
function ground(color,base,par){ const y=Math.round(base+parY(par)); ctx.fillStyle=color; ctx.fillRect(0,y,skyW,SKY_H-y+2); return y; }
function pines(color,light,base,spacing,hmin,hmax,par,snow){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const h=hmin+(hmax-hmin)*r;
    for(let k=0;k<3;k++){ const ty=y-k*h*.28, w=h*.32*(1-k*.22);
      ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x-w,ty+1); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x+w,ty+1); ctx.fill();
      if(light){ ctx.fillStyle=light; ctx.beginPath(); ctx.moveTo(x-w,ty+1); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x-w*.35,ty+1); ctx.fill(); }
      if(snow){ ctx.fillStyle='rgba(235,240,248,.85)'; ctx.beginPath(); ctx.moveTo(x-w*.5,ty-h*.22); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x+w*.5,ty-h*.22); ctx.fill(); } }
    ctx.fillStyle=color; ctx.fillRect(x-1,y-2,2,3); });
}
function clumps(color,light,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const s=9+r*10;
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-s*.6,s,0,7); ctx.arc(x-s*.8,y-s*.2,s*.7,0,7); ctx.arc(x+s*.9,y-s*.25,s*.75,0,7); ctx.fill();
    ctx.fillStyle=light; ctx.beginPath(); ctx.arc(x-s*.3,y-s*.95,s*.45,0,7); ctx.arc(x-s*1.05,y-s*.45,s*.3,0,7); ctx.fill(); });
}
function mesas(color,stripe,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const w=34+r*50, h=26+r*34;
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x-w/2-10,y+1); ctx.lineTo(x-w/2,y-h); ctx.lineTo(x+w/2,y-h); ctx.lineTo(x+w/2+12,y+1); ctx.fill();
    ctx.fillStyle=stripe; for(const f of [.3,.62]) ctx.fillRect(Math.round(x-w/2-10*f+1),Math.round(y-h*(1-f)),Math.round(w+20*f-2),2); });
}
function hoodoos(color,light,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const w=8+r*8, h=24+r*40;
    ctx.fillStyle=color; ctx.fillRect(x-w/2,y-h,w,h+1); ctx.fillRect(x-w/2-3,y-h*.55,w+6,h*.55);
    ctx.fillRect(x-w/2-4,y-h-6,w+8,7);
    ctx.fillStyle=light; ctx.fillRect(x-w/2,y-h,2,h); ctx.fillRect(x-w/2-4,y-h-6,w+8,2); });
}
function cloud(x,y,w,light,shade){

  ctx.fillStyle=light; ctx.fillRect(x+3,y-5,w-8,6); ctx.fillRect(x+w*.25,y-10,w*.35,6); ctx.fillRect(x+w*.5,y-7,w*.3,4);

function clouds(n,light,shade,ymin,ymax,par,speed){

}
function birds(n,color,ymin,ymax){

    const f=Math.sin(clock*9+i*2)>0?1:0; ctx.fillRect(x-3,y-f,3,1); ctx.fillRect(x+1,y-f,3,1); ctx.fillRect(x,y,1,1); }

function sunDisc(x,y,r,col,glow){

function fog(y,h,col,alpha){ const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,col); g.addColorStop(1,'rgba(0,0,0,0)');

// ---------- Szenen ----------
function drawScene(style){
  const th=THEMES[style], [c0,c1,c2,c3]=th.r;
  const g=ctx.createLinearGradient(0,0,0,SKY_H); g.addColorStop(0,th.top); g.addColorStop(.55,th.mid); g.addColorStop(1,th.bot);

const slopeCache={};
function slopeTile(style,ch){
  const k=style+ch; if(slopeCache[k]) return slopeCache[k];
  const f=SLOPES[ch], c=mk(16,24), g=c.getContext('2d'), pal=PAL[style].top;
  g.save(); g.beginPath(); g.moveTo(0,24); for(let x=0;x<=16;x++) g.lineTo(x,f(Math.min(15.99,x))); g.lineTo(16,24); g.closePath(); g.clip();
  g.drawImage(T.body[style][1],0,0); g.drawImage(T.body[style][2],0,16); g.restore();
  for(let x=0;x<16;x++){ const y=Math.round(f(x+.5)), px=(yy,col)=>{ if(yy>=0&&yy<24){ g.fillStyle=col; g.fillRect(x,yy,1,1); } };
    px(y-1,'rgba(26,16,32,.45)'); px(y,pal[0]); px(y+1,pal[1]); px(y+2,pal[1]); px(y+3,pal[1]); px(y+4,pal[2]); if(x%3) px(y+5,pal[2]); px(y+(x%3?6:5),pal[3]); }
  return slopeCache[k]=c;
}
function drawTiles(c0,c1,r0,r1){
  const slopes=[];
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=L.grid[r][c]; if(t===' '||t==='~') continue;
    if(SLOPES[t]){ slopes.push([c,r,t]); continue; }
    const x=c*TS, y=r*TS, v=(c*7+r*3)%3;
    if(t==='#'||t==='H'){
      const top=(r===0||!isGroundCh(L.grid[r-1][c]));
      const st=styleAt(c), hid=t==='H', shown=hid&&L.reveal.has(c+','+r);
      if(shown) ctx.globalAlpha=.32;
      ctx.drawImage(top?T.top[st][v]:T.body[st][v],x,y);
      if(hid&&!shown){ ctx.fillStyle='rgba(26,16,32,.22)'; ctx.fillRect(x+5,y+9,2,1); ctx.fillRect(x+10,y+4,1,2); }
      ctx.globalAlpha=1;
      ctx.fillStyle='rgba(26,16,32,.55)';
      if(c>0&&!isGroundCh(L.grid[r][c-1])) ctx.fillRect(x,y,1,TS);
      if(c<L.w-1&&!isGroundCh(L.grid[r][c+1])) ctx.fillRect(x+TS-1,y,1,TS);
      if(r<L.h-1&&L.grid[r+1][c]===' ') ctx.fillRect(x,y+TS-1,TS,1);
    }
    else if(t==='=') ctx.drawImage(T.wood,x,y);
    else if(t==='X') ctx.drawImage(T.crack,x,y);
    else if(t==='^') ctx.drawImage(SPIKE,x,y);
    else if(t==='B'){ const b=L.crumbles.get(c+','+r); const j=b&&!b.gone?Math.round((Math.random()-.5)*2):0; ctx.drawImage(T.crumble,x+j,y); }
  }
  for(const [c,r,t] of slopes) ctx.drawImage(slopeTile(styleAt(c),t),c*TS,r*TS);
}

// ---------- Kamera ----------
// Federnd gedämpft (kein Ruck), Mittelpunkt-basiert (Zoom verschiebt nichts),
// Blickrichtung mit Verzögerung, Bodenhöhe als Anker, Fenster für große Höhen, Vorausschau aufs Gelände.
let zoom=1, viewH=150;
const CAM={cx:0,cy:0,vx:0,vy:0,look:0,vlook:0,lookDir:1,dirT:0,base:0,ahead:0,vahead:0,fall:0,vfall:0,zv:0,spd:0,snap:true};
function applyZoom(){ viewH=VIEW_H*zoom*(1-punch); scale=cv.height/viewH; viewW=cv.width/scale; }
function damp(cur,target,st,key,dt,obj){ // kritisch gedämpfte Feder (SmoothDamp)
  const o=2/Math.max(.0001,st), x=o*dt, e=1/(1+x+.48*x*x+.235*x*x*x), ch=cur-target, tmp=(obj[key]+o*ch)*dt;
  obj[key]=(obj[key]-o*tmp)*e; let out=target+(ch+tmp)*e;
  if((target-cur>0)===(out>target)){ out=target; obj[key]=0; } return out; }
function surfaceAhead(dir){
  const c0=Math.floor((P.x+P.w/2)/TS), feet=CAM.base, r0=Math.floor(feet/TS);
  let sum=0, wsum=0, gaps=0;
  for(let d=2;d<=10;d++){
    const c=c0+dir*d; if(c<0||c>=L.w) break;
    let found=null;
    for(let k=0;k<=7&&found===null;k++) for(const r of k?[r0+k,r0-k]:[r0]){
      if(r>=1&&r<L.h&&solid(c,r)&&!solid(c,r-1)&&tileAt(c,r)!=='^'){ found=r*TS; break; } }
    for(const m of L.movers) if(found===null&&c*TS+8>m.x&&c*TS+8<m.x+m.w&&Math.abs(m.y-feet)<TS*7) found=m.y;
    if(found===null){ gaps++; continue; }
    const w=1/d; sum+=found*w; wsum+=w;
  }
  return {y:wsum?sum/wsum:null, gaps};
}
function cameraSnap(){
  CAM.base=P.y+P.h; CAM.lookDir=P.face; CAM.dirT=0; CAM.look=P.face*viewW*.1; CAM.vlook=0; CAM.ahead=0; CAM.vahead=0; CAM.fall=0; CAM.vfall=0;
  CAM.vx=0; CAM.vy=0; CAM.zv=0; CAM.spd=0; zoom=1; applyZoom();
  CAM.cx=P.x+P.w/2+CAM.look; CAM.cy=CAM.base-viewH*.17; clampCam(); CAM.snap=true;
}
function clampCam(){
  const W=L.w*TS, H=L.h*TS;
  CAM.cx=Math.max(viewW/2,Math.min(W-viewW/2,CAM.cx)); CAM.cy=Math.max(viewH/2,Math.min(H-viewH/2,CAM.cy));
  camX=CAM.cx-viewW/2; camY=CAM.cy-viewH/2;
}
function camera(dt){
  const sp=Math.abs(P.vx), feet=P.y+P.h;
  // Blickrichtung: wechselt erst nach anhaltender Bewegung (kein Hin-und-her bei kurzem Tippen)
  const moveDir=sp>25?Math.sign(P.vx):0;
  if(moveDir&&moveDir!==CAM.lookDir){ CAM.dirT+=dt; if(CAM.dirT>.22||P.dashT>0||P.kickT>0){ CAM.lookDir=moveDir; CAM.dirT=0; } } else CAM.dirT=0;
  CAM.spd+=(sp-CAM.spd)*Math.min(1,dt*2.5);   // geglättetes Tempo
  const sf=Math.min(1,CAM.spd/Math.max(40,PH.max));
  const lookT=Math.max(-.26,Math.min(.26,CAM.lookDir*(.06+.14*sf)*PH.camLook))*viewW;
  CAM.look=damp(CAM.look,lookT,.55,'vlook',dt,CAM);
  // Vertikal: Bodenhöhe ist Anker; in der Luft nur folgen, wenn Sam das Fenster verlässt
  const onWall=P.wallDir&&!P.ground;
  if(P.ground) CAM.base=feet;
  else if(onWall&&feet<CAM.base) CAM.base=Math.min(CAM.base,feet+TS*.5);
  let anchor=CAM.base;
  const up=TS*2.4;
  if(feet<CAM.base-up) anchor=feet+up;           // weit hoch (Feder, Wand, Aufwind)
  if(feet>CAM.base) anchor=feet;                  // unter die letzte Standhöhe gefallen
  // Vorausschau aufs Gelände: nur am Boden messen, sanft einblenden
  if(P.ground){ const a=surfaceAhead(CAM.lookDir);
    let d=a.y!==null?Math.max(-TS*3,Math.min(TS*4,a.y-CAM.base))*.4:0; if(a.gaps>=5) d=Math.max(d,TS*1.2);
    CAM.aheadT=d*PH.camLook/1.4; }
  CAM.ahead=damp(CAM.ahead,CAM.aheadT||0,.4,'vahead',dt,CAM);
  // Blick nach unten nur beim Fall unter die Standhöhe
  const fallT=(!P.ground&&!P.glide&&P.vy>120&&feet>CAM.base+TS*.25)?Math.min(TS*3,(P.vy-120)*.35):0;
  CAM.fall=damp(CAM.fall,fallT,fallT>CAM.fall?.22:.15,'vfall',dt,CAM);
  // Zoom: nur bei anhaltendem Tempo und Schwung, langsam
  const want=Math.min(1,sf*.7+tier()*.1);
  zoom=damp(zoom,1+PH.camZoom*want,1.1,'zv',dt,CAM);
  punch+=(punchT-punch)*Math.min(1,dt*14); punchT=Math.max(0,punchT-dt*.18);
  applyZoom();
  // Ziele und Federn
  const tx=P.x+P.w/2+CAM.look;
  const ty=anchor+CAM.ahead+CAM.fall-viewH*.17;   // Füße bei ca. 67 % der Bildhöhe
  const W=L.w*TS, H=L.h*TS, ctx_=Math.max(viewW/2,Math.min(W-viewW/2,tx)), cty=Math.max(viewH/2,Math.min(H-viewH/2,ty));
  // Nachführzeit: stufenlos kürzer, je tiefer Sam unter die Standhöhe fällt oder je schneller er ist
  const fallK=Math.max(0,Math.min(1,(feet-CAM.base)/(TS*2)));
  const stX=(1-.35*Math.min(1,sp/220))/Math.max(1,PH.camSmooth), stY=(1-.45*fallK)/Math.max(1,PH.camSmoothY);
  // Weiche Ränder: läuft Sam Richtung Bildrand, rückt das Ziel nach, statt die Kamera hart zu versetzen
  const mx=viewW*.36, my=viewH*.34, pcx=P.x+P.w/2;
  let gx=ctx_, gy=cty;
  gx=Math.min(Math.max(gx,pcx-mx),pcx+mx);            // stufenlos: Ziel hält Sam innerhalb der Ränder
  gy=Math.min(Math.max(gy,feet-my),P.y+my);
  CAM.cx=damp(CAM.cx,gx,stX,'vx',dt,CAM);
  CAM.cy=damp(CAM.cy,gy,stY,'vy',dt,CAM);
  // Sicherheitsgrenze nur ganz am Rand
  const hx=viewW*.46, hy=viewH*.5-3;
  if(pcx>CAM.cx+hx) CAM.cx=pcx-hx; if(pcx<CAM.cx-hx) CAM.cx=pcx+hx;
  if(feet>CAM.cy+hy) CAM.cy=feet-hy; if(P.y<CAM.cy-hy) CAM.cy=P.y+hy;
  clampCam();
}

  const BRIGHT='precision mediump float;varying vec2 uv;uniform sampler2D s;uniform float thr;void main(){vec3 c=texture2D(s,uv).rgb;float l=max(max(c.r,c.g),c.b);gl_FragColor=vec4(c*smoothstep(thr,1.,l),1.);}';
  const BLUR='precision mediump float;varying vec2 uv;uniform sampler2D s;uniform vec2 d;void main(){vec3 c=texture2D(s,uv).rgb*.227;'+
    'c+=(texture2D(s,uv+d).rgb+texture2D(s,uv-d).rgb)*.1945;c+=(texture2D(s,uv+2.*d).rgb+texture2D(s,uv-2.*d).rgb)*.1216;'+
    'c+=(texture2D(s,uv+3.*d).rgb+texture2D(s,uv-3.*d).rgb)*.054;c+=(texture2D(s,uv+4.*d).rgb+texture2D(s,uv-4.*d).rgb)*.016;gl_FragColor=vec4(c,1.);}';
  const FINAL=`precision mediump float;varying vec2 uv;
uniform sampler2D scene,bloom;uniform vec2 res;uniform float amb,bloomAmt,vig,ga,fa;uniform vec3 grade,fogC;
uniform vec4 lp[${MAX_LIGHTS}];uniform vec4 lc[${MAX_LIGHTS}];uniform int ln;
void main(){
  vec3 c=texture2D(scene,uv).rgb;
  vec2 asp=vec2(res.x/res.y,1.);
  vec3 light=vec3(0.),glow=vec3(0.);
  for(int i=0;i<${MAX_LIGHTS};i++){ if(i>=ln) break;
    float f=clamp(1.-length((uv-lp[i].xy)*asp)/lp[i].z,0.,1.); f*=f;
    light+=lc[i].rgb*lc[i].a*f; glow+=lc[i].rgb*lc[i].a*f*f*lp[i].w; }
  vec3 o=c*(vec3(amb)+light*(1.-amb)*1.7);
  o+=glow*.28+texture2D(bloom,uv).rgb*bloomAmt;
  o=mix(o,o*grade,ga*2.);
  o=mix(o,fogC*max(amb,.5),fa*smoothstep(.5,0.,uv.y));
  float v=smoothstep(.9,.25,length((uv-vec2(.5,.48))*vec2(1.,1.2)));
  o*=mix(1.-vig,1.,v);
  gl_FragColor=vec4(o,1.);
}`;
  function prog(fs){
    const p=gl.createProgram();
    for(const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){ const sh=gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh);
      if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p,sh); }
    gl.bindAttribLocation(p,0,'p'); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u={}; return {p,u:n=>u[n]??(u[n]=gl.getUniformLocation(p,n))};
  }
  function tex(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
    return t; }
  let P1,P2,P3;
  try{ P1=prog(BRIGHT); P2=prog(BLUR); P3=prog(FINAL); }catch(e){ console.warn('WebGL-Effekte aus:',e.message); return off; }
  const quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const sceneT=tex(); const fb=[0,1].map(()=>({t:tex(),f:gl.createFramebuffer()}));
  let W=0,H=0,qw=1,qh=1, active=true, lost=false;
  const lpA=new Float32Array(MAX_LIGHTS*4), lcA=new Float32Array(MAX_LIGHTS*4);
  function resize(w,h){
    W=w; H=h; c.width=w; c.height=h; qw=Math.max(1,w>>2); qh=Math.max(1,h>>2);
    for(const b of fb){ gl.bindTexture(gl.TEXTURE_2D,b.t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,qw,qh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.bindFramebuffer(gl.FRAMEBUFFER,b.f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,b.t,0); }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  function pass(P,target,w,h,src){ gl.bindFramebuffer(gl.FRAMEBUFFER,target); gl.viewport(0,0,w,h); gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src); gl.uniform1i(P.u('s'),0); }
  function render(p){
    if(!active||lost) return;
    gl.bindTexture(gl.TEXTURE_2D,sceneT); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
    pass(P1,fb[0].f,qw,qh,sceneT); gl.uniform1f(P1.u('thr'),.68); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    pass(P2,fb[1].f,qw,qh,fb[0].t); gl.uniform2f(P2.u('d'),1.5/qw,0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    pass(P2,fb[0].f,qw,qh,fb[1].t); gl.uniform2f(P2.u('d'),0,1.5/qh); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H); gl.useProgram(P3.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneT); gl.uniform1i(P3.u('scene'),0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fb[0].t); gl.uniform1i(P3.u('bloom'),1);
    gl.uniform2f(P3.u('res'),W,H); gl.uniform1f(P3.u('amb'),p.amb); gl.uniform1f(P3.u('bloomAmt'),p.bloom);
    gl.uniform1f(P3.u('vig'),p.vig); gl.uniform1f(P3.u('ga'),p.ga); gl.uniform1f(P3.u('fa'),p.fa);
    gl.uniform3fv(P3.u('grade'),p.grade); gl.uniform3fv(P3.u('fogC'),p.fog);
    const n=Math.min(MAX_LIGHTS,p.lights.length); lpA.fill(0); lcA.fill(0);
    for(let i=0;i<n;i++){ const l=p.lights[i]; lpA.set([l[0],l[1],l[2],l[3]],i*4); lcA.set([l[4],l[5],l[6],l[7]],i*4); }
    gl.uniform4fv(P3.u('lp[0]'),lpA); gl.uniform4fv(P3.u('lc[0]'),lcA); gl.uniform1i(P3.u('ln'),n);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function setActive(on){ active=on&&!lost; c.style.display=active?'block':'none'; cv.style.visibility=active?'hidden':'visible'; }
  c.addEventListener('webglcontextlost',e=>{ e.preventDefault(); lost=true; setActive(false); });
  if(cv.parentNode) cv.parentNode.insertBefore(c,cv.nextSibling);
  return {ok:true,render,resize,setActive};
})();
const rgb1=h=>hex(h).map(v=>v/255);
function collectLights(){
  if(!L||state==='start') return [];
  const out=[], W=cv.width, H=cv.height;
  const add=(x,y,r,col,i,glow,prio)=>{ const sx=(x-camX)*scale, sy=(y-camY)*scale, rp=r*scale;
    if(sx<-rp||sx>W+rp||sy<-rp||sy>H+rp) return;
    const [R,G,B]=rgb1(col); out.push([sx/W,1-sy/H,rp/H,glow,R,G,B,i,prio]); };
  const wc=WORLD_COL[L.id]||'#ffffff';
  add(P.x+P.w/2,P.y+P.h/2,state==='celebrate'?130:(L.style==='snow'?90:72),state==='celebrate'?wc:'#ffe2b8',state==='celebrate'?1.4:1,.3,0);
  if(L.goal) add(L.goal.x+8,L.goal.bottom-24,48,wc,1,1,1);
  for(const k of L.crystals) if(!k.got) add(k.x,k.y,32,'#7fe0ff',.9,1,1);
  for(const k of L.stars) if(!k.got) add(k.x,k.y,30,'#ffe14d',.9,1,1);
  for(const d of L.doors) add(d.x+8,d.bottom-16,40,WORLD_COL[d.world]||'#f6ead2',.8,.8,2);
  for(const k of L.checkpoints) add(k.x+8,k.bottom-28,k.on?34:20,k.on?'#f2a65a':'#9aa4b8',k.on?.8:.35,.8,2);
  for(const k of L.coins) if(!k.got) add(k.x,k.y,15,'#ffd166',.7,1,3);
  for(const e of L.enemies) if(e.alive&&!(e.type==='fisch'&&e.state!=='leap')) add(e.x+e.w/2,e.y+e.h/2+e.bob,e.type==='geist'?26:11,ETYPE[e.type].light,e.type==='geist'?.7:.5,.5,3);
  if(out.length>MAX_LIGHTS){ const px=.5; out.sort((a,b)=>a[8]-b[8]||Math.abs(a[0]-px)-Math.abs(b[0]-px)); out.length=MAX_LIGHTS; }
  return out;
}
function fxRender(){
  if(!FX.ok||!dbg.fx) return;
  const bl=themeBlend(), A=FXT[bl.a], B=FXT[bl.b], t=bl.t, m=(x,y)=>x+(y-x)*t, ma=(x,y)=>x.map((v,i)=>m(v,y[i]));
  FX.render({amb:Math.max(0,1-(1-m(A.amb,B.amb))*PH.fxDark),grade:ma(A.grade,B.grade),ga:m(A.ga,B.ga),fog:ma(A.fog,B.fog),fa:m(A.fa,B.fa),
    vig:m(A.vig,B.vig),bloom:m(A.bloom,B.bloom)*PH.fxBloom,lights:collectLights()});
}

FX.setActive(dbg.fx);

// ---------- HUD ----------
const flowFill=document.getElementById('flowfill'), flowLbl=document.getElementById('flowlbl'), hc=document.getElementById('hc'), hr=document.getElementById('hr');
function updateHud(){
  if(!L) return;
  if(dbg.info) dbgInfo.textContent=`vx ${P.vx.toFixed(0)} · vy ${P.vy.toFixed(0)} · max ${(PH.max+tier()*PH.tierBonus).toFixed(0)} · Schwung ${flow.toFixed(0)}`;
  if(L.id==='hub'){
    const total=Object.keys(save.crystals).length;
    hc.textContent=`◆ ${total}/13 · ★ ${Object.keys(save.stars||{}).length}/8 · ● ${save.wallet}`;
    hr.innerHTML=['double','wall','dash','glide'].map(a=>`<span class="pill${save.ab[a]?' on':''}">${AB_INFO[a].short}</span>`).join('');
  } else {
    hc.textContent=`◆ ${L.crystals.filter(k=>k.got).length}/${L.crystals.length} · ★ ${L.stars.filter(k=>k.got).length}/${L.stars.length} · ● ${levelCoins}/${L.coins.length}`;
    hr.textContent=time.toFixed(1)+'s';
  }
  flowFill.style.width=flow+'%';
  flowLbl.textContent=`Schwung ×${tier()+1}`;
}

// ---------- Loop mit festem Zeitschritt ----------
const STEP=1/60; let acc=0, last=performance.now(), hudT=0;
// Zwischenbilder: Spieler, Kamera und Plattformen zwischen zwei Rechenschritten weich überblenden
const PREV={px:0,py:0,cx:0,cy:0,z:1,pu:0,m:[]};
function snapshot(){ PREV.px=P.x; PREV.py=P.y; PREV.cx=CAM.cx; PREV.cy=CAM.cy; PREV.z=zoom; PREV.pu=punch;
  PREV.m=L.movers.map(m=>[m.x,m.y]); }
function withInterp(a,fn){
  if(a>=1||!L||PREV.m.length!==L.movers.length){ fn(); return; }
  const lerp=(p,c)=>p+(c-p)*a;
  const sv={px:P.x,py:P.y,cx:CAM.cx,cy:CAM.cy,z:zoom,pu:punch,m:L.movers.map(m=>[m.x,m.y])};
  if(Math.abs(P.x-PREV.px)<64&&Math.abs(P.y-PREV.py)<64){ P.x=lerp(PREV.px,P.x); P.y=lerp(PREV.py,P.y); }
  CAM.cx=lerp(PREV.cx,CAM.cx); CAM.cy=lerp(PREV.cy,CAM.cy); zoom=lerp(PREV.z,zoom); punch=lerp(PREV.pu,punch);
  L.movers.forEach((m,i)=>{ m.x=lerp(PREV.m[i][0],m.x); m.y=lerp(PREV.m[i][1],m.y); });
  applyZoom(); camX=CAM.cx-viewW/2; camY=CAM.cy-viewH/2;
  try{ fn(); } finally {
    P.x=sv.px; P.y=sv.py; CAM.cx=sv.cx; CAM.cy=sv.cy; zoom=sv.z; punch=sv.pu; L.movers.forEach((m,i)=>{ m.x=sv.m[i][0]; m.y=sv.m[i][1]; });
    applyZoom(); camX=CAM.cx-viewW/2; camY=CAM.cy-viewH/2; }
}
function frame(now){
  let dt=Math.min(.1,(now-last)/1000); last=now;
  if(matchMedia('(orientation: portrait)').matches&&innerWidth<900) dt=0;
  acc+=dt;
  while(acc>=STEP){ clock+=STEP;
    if(L){ snapshot(); if(hitstop>0) hitstop-=STEP; else { update(STEP); tickCelebrate(STEP); tickParticles(STEP); } camera(STEP); }
    if(shake>0) shake-=STEP; acc-=STEP; }
  if(L){ const a=CAM.snap?1:acc/STEP; CAM.snap=false; withInterp(a,()=>{ draw(); fxRender(); }); }
  hudT-=dt; if(hudT<=0){ updateHud(); hudT=.1; }
  requestAnimationFrame(frame);
}
resize(); loadLevel('hub'); requestAnimationFrame(frame);
window.__dz={get cam(){return {camX,camY,cx:CAM.cx,cy:CAM.cy};},PH,setFlow:v=>{flow=v;},startCelebrate,ITEM,playStep,schedule,audioInit,playSong,sfx,SFX,AU,loadLevel,update,P,save,get L(){return L;},setState:s=>{state=s;},finishLevel};
})();
