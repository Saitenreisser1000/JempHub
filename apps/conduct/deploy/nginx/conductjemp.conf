# ConductJemp – statische App unter conductjemp.jemphub.com
# Installation siehe apps/conduct/README.md. HTTPS ergänzt certbot automatisch.
server {
    listen 80;
    listen [::]:80;
    server_name conductjemp.jemphub.com;

    root /var/www/conductjemp;
    index index.html;

    # Dateinamen enthalten keine Versionsnummer: Browser fragen bei jedem Laden
    # kurz nach, ob sich etwas geändert hat (ETag), statt alte Stände zu behalten.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(svg|ico|png|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Vorlagen und versteckte Dateien nicht ausliefern
    location ~ /\. { deny all; }
}
