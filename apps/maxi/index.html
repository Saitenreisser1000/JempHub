<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<title>Maxis Bierkiste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: Vollbild-Canvas im Hochformat, HUD oben, Overlays als Etikett-Karten */
:root{
  --night:#1b2433; --hop:#2f5d3a; --cream:#f3e6c4; --copper:#d08a3c; --crate:#a3302a; --gold:#e6b84a; --ink:#141a24;
  --f-display:"Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --f-ui:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;
  font-family:var(--f-ui);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.hud .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.hud .val{font-family:var(--f-display);font-size:26px;line-height:1}
.hud .mid{text-align:center}
.hud .right{text-align:right}
#lives{font-size:18px;letter-spacing:2px;line-height:1.3}
.fillrow{flex:0 0 100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.bar{display:flex;gap:2px;padding:4px;border-radius:7px;background:rgba(20,26,36,.6)}
.bar i{display:block;width:9px;height:14px;border-radius:2px;background:rgba(243,230,196,.22)}
.bar i.on{background:var(--gold)}
.bar.full i{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bar.full i{animation:none}}
#fillTxt{font-weight:700;font-size:15px;letter-spacing:.06em;min-width:52px}
.intro{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);width:min(340px,calc(100% - 32px));box-sizing:border-box;
  background:var(--cream);color:var(--ink);border-radius:12px;padding:14px 16px 12px;text-align:center;display:grid;gap:6px;z-index:4;pointer-events:none;
  box-shadow:0 0 0 3px var(--hop),0 12px 30px rgba(0,0,0,.45)}
.intro h3{margin:0;font:400 24px/1.1 var(--f-display);color:var(--crate)}
.intro p{margin:0;font:500 16px/1.3 var(--f-ui)}
.intro .go{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--hop);opacity:.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 116px);width:min(340px,calc(100% - 32px));box-sizing:border-box;
  background:var(--cream);color:var(--ink);border-radius:10px;padding:10px 14px;font:500 15px/1.3 var(--f-ui);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:4;pointer-events:none}
#pauseBtn{pointer-events:auto;margin-top:6px;background:rgba(20,26,36,.55);color:var(--cream);border:1px solid rgba(243,230,196,.35);
  border-radius:6px;font:700 13px var(--f-ui);letter-spacing:.08em;padding:4px 10px;text-transform:uppercase}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,20,30,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.label{box-sizing:border-box;width:min(360px,100%);background:var(--cream);color:var(--ink);border-radius:14px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 0 0 4px var(--hop),0 0 0 6px var(--cream),0 18px 40px rgba(0,0,0,.5);display:grid;gap:12px}
.brand{font:700 13px var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:var(--hop)}
.titlescreen{display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  background:linear-gradient(rgba(15,20,30,.55),rgba(15,20,30,0) 38%,rgba(15,20,30,0) 72%,rgba(15,20,30,.7))}
.titlecard{gap:8px;padding:18px 18px 16px}
.titlecard h1{font-size:44px}
.who{font:700 18px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--hop)}
.startbox{width:min(360px,100%);display:grid;gap:8px;text-align:center}
.startbox .btn{box-shadow:0 0 0 3px var(--cream),0 10px 26px rgba(0,0,0,.5)}
.hint{margin:0;font:500 15px var(--f-ui);color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.label h1{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1;margin:0;color:var(--crate);text-wrap:balance}
.label h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;margin:0;color:var(--crate)}
.label p{margin:0;font-size:17px;line-height:1.35;font-weight:500}
.rule{height:2px;background:var(--hop);opacity:.5;margin:2px 24px}
.btn{font:400 22px var(--f-display);background:var(--hop);color:var(--cream);border:0;border-radius:10px;padding:14px 18px;cursor:pointer}
.btn:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--copper);outline-offset:3px}
.btn.sec{background:transparent;color:var(--hop);border:2px solid var(--hop);font-size:18px;padding:10px 14px}
.small{font-size:14px!important;opacity:.75}
.big{font-family:var(--f-display);font-size:52px;line-height:1;color:var(--ink)}
</style>
</head>
<body>
<canvas id="c" aria-label="Spielfeld"></canvas>

<div class="hud" id="hud" hidden>
  <div><div class="lbl">Punkte</div><div class="val" id="score">0</div></div>
  <div class="mid"><div class="lbl">Kisten</div><div class="val" id="crates">0</div></div>
  <div class="right"><div class="lbl">Bruch</div><div id="lives"></div><button id="pauseBtn" type="button">Pause</button></div>
  <div class="fillrow"><div class="bar" id="bar"></div><span id="fillTxt">0 / 20</span></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="intro" id="intro" role="status" hidden><h3 id="introTitle"></h3><p id="introText"></p><div class="go" id="introGo">Tippen zum Weiterspielen</div></div>

<div class="overlay titlescreen" id="start">
  <div class="label titlecard">
    <div class="brand">Freetown Brewery präsentiert</div>
    <h1>Maxis Bierkiste</h1>
    <div class="who">mit Maximilian Weichl</div>
    <div class="rule"></div>
    <p>Fang die Flaschen der Barbesucher mit der Kiste. 20 Flaschen sind eine volle Kiste, dann holt der Stapler sie ab.</p>
  </div>
  <div class="startbox">
    <button class="btn" id="playBtn" type="button">Prost, los geht's</button>
    <p class="hint" id="bestStart"></p>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="label">
    <h2>Pause</h2>
    <button class="btn" id="resumeBtn" type="button">Weiter</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="label">
    <div class="brand">Freetown Brewery</div>
    <h2>Zu viel Bruch!</h2>
    <div class="big" id="finalScore">0</div>
    <p id="finalInfo"></p>
    <button class="btn" id="againBtn" type="button">Nochmal</button>
  </div>
</div>


<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const W = 400; let H = 700, S = 1, dpr = 1, groundY = 620, OX = 0, XL = 0, XR = 400;
const CAP = 20, MAXMISS = 5;
const C = {
  skyTop:'#24314a', skyBot:'#c98a52', wall:'#6e3f2c', wallDark:'#56301f', brick:'#7c4733', roof:'#2a2a33',
  stone:'#5d5f66', stoneLight:'#73757d', jacket:'#3f7f3c', jacketDark:'#2e5f2c', pants:'#262b36', beard:'#c8944c',
  beardDark:'#a5733a', skin:'#f0c39b', cap:'#7f837d', capDark:'#4b4e51', crate:'#1f7a3a', crateDark:'#165c2b', crateLight:'#3a9a52',
  glass:'#4b2a10', glassHi:'#80501f', paper:'#f4f2ea', capG:'#4fb05a', labelG:'#2f8a3e', capR:'#e0473a', labelR:'#c22a22', gold:'#e6b84a', label:'#f3e6c4', hop:'#2f5d3a', cream:'#f3e6c4', ink:'#141a24'
};

/* ---------- state ---------- */
let state = 'menu', last = 0, tTotal = 0;
const P = { x: W/2, vx: 0, count: 0, extra: 0, walk: 0, emptyT: 0, trip: 0, tripDir: 1 };
let nanas = [], nanaT = 5;
let caught = 0, forceRed = false, introKind = null, introT = 0;
const unlocked = { red: false, nana: false, move: false, catch: false, stork: false }, seen = { red: false, nana: false, move: false, catch: false, stork: false };
let introTarget = null;
const INTRO_LEN = { move: 3.6, catch: 2.8, stork: 3.4 }, INTRO_TAP = { move: .4, catch: .7, stork: .7 };
const UNLOCK_AT = { red: 10, nana: 30, stork: 36 };
let bottles = [], parts = [], texts = [], score = 0, crates = 0, missed = 0, spawnT = 0, shake = 0, zone = 'left', stack = 0;
let best = 0; try { best = +localStorage.getItem('ftb-best') || 0; } catch(e) {}

/* ---------- input ---------- */
let tiltOn = false, gamma = 0, gOff = 0, calib = [], calibrating = false;
let touchX = null, keys = {};
function onOrient(e){
  if (e.gamma == null) return;
  tiltOn = true; gamma = e.gamma;
  if (calibrating){ calib.push(e.gamma); if (calib.length >= 12){ gOff = calib.reduce((a,b)=>a+b,0)/calib.length; calibrating = false; } }
}
let tiltReason = '', listening = false;
// Muss direkt aus dem Tipp heraus aufgerufen werden (iOS verlangt das für die Sensor-Erlaubnis)
function enableTilt(){
  tiltReason = '';
  if (typeof DeviceOrientationEvent === 'undefined') { tiltReason = 'Dieses Gerät meldet keinen Neigungssensor.'; return Promise.resolve(); }
  if (!window.isSecureContext) { tiltReason = 'Die Neigung funktioniert nur, wenn die Seite über https:// geöffnet wird.'; return Promise.resolve(); }
  const listen = () => { if (!listening) { window.addEventListener('deviceorientation', onOrient); listening = true; } };
  if (typeof DeviceOrientationEvent.requestPermission === 'function'){
    let req;
    try { req = DeviceOrientationEvent.requestPermission(); } catch(e) { tiltReason = 'Die Sensor-Erlaubnis konnte nicht angefragt werden.'; return Promise.resolve(); }
    return req.then(r => {
      if (r === 'granted') listen();
      else tiltReason = 'Bewegung wurde nicht erlaubt. Safari-Tab schließen, Seite neu öffnen und beim Start „Erlauben“ tippen.';
    }).catch(() => { tiltReason = inFrame() ? 'In der Claude-Vorschau ist der Bewegungssensor gesperrt. Öffne die Datei über deinen Server.' : 'Die Sensor-Erlaubnis wurde verweigert.'; });
  }
  listen(); return Promise.resolve();
}
function inFrame(){ try { return window.self !== window.top; } catch(e) { return true; } }
function showToast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(showToast.h); showToast.h = setTimeout(() => t.hidden = true, 6000); }
function checkTilt(){
  setTimeout(() => {
    if (!tiltOn) { calibrating = false;
      const why = tiltReason || (inFrame() ? 'In der Claude-Vorschau ist der Bewegungssensor gesperrt. Öffne die Datei über deinen Server.' : 'Vom Neigungssensor kommen keine Daten.');
      showToast('Fingersteuerung aktiv. ' + why); }
    else showToast('Neigungssteuerung aktiv.');
  }, 1000);
}
function recalibrate(){ calib = []; calibrating = true; }
function toLogical(clientX){ return (clientX - OX) / S; }
let flickIds = new Set();
function tryFlick(clientX, clientY){
  if (state !== 'play') return false;
  const fx = toLogical(clientX), fy = clientY / S;
  let best = null, bestD = 40, kind = null;
  const consider = (o, k, ox, oy, r) => { const d = Math.hypot(ox - fx, oy - fy); if (d < r && d < bestD){ bestD = d; best = o; kind = k; } };
  for (const h of hearts) if (!h.taken) consider(h, 'heart', h.x, h.y, 44);
  for (const b of bottles) if (!b.flicked) consider(b, b.red ? 'red' : 'green', b.x, b.y, b.red ? 40 : 28);
  for (const n of nanas) if (!n.flicked) consider(n, 'nana', n.x, n.y - 4, 40);
  if (!best) return false;
  if (kind === 'heart'){ takeHeart(best); return true; }
  const dir = best.x === fx ? (Math.random() < .5 ? -1 : 1) : Math.sign(best.x - fx);
  best.flicked = true; best.vx = dir * (500 + Math.random()*160); best.vy = -370 - Math.random()*120; best.spin = dir * 13;
  if (kind === 'nana'){
    best.ground = 0; const pts = 10 * level(); score += pts;
    floatText(best.x, best.y - 24, `Weggekickt! +${pts}`, '#f5d33f'); beep(420, .16, 'triangle', .14, 2);
  } else if (kind === 'red'){
    const pts = 25 * level(); score += pts;
    floatText(best.x, best.y - 20, `Weg! +${pts}`, '#ff9a8a'); beep(520, .18, 'triangle', .14, 2.2);
  } else { // gute Freetown-Flasche weggekickt: zählt als Bruch
    missed++; shake = .2; sBreak();
    floatText(best.x, best.y - 20, 'Bruch! Die war gut!', '#ff8a6a');
    updateHud(); if (missed >= MAXMISS) { gameOver(); return true; }
  }
  updateHud(); return true;
}
/* Herzen: fallen ab und zu von oben, fangen oder antippen nimmt einen Bruch zurück */
let hearts = [], heartT = 14;
function takeHeart(h){
  h.taken = true; const had = missed > 0; missed = Math.max(0, missed - 1); updateHud();
  floatText(h.x, h.y - 24, had ? 'Bruch weg! ♥' : '♥', '#ff6b8a');
  beep(660, .12, 'sine', .14); setTimeout(() => beep(990, .2, 'sine', .14), 110);
  for (let k=0;k<10;k++) parts.push({ x: h.x, y: h.y, vx:(Math.random()-.5)*200, vy:-Math.random()*220, life:.7, c:'#ff6b8a', s:2.5+Math.random()*2.5, round:true });
}
function drawHeart(x, y, sc, a){
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(255,107,138,.25)'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-18, 0, -14, -16, 0, -7); ctx.bezierCurveTo(14, -16, 18, 0, 0, 12); ctx.closePath();
  ctx.fillStyle = '#e8304f'; ctx.fill(); ctx.strokeStyle = '#fff6dc'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-6, -5, 3, 2, -.6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function updateHearts(dt, crateTop){
  if (missed > 0) heartT -= dt;
  if (heartT <= 0){ hearts.push({ x0: 40 + Math.random()*(W - 80), x: 0, y: -30, t: 0, taken: false, fade: 1 }); heartT = 16 + Math.random()*12; }
  for (let i = hearts.length-1; i >= 0; i--){
    const h = hearts[i];
    if (h.taken){ hearts.splice(i,1); continue; }
    h.t += dt; h.y += 85*dt; h.x = h.x0 + Math.sin(h.t*2.2)*20;
    if (P.trip <= 0 && h.y + 10 >= crateTop && h.y + 10 <= crateTop + 24 && Math.abs(h.x - P.x) < 40){ takeHeart(h); continue; }
    if (h.y > groundY - 10){ h.fade -= dt*2; if (h.fade <= 0) hearts.splice(i,1); }
  }
}
cv.addEventListener('pointerdown', e => { if (state === 'play' && nearZone(toLogical(e.clientX), e.clientY / S)) { startForklift(); return; } if (state === 'intro'){ if (introT > (INTRO_TAP[introKind] ?? 1.2)) endIntro(); return; } if (tryFlick(e.clientX, e.clientY)) { flickIds.add(e.pointerId); return; } touchX = toLogical(e.clientX); });
cv.addEventListener('pointermove', e => { if (flickIds.has(e.pointerId)) { tryFlick(e.clientX, e.clientY); return; } if (touchX !== null || e.pointerType === 'mouse') touchX = toLogical(e.clientX); });
cv.addEventListener('pointerup', e => { if (flickIds.delete(e.pointerId)) return; touchX = null; });
cv.addEventListener('pointercancel', e => { flickIds.delete(e.pointerId); touchX = null; });
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === 'Enter' || e.key === ' ') startForklift(); if (e.key === 'p' || e.key === 'Escape') togglePause(); });
addEventListener('keyup', e => { keys[e.key] = false; });

/* ---------- audio ---------- */
let ac = null;
function beep(freq, dur, type='sine', vol=.15, slide=0){
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
}
function sClink(){ beep(1800 + Math.random()*400, .08, 'triangle', .12); }
function sBreak(){ if (!ac) return; const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate*.25, ac.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 3);
  const g = ac.createGain(); g.gain.value = .35; n.buffer = b; n.connect(g).connect(ac.destination); n.start(); }
function sWhoosh(){ beep(300 + Math.random()*120, .22, 'sine', .05, 2.2); }
function sCash(){ beep(660,.12,'square',.08); setTimeout(()=>beep(880,.12,'square',.08),110); setTimeout(()=>beep(1320,.22,'square',.08),220); }

/* ---------- layout ---------- */
let bg = document.createElement('canvas');
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  // Spielfeld ist 400 breit; bei breiten Fenstern nach Höhe skalieren und mittig setzen
  S = Math.min(w / W, h / 560); OX = (w - W*S) / 2; H = h / S; groundY = H - 78;
  XL = -OX / S; XR = W + OX / S;
  buildBg();
}
addEventListener('resize', resize);

function buildBg(){
  bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'); b.setTransform(dpr*S,0,0,dpr*S,dpr*OX,0);
  const gb = backY();
  const g = b.createLinearGradient(0,0,0,gb); g.addColorStop(0,C.skyTop); g.addColorStop(1,C.skyBot);
  b.fillStyle = g; b.fillRect(XL,0,XR-XL,gb);
  // ferne Hügel
  b.fillStyle = '#3c4a4a'; b.beginPath(); b.moveTo(XL,gb-170);
  for (let x=Math.floor(XL/20)*20;x<=XR+20;x+=20) b.lineTo(x, gb-170 - Math.sin(x/60)*14 - Math.sin(x/23)*5);
  b.lineTo(XR,gb); b.lineTo(XL,gb); b.fill();
  // Brauerei: barockes Brauhaus mit Ziegeldach, Ziergiebel und Uhr
  const top = gb-150, L = 20, R = W-20;
  // Ziegeldach
  b.fillStyle = '#7b3326'; b.beginPath(); b.moveTo(L-10, top+2); b.lineTo(L+34, top-46); b.lineTo(R-34, top-46); b.lineTo(R+10, top+2); b.closePath(); b.fill();
  b.strokeStyle = 'rgba(0,0,0,.2)'; b.lineWidth = 1;
  for (let y = top-40; y < top; y += 6){ const t = (y - (top-46))/48, x1 = L+34 - 44*t, x2 = R-34 + 44*t; b.beginPath(); b.moveTo(x1, y); b.lineTo(x2, y); b.stroke(); }
  b.fillStyle = '#5e241a'; b.fillRect(L+34, top-48, R-L-68, 3);
  // Dachgaube links
  b.fillStyle = '#e8cc98'; b.fillRect(56, top-34, 22, 22); b.fillStyle = '#7b3326'; b.beginPath(); b.moveTo(52, top-34); b.lineTo(67, top-46); b.lineTo(82, top-34); b.fill();
  b.fillStyle = '#f2c46b'; b.fillRect(61, top-30, 12, 14); b.fillStyle = '#fff6dc'; b.fillRect(66.5, top-30, 1.2, 14);
  // hoher Brauerei-Schornstein mit Storchennest
  { const cx = chimneyX(), ct = chimneyTop(), cb = top - 4;
    b.fillStyle = '#7a4532'; b.beginPath(); b.moveTo(cx-17, cb); b.lineTo(cx-10, ct); b.lineTo(cx+10, ct); b.lineTo(cx+17, cb); b.closePath(); b.fill();
    b.fillStyle = '#5e3324'; for (let y = ct + 6; y < cb; y += 9){ const k = (y - ct)/(cb - ct), hw = 10 + 7*k; b.fillRect(cx - hw, y, hw*2, 1.5); }
    b.fillStyle = 'rgba(0,0,0,.18)'; b.beginPath(); b.moveTo(cx+4, cb); b.lineTo(cx+3, ct); b.lineTo(cx+10, ct); b.lineTo(cx+17, cb); b.closePath(); b.fill();
    b.fillStyle = C.cream; b.font = '11px "Alfa Slab One", Georgia, serif'; b.textAlign = 'center'; b.textBaseline = 'middle';

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function drawBottle(x, y, rot, red){
  const capC = red ? C.capR : C.capG, labC = red ? C.labelR : C.labelG;
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);

  ctx.bezierCurveTo(2.4,-9,5.5,-7,5.5,0); ctx.fill();

    ctx.fillRect(-3.6,10.4,7.2,1.2);
  } else {

    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.moveTo(-3,-12); ctx.lineTo(3,-12); ctx.lineTo(4.3,-7); ctx.lineTo(-4.3,-7); ctx.fill();
    ctx.fillStyle = labC; ctx.fillRect(-3.9,-9,7.8,1.2);

    ctx.fillStyle = C.paper; ctx.fillRect(-5.5,2,11,13);
    ctx.fillStyle = labC; ctx.beginPath(); ctx.moveTo(-5.5,11); ctx.lineTo(5.5,8); ctx.lineTo(5.5,15); ctx.lineTo(-5.5,15); ctx.fill();

function drawCrate(cx, topY, count, w=70, h=35){
  // Flaschenhälse in 4 Reihen à 5, hinterste zuerst
  for (let row=3; row>=0; row--) for (let col=0; col<5; col++){
    const i = row*5 + col; if (i >= count) continue;
    const bx = cx - 26 + col*13 + (row%2 ? 2 : -1), by = topY - 2 - (3-row)*2.2;
    ctx.fillStyle = C.glass; ctx.fillRect(bx-2, by-10, 4, 12);
    ctx.fillStyle = C.capG; ctx.fillRect(bx-2.6, by-12, 5.2, 2);
    ctx.fillStyle = C.paper; ctx.fillRect(bx-2.6, by-4, 5.2, 3);
    ctx.fillStyle = C.labelG; ctx.fillRect(bx-2.6, by-3, 5.2, 1);
  }
  // Kiste nach Art einer Freistädter-Mehrwegkiste: grüner Kunststoff, Eckpfeiler, Griffmulden, Rippen, helles Logofeld
  const x0 = cx - w/2, k = w/70;
  ctx.fillStyle = C.crate; rr(x0, topY, w, h, 4*k); ctx.fill();
  ctx.fillStyle = C.crateLight; ctx.fillRect(x0 + 2*k, topY, w - 4*k, 2.5*k);
  ctx.fillStyle = C.crateDark;
  ctx.fillRect(x0, topY + 3*k, 6*k, h - 3*k); ctx.fillRect(x0 + w - 6*k, topY + 3*k, 6*k, h - 3*k);
  ctx.fillRect(x0 + 2*k, topY + h - 4*k, w - 4*k, 4*k);
  for (let rx = x0 + 9*k; rx < x0 + w - 9*k; rx += 6*k) ctx.fillRect(rx, topY + 5*k, 1.2*k, h - 10*k);
  // Griffmulden in den Eckpfeilern
  ctx.fillStyle = '#0a2f18'; rr(x0 + 1.5*k, topY + 5*k, 3*k, 8*k, 1.5*k); ctx.fill(); rr(x0 + w - 4.5*k, topY + 5*k, 3*k, 8*k, 1.5*k); ctx.fill();
  // Logofeld mit Schriftzug in Schreibschrift
  const pw = w - 24*k, ph = h - 14*k, px = cx - pw/2, py = topY + 5.5*k;
  ctx.fillStyle = C.crate; rr(px, py, pw, ph, 3*k); ctx.fill();
  ctx.strokeStyle = C.crateLight; ctx.lineWidth = 1.2*k; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = `italic 700 ${10*k}px Georgia, "Times New Roman", serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Freetown', cx, py + ph/2 + .5*k);
  ctx.fillStyle = C.labelR; ctx.fillRect(cx - 4*k, py + ph - 3*k, 8*k, 1.6*k);
}
function drawBanana(x, y, rot, onGround){
  // Bananenschale: in der Luft hängen die Lappen nach unten, am Boden liegen sie flach
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const petal = (len, wid, a, flat, bend) => {
    ctx.save(); if (flat) ctx.scale(1, .5); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(-3,0); ctx.quadraticCurveTo(-wid+bend,-len*.55,bend,-len); ctx.quadraticCurveTo(wid+bend,-len*.55,3,0); ctx.closePath();
    ctx.fillStyle = '#f1c62f'; ctx.fill(); ctx.strokeStyle = '#a97a10'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1.5,-1); ctx.quadraticCurveTo(-wid*.45+bend*.8,-len*.5,bend*.9,-len*.85); ctx.quadraticCurveTo(wid*.45+bend*.8,-len*.5,1.5,-1); ctx.closePath();
    ctx.fillStyle = '#fbf0c2'; ctx.fill();
    ctx.fillStyle = 'rgba(110,70,20,.5)'; ctx.beginPath(); ctx.arc(bend*.5 + wid*.35, -len*.45, .8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3b1a'; ctx.beginPath(); ctx.arc(bend,-len,1.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  };
  const knob = () => {
    ctx.fillStyle = '#d8a826'; ctx.beginPath(); ctx.ellipse(0, -1, 5, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#7a9a2a'; ctx.beginPath(); ctx.moveTo(-1.6,-3); ctx.lineTo(-1.2,-10); ctx.lineTo(1.6,-10); ctx.lineTo(1.8,-3); ctx.fill();
    ctx.fillStyle = '#4a3216'; ctx.fillRect(-1.5,-12.4,3.2,2.6);
  };
  if (onGround){
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 2, 22, 4, 0, 0, Math.PI*2); ctx.fill();
    petal(20, 8, -1.95, true, 0); petal(20, 8, 1.95, true, 0); petal(17, 7, Math.PI, true, 0);
    petal(14, 6, .25, false, 0);
    knob();
  } else {
    const flap = Math.sin(tTotal*9 + x) * 1.5;
    petal(19, 7, Math.PI - .9, false, 4 + flap);
    petal(19, 7, Math.PI + .9, false, -4 - flap);
    petal(21, 7, Math.PI, false, flap*.6);
    knob();
  }
  ctx.restore();
}
function tripMaxi(dir){
  if (P.trip > 0) return;
  P.trip = 1.6; P.tripDir = dir; P.emptyT = 0;
  const lost = Math.min(P.count, 5); P.count -= lost;
  for (let k=0;k<lost;k++) burst(P.x + (Math.random()-.5)*50, groundY - 6, k%2 === 0);
  floatText(P.x, groundY - 150, 'Ausgerutscht!', '#f5d33f');
  if (lost) floatText(P.x, groundY - 125, `−${lost} Flaschen`, '#ff8a6a');
  shake = .3; beep(900, .55, 'sine', .14, .25); if (lost) sBreak();
}

/* ---------- flow ---------- */
let wake = null;
async function keepAwake(){ try { wake = await navigator.wakeLock?.request('screen'); } catch(e) {} }
async function start(){
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch(e) {}
  reset(); calibrating = false;
  ['start','over','paused'].forEach(id => $(id).hidden = true); $('hud').hidden = false;
  state = 'play'; keepAwake();
  if (!seen.move) unlock('move');
}
function gameOver(){
  state = 'over'; if (score > best){ best = score; try { localStorage.setItem('ftb-best', best); } catch(e) {} }
  $('finalScore').textContent = score;
  $('finalInfo').textContent = `${crates} ${crates === 1 ? 'volle Kiste' : 'volle Kisten'} abgegeben · Rekord ${best}`;
  $('over').hidden = false; try { wake?.release(); } catch(e) {}
}
function togglePause(){
  if (state === 'play'){ state = 'pause'; $('paused').hidden = false; }
  else if (state === 'pause'){ state = 'play'; $('paused').hidden = true; }
}
$('playBtn').onclick = start; $('againBtn').onclick = start;
$('pauseBtn').onclick = togglePause; $('resumeBtn').onclick = togglePause;
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
$('bestStart').textContent = best ? `Dein Rekord: ${best} Punkte` : 'Steuerung: Finger auflegen und nach links oder rechts ziehen.';

resize();
if (document.fonts) document.fonts.ready.then(buildBg);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
