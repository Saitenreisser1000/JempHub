# Place this file on VPS at /etc/nginx/sites-available/jemphub-stemplayer.conf
# Then symlink into /etc/nginx/sites-enabled/ and run nginx -t && systemctl reload nginx

# 1) HTTPS: main hub and path-based apps on jemphub.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jemphub.com www.jemphub.com;

    root /var/www/hub/current;
    index index.html;

    # Hub home
    location = / {
        try_files /index.html =404;
    }

    # EarJemp path
    location = /earjemp {
        return 301 /earjemp/;
    }

    location /earjemp/ {
        try_files $uri $uri/ /earjemp/index.html;
    }

    # StemPlayer path
    location = /stemplayer {
        return 301 /stemplayer/;
    }

    location /stemplayer/ {
        alias /var/www/stemplayer/current/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Backend API for stemplayer path
    location /stemplayer/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2) Legacy hostname redirect to new path structure
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stemplayer.jemphub.com;

    return 301 https://jemphub.com/stemplayer$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name earjemp.com www.earjemp.com;

    return 301 https://jemphub.com/earjemp$request_uri;
}

# 3) HTTP -> HTTPS redirect for all known hostnames
server {
    listen 80;
    listen [::]:80;
    server_name jemphub.com www.jemphub.com earjemp.com www.earjemp.com stemplayer.jemphub.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
