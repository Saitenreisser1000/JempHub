<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1311">
<meta name="description" content="NoteJemp – Noten lesen, Notenwerte und Takte üben.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NoteJemp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" aria-label="NoteJemp – Übersicht">
    <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><g stroke="#e6ebe4" stroke-opacity=".35" stroke-width="1"><line x1="1" x2="33" y1="5" y2="5"/><line x1="1" x2="33" y1="9" y2="9"/><line x1="1" x2="33" y1="13" y2="13"/><line x1="1" x2="33" y1="17" y2="17"/></g><path d="M9 15 L16 9 M20 9 L27 5" stroke="#d8b46a" stroke-width="1.6" stroke-linecap="round" opacity=".75"/><circle cx="7" cy="15" r="3.4" fill="#7cc4f2"/><circle cx="18" cy="9" r="3.4" fill="#8fd3a9"/><circle cx="29" cy="5" r="3.4" fill="#f2c46d"/></svg>
    <span>NoteJemp</span>
  </a>
  <div class="top-r">
    <button class="gbtn" id="soundBtn" aria-pressed="true" title="Nach der Antwort die Note bzw. den Rhythmus hören">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="lb">Ton</span>
    </button>
    <button class="gbtn icon-only" id="helpBtn" aria-expanded="false" title="Tastenkürzel" aria-label="Tastenkürzel"><span style="font:600 14px var(--font-mono)">?</span></button>
  </div>
</header>

<main class="view" id="view" aria-live="polite"></main>

<div class="pop" id="help" hidden>
  <h3>Tastenkürzel</h3>
  <dl>
    <dt>C D E F G A H</dt><dd>Note beantworten</dd>
    <dt># &nbsp; - &nbsp; N</dt><dd>Kreuz, Be, Auflösungszeichen wählen</dd>
    <dt>1 – 5</dt><dd>Notenwert bzw. Antwort wählen</dd>
    <dt>.</dt><dd>Punktiert an / aus</dd>
    <dt>Enter</dt><dd>Starten, weiter</dd>
    <dt>Esc</dt><dd>Zurück zur Übersicht</dd>
  </dl>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
