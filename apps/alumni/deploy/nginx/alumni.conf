# Alumni Editor (Sternstein Gymnasium) – statische App unter alumni.jemphub.com
# Installation siehe apps/alumni/README.md. HTTPS ergänzt certbot automatisch.
server {
    listen 80;
    listen [::]:80;
    server_name alumni.jemphub.com;

    root /var/www/alumni;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # index.html immer frisch laden, damit nach jedem Deploy die neuen Dateien kommen.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hängt einen Hash an die Dateinamen in /assets/: dürfen lange im Cache bleiben.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ /\. { deny all; }
}
