<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Supersam Labor</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Canvas, HUD in den Ecken, Touch-Hälften als Overlay. Bewusst nur ein Look (Pixel-Welt im SNES-Stil). */
:root{
  --night:#16233a; --ember:#f2a65a; --cream:#f6ead2; --ink:#0d1524; --dim:rgba(246,234,210,.25); --sky:#7fe0ff;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--cream);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100vh;height:var(--vh,100dvh);display:block;image-rendering:pixelated}
.hud{position:fixed;font-family:var(--pixel);font-size:14px;text-shadow:2px 2px 0 var(--ink);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.04em}
#hl{top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;align-items:center;gap:10px}
#hc{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px}
#lives{display:flex;gap:3px;font-size:13px;line-height:1;color:#ff5a6a}#lives i{font-style:normal}#lives i.off{color:rgba(255,255,255,.28)}
#lifelost .hearts{font-size:30px;letter-spacing:6px;color:#ff5a6a;text-shadow:3px 3px 0 var(--ink)}#lifelost .hearts i{font-style:normal}#lifelost .hearts i.off{color:rgba(255,255,255,.25)}
#scorebox{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(13,21,36,.22);border:0;padding:3px 12px 5px;min-width:120px;opacity:.78}
#scorebox .sline{display:flex;align-items:baseline;gap:6px;line-height:1}
#scnum{font-size:20px;color:#ffffff;transition:transform .12s;display:inline-block}
#scneed{font-size:11px;opacity:.7}
#scorebox.ok{opacity:.9}
#scorebox.ok #scnum{color:#9be06a}
#scnum.up{transform:scale(1.25);color:#ffe14d}
#scnum.down{transform:scale(1.25);color:#ff6a6a}
.sbar{position:relative;width:100%;height:4px;background:rgba(246,234,210,.18)}
.sbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#f2a65a,#ffd166);transition:width .25s}
#scorebox.ok .sbar i{background:#9be06a}
#sdelta{position:absolute;right:-6px;top:-4px;transform:translateX(100%);font-size:14px;opacity:0;transition:opacity .5s,transform .5s}
#sdelta.show{opacity:1;transform:translateX(100%) translateY(-4px);transition:none}
#hcol{font-size:10px;opacity:.6}
#bossbar{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(13,21,36,.6);border:2px solid rgba(246,234,210,.25);padding:5px 14px 7px;min-width:200px}
#bossname{font-size:15px;color:#ffffff}
.bbar{width:100%;height:9px;background:rgba(246,234,210,.18);box-shadow:2px 2px 0 var(--ink);position:relative}
.bbar i{position:absolute;left:0;top:0;bottom:0;background:#ff6a6a;transition:width .3s}
@media (prefers-reduced-motion:reduce){#scnum{transition:none}}
#hr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:6px;align-items:center;opacity:.85}
#home[hidden]{display:none!important}
#home{pointer-events:auto;font-family:var(--pixel);font-size:14px;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);
  min-width:44px;min-height:36px;cursor:pointer}
#home:focus-visible,#gear:focus-visible{outline:2px solid var(--ember)}
#gear{pointer-events:auto;font-family:var(--pixel);font-size:22px;line-height:1;background:rgba(13,21,36,.3);color:var(--cream);border:2px solid rgba(246,234,210,.35);min-width:44px;min-height:40px;cursor:pointer;opacity:.85}
#debug{justify-content:flex-start;z-index:10}
.tunes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(110px,1.4fr) 3.5em;gap:8px 12px;align-items:center;width:100%;max-width:680px;text-align:left;font-size:11px}
.tunes label{min-width:0}
.tunes input[type=range]{width:100%;accent-color:var(--ember);min-height:28px}
.tunes output{font-variant-numeric:tabular-nums;color:var(--ember);text-align:right}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:11px;max-width:680px}
.checks label{display:flex;align-items:center;gap:6px;min-height:32px}
.checks input{accent-color:var(--ember);width:18px;height:18px}
#fps{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 56px);z-index:30;pointer-events:none;font-family:var(--pixel);font-size:11px;line-height:1.35;color:#c8ffb0;background:rgba(10,14,24,.62);padding:4px 7px;border-radius:4px;white-space:nowrap}
#fps small{display:block;font-size:9px;color:#cfd8e8}
#fps.mid{color:#ffd166} #fps.low{color:#ff7a6a}
#dbgout{width:100%;max-width:680px;min-height:80px;font-family:ui-monospace,monospace;font-size:11px;background:#0d1524;color:var(--cream);border:2px solid var(--dim)}
#dbginfo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:ui-monospace,monospace;font-size:11px;
  background:rgba(13,21,36,.7);padding:3px 8px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;gap:3px;opacity:.6}
.flow[hidden]{display:none}
.flow small{font-size:10px;opacity:.85}
.flowbar{width:96px;height:3px;background:rgba(246,234,210,.18);position:relative}
.flowbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ember)}
.flowbar b{position:absolute;top:0;width:2px;height:3px;background:var(--ink);opacity:.6}
.pill{font-size:10px;padding:2px 6px;border:2px solid var(--dim);opacity:.45}
.pill.on{opacity:1;border-color:var(--sky);color:var(--sky)}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);font-family:var(--pixel);
  font-size:13px;color:var(--ember);text-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .7s;pointer-events:none;white-space:nowrap}
#msg.show{opacity:1;transition:none}
#celebrate{position:fixed;left:0;right:0;top:20%;text-align:center;pointer-events:none;font-family:var(--pixel);--glow:#ffd166;z-index:5}
#celebrate h2{margin:0;font-size:clamp(28px,7vw,56px);color:#ffffff;letter-spacing:.04em;
  text-shadow:0 0 6px var(--glow),0 0 18px var(--glow),0 0 40px var(--glow),3px 3px 0 var(--ink);
  animation:pop .55s cubic-bezier(.2,1.6,.4,1) both,glow 1s ease-in-out .55s infinite alternate}
#celebrate p{margin:10px 0 0;font-size:14px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);animation:rise .4s .45s both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.4)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#celebrate h2,#celebrate p{animation:none}}
.zone{position:fixed;bottom:0;top:0;width:50%;pointer-events:none;display:flex;align-items:flex-end;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);box-sizing:border-box;transition:background .08s}
.zone.l{left:0;justify-content:flex-start;padding-left:calc(env(safe-area-inset-left,0px) + 16px);border-right:1px dashed rgba(246,234,210,.1)}
.zone.r{right:0;justify-content:flex-end;padding-right:calc(env(safe-area-inset-right,0px) + 16px)}
.zone span{font-family:var(--pixel);font-size:18px;opacity:.3;text-shadow:2px 2px 0 var(--ink)}
.zone.on{background:linear-gradient(to top,rgba(242,166,90,.16),transparent 40%)}
.zone.on span{opacity:.9;color:var(--ember)}
.zone.hint{animation:hintpulse 1s ease-in-out infinite}
.zone.hint span{opacity:1;color:#ffe14d;font-size:28px}
@keyframes hintpulse{0%,100%{background:rgba(255,225,77,.05)}50%{background:rgba(255,225,77,.22)}}
#tut{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);z-index:6;display:flex;flex-direction:row;align-items:center;gap:12px;
  font-family:var(--pixel);text-align:left;background:rgba(13,21,36,.72);border:2px solid #ffe14d;padding:4px 6px 4px 12px;width:min(780px,calc(100vw - 32px));box-sizing:border-box;box-shadow:3px 3px 0 var(--ink)}
#tstep{font-size:9px;color:#ffe14d;letter-spacing:.06em;white-space:nowrap;flex:none}
#ttext{font-size:11px;line-height:1.35;color:var(--cream);flex:1}
#ttext.ok{color:#9be06a}
#tskip{font-size:9px;min-height:28px;padding:2px 8px;pointer-events:auto;flex:none}
@media (prefers-reduced-motion:reduce){.zone.hint{animation:none;background:rgba(255,225,77,.15)}}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(13,21,36,.8);text-align:center;touch-action:pan-y;font-family:var(--pixel);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#pause{justify-content:flex-start}#pause>:first-child{margin-top:auto}#pause>:last-of-type{margin-bottom:auto}   /* mittig, aber bei wenig Höhe scrollbar statt oben abgeschnitten */
.panel h1{margin:0;font-size:clamp(24px,5vw,42px);color:var(--ember);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel h2{margin:0;font-size:18px;color:var(--sky);text-shadow:2px 2px 0 var(--ink)}
.panel p{margin:0;max-width:40em;line-height:1.6;font-size:12px;color:var(--cream)}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 16px;text-align:left;font-size:11px;opacity:.9}
.keys b{color:var(--ember);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--pixel);font-size:15px;background:var(--ember);color:var(--ink);border:0;padding:11px 20px;min-height:44px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.stilwahl{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px;font-family:var(--pixel);font-size:11px;color:var(--cream)}
.stilwahl button{font:inherit;background:rgba(13,21,36,.55);color:var(--cream);border:2px solid var(--dim);padding:6px 9px;min-height:36px;cursor:pointer}
.stilwahl button.on{border-color:var(--sky);color:var(--sky)}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--dim);box-shadow:none;font-size:12px}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.ability{border:2px solid var(--sky);padding:10px 16px;max-width:36em}
.stats{font-size:13px;line-height:1.8}
#start{background:linear-gradient(to top,rgba(13,21,36,.8),rgba(13,21,36,0) 38%);justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
#ending{background:radial-gradient(ellipse at 50% 40%,#3a2a6a 0%,#16233a 60%,#0d1524 100%);z-index:12;padding:0}
#endcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.endbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#endtitle{font-size:clamp(34px,9vw,72px);color:#fff;letter-spacing:.04em;
  text-shadow:0 0 8px #ffd166,0 0 22px #ffd166,0 0 46px #f2a65a,4px 4px 0 var(--ink);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,glow 1.2s ease-in-out .7s infinite alternate}
.endsub{font-size:14px!important;animation:rise .5s .5s both}
.endstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;font-size:12px;animation:rise .5s .8s both}
.endstats div{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(13,21,36,.55);border:2px solid rgba(246,234,210,.2);padding:6px 10px;min-width:72px}
.endstats b{font-size:20px;color:#ffd166}
#endbtn{animation:rise .5s 1.1s both}
@media (max-width:560px){.endstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){#endtitle,.endsub,.endstats,#endbtn{animation:none}}
body.title .hud,body.title .zone,body.title #msg,body.title #tut{display:none!important}
#rotate{display:none;z-index:20;background:var(--night)}
@media (orientation:portrait){#rotate{display:flex}}
.phone{width:40px;height:66px;border:4px solid var(--cream);border-radius:8px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.phone{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="zone l" id="zl"><span>◀</span></div>
<div class="zone r" id="zr"><span>▶</span></div>
<div class="hud" id="hl">
  <button id="home" type="button" aria-label="Zurück zur Hubwelt" hidden>⌂ Hub</button>
  <button id="gear" type="button" aria-label="Menü öffnen">⌂</button>
</div>
<div class="hud" id="hc">
  <div id="scorebox" hidden>
    <div class="sline"><b id="scnum">0</b><span id="scneed">/ 0</span></div>
    <div class="sbar"><i id="sfill"></i></div>
    <div id="sdelta"></div>
  </div>
  <div id="lives" hidden aria-label="Leben"></div>
  <div class="flow" id="flowbox" title="Schwung"><small id="flowlbl" hidden>Schwung ×1</small><div class="flowbar"><i id="flowfill"></i><b style="left:33%"></b><b style="left:66%"></b></div></div>
  <div id="bossbar" hidden><span id="bossname"></span><div class="bbar"><i id="bfill"></i></div></div>
  <div id="hcol"></div>
</div>
<div class="hud" id="hr"></div>
<div id="msg"></div>
<div id="tut" hidden>
  <div class="tstep" id="tstep"></div>
  <div class="ttext" id="ttext"></div>
  <button class="btn ghost" id="tskip" type="button">Überspringen</button>
</div>
<div id="celebrate" hidden><h2 id="celebname"></h2><p id="celebtip"></p></div>

<div class="panel" id="start" aria-label="Supersam">
  <div class="row">
    <button class="btn" id="play" type="button">Spielen</button>
    <button class="btn ghost" id="wipe" type="button">Fortschritt löschen</button>
  </div>
  <p id="wipeinfo" hidden>Fortschritt gelöscht.</p>
  <div class="stilwahl"><span>Grafik</span><button type="button" data-stil="klassik">Klassisch</button><button type="button" data-stil="pixel3d">Pixel 3D</button></div>
</div>

<div class="panel" id="ending" hidden>
  <canvas id="endcv" aria-hidden="true"></canvas>
  <div class="endbox">
    <h1 id="endtitle">Glückwunsch!</h1>
    <p class="endsub">Sam hat alle drei Endgegner besiegt.</p>
    <div class="endstats" id="endstats"></div>
    <button class="btn" id="endbtn" type="button">Zurück zur Hubwelt</button>
  </div>
</div>
<div class="panel" id="done" hidden>
  <h1 id="donetitle">Geschafft!</h1>
  <div class="stats" id="donestats"></div>
  <div class="ability" id="donenew" hidden><h2 id="newname"></h2><p id="newhow"></p></div>
  <p id="donehint"></p>
  <button class="btn" id="donebtn" type="button">Zur Hubwelt</button>
</div>

<div class="panel" id="lifelost" hidden>
  <h1 id="lltitle">Leben verloren</h1>
  <div class="hearts" id="llhearts"></div>
  <p id="lltext"></p>
  <div class="row" style="flex-direction:column;align-items:stretch;min-width:220px">
    <button class="btn" id="llagain" type="button">Nochmal</button>
    <button class="btn ghost" id="llhub" type="button">Zur Hubwelt</button>
  </div>
</div>
<div class="panel" id="pause" hidden>
  <h1>Pause</h1>
  <div class="row" style="flex-direction:column;align-items:stretch;min-width:220px">
    <button class="btn" id="presume" type="button">Weiter</button>
    <button class="btn ghost" id="phub" type="button">Zur Hubwelt</button>
    <button class="btn ghost" id="ppractice" type="button">Übungswiese</button>
    <button class="btn ghost" id="pmain" type="button">Hauptmenü</button>
  </div>
  <div class="stilwahl"><span>Grafik</span><button type="button" data-stil="klassik">Klassisch</button><button type="button" data-stil="pixel3d">Pixel 3D</button></div>
  <div class="stilwahl"><span>Auflösung</span><button type="button" data-res="2">Hoch</button><button type="button" data-res="1.5">Mittel</button><button type="button" data-res="1">Niedrig</button><span style="margin-left:10px">Licht</span><button type="button" data-fx="1">An</button><button type="button" data-fx="0">Aus</button></div>
  <div class="tunes" style="max-width:380px">
    <label for="v-music">Musik</label><input type="range" id="v-music" min="0" max="1" step="0.05"><output id="o-music" for="v-music"></output>
    <label for="v-sfx">Effekte</label><input type="range" id="v-sfx" min="0" max="1" step="0.05"><output id="o-sfx" for="v-sfx"></output>
  </div>
  <div class="checks"><label><input type="checkbox" id="v-vib"> Vibration</label><label><input type="checkbox" id="v-fps"> Bildrate anzeigen</label></div>
</div>
<div id="fps" hidden></div>
<div class="panel" id="debug" hidden>
  <button class="btn ghost" id="dbgx" type="button" style="align-self:flex-end">✕ Schließen</button>
  <h1>Debug</h1>
  <p>Änderungen wirken sofort und bleiben in diesem Browser gespeichert.</p>
  <div class="tunes" id="tunes"></div>
  <div class="checks">
    <label><input type="checkbox" id="d-info"> Messwerte anzeigen</label>
    <label><input type="checkbox" id="d-hitbox"> Hitboxen zeigen</label>
    <label><input type="checkbox" id="d-god"> Unverwundbar</label>
    <label><input type="checkbox" id="d-nolock"> Käfig immer offen</label>
    <label><input type="checkbox" id="d-fx"> Licht-Effekte (WebGL)</label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="a-double"> Doppelsprung</label>
    <label><input type="checkbox" id="a-wall"> Wandsprung</label>
    <label><input type="checkbox" id="a-dash"> Dash</label>
    <label><input type="checkbox" id="a-glide"> Gleiten</label>
  </div>
  <div class="row">
    <button class="btn ghost" id="dbgreset" type="button">Werte zurücksetzen</button>
    <button class="btn ghost" id="dbgcopy" type="button">Werte kopieren</button>
    <button class="btn" id="dbgclose" type="button">Weiter</button>
  </div>
  <textarea id="dbgout" hidden readonly aria-label="Aktuelle Werte"></textarea>
</div>
<div id="dbginfo" hidden></div>

<div class="panel" id="rotate">
  <div class="phone"></div>
  <p>Bitte dreh dein Handy ins Querformat.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
const bgCanvas=document.createElement('canvas'), bgCtx=bgCanvas.getContext('2d');
const TS=16, SKY_H=270; let VIEW_H=120; // VIEW_H: sichtbare Welthöhe (kleiner = näher dran)
const C={ember:'#f2a65a',cream:'#f6ead2',ink:'#0d1524',gold:'#ffd166',sky:'#7fe0ff',
  grassD:'#457a3a',earthD:'#523726',stoneD:'#5b6372',stoneL:'#98a1b0',water:'#3f7fb0',waterL:'#7fb8dc',waterD:'#2e5f88',
  pine:'#2f5e3f',pineD:'#234a31',leaf:'#4f8a43',bark:'#5a3b26',beetle:'#d84a4a',crumble:'#c69a6a'};

// ---------- Speicherstand ----------
const SAVE_KEY='supersam-labor-v2';
const blankSave=()=>({ab:{double:false,wall:false,dash:false,glide:false},crystals:{},stars:{},bosses:{},done:{},best:{},wallet:0,endingSeen:false,tutorialDone:false,lives:3});
let save=blankSave();
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s){ save=Object.assign(blankSave(),s); save.ab=Object.assign(blankSave().ab,s.ab||{}); } }catch(_){}

function spr(rows,pal){ const h=rows.length,w=rows[0].length,c=mk(w,h),g=c.getContext('2d');
  rows.forEach((row,y)=>{ if(row.length!==w) console.warn('Sprite-Zeile falsch',y,row);
    for(let x=0;x<row.length;x++){ const col=pal[row[x]]; if(col){g.fillStyle=col;g.fillRect(x,y,1,1);} } }); return c; }
function flipX(src){ const c=mk(src.width,src.height),g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }

const OUTFIT_PAL={u:'#bfe8ff',W:'#eaf8ff',n:'#e03c3c',g:'#8a5a3a',v:'#3a3a5a',V:'#24243a',L:'#ffe14d',c:'#4f9a4a',C:'#2f6e3a',l:'#7cd36a'};
const OUTFIT_NAME={double:'Flügelschuhe',wall:'Stirnband und Kletterhandschuh',dash:'Blitz-Shirt',glide:'Blätter-Umhang'};
function dress(rows,ab){
  const R=rows.map(r=>r.split('')), at=(y,x)=>R[y]&&R[y][x], put=(y,x,c,only)=>{ if(R[y]&&x>=0&&x<16&&(!only||only.includes(R[y][x]))) R[y][x]=c; };
  if(ab.double){ for(let y=12;y<16;y++){ for(let x=0;x<16;x++) if(R[y][x]==='f') R[y][x]='u';
      for(let x=1;x<16;x++) if(R[y][x]==='k'&&R[y][x+1]==='u'&&R[y][x-1]==='.'){ put(y,x-1,'W'); put(y-1,x-1,'W','.'); } } }
  if(ab.wall){ for(let x=3;x<12;x++) put(3,x,'n','yYh'); for(let y=9;y<12;y++) for(let x=0;x<16;x++) if(R[y][x]==='s') R[y][x]='g'; }
  if(ab.dash){ for(let y=9;y<12;y++) for(let x=0;x<16;x++){ if(R[y][x]==='r') R[y][x]='v'; else if(R[y][x]==='R') R[y][x]='V'; }
    put(9,7,'L','vV'); put(10,6,'L','vV'); put(10,7,'L','vV'); put(11,6,'L','vV'); }
  if(ab.glide){ for(let y=9;y<13;y++){ const k=R[y].indexOf('k'); if(k>0){ put(y,k-1,'c','.'); if(y>=11) put(y,k-2,'C','.'); } }
    put(0,6,'l'); put(0,7,'l'); }
  return R.map(r=>r.join(''));
}
const heroCache={};
function HF(extra){
  const ab={...save.ab}; if(extra) ab[extra]=true;
  const key=['double','wall','dash','glide'].map(a=>ab[a]?1:0).join('');
  if(!heroCache[key]){ const pal={...HERO_PAL,...OUTFIT_PAL}, fr={};
    for(const [n,rows] of Object.entries(HERO_ROWS)) fr[n]=pair(spr(dress(rows,ab),pal));
    heroCache[key]=fr; }
  return heroCache[key];
}

function dirt(px,r,p=PAL.meadow.dirt){
  px(0,0,p.base,16,16);
  for(let i=0;i<14;i++) px(Math.floor(r()*15),Math.floor(r()*16),p.dk,2,1);
  for(let i=0;i<4;i++){ const x=Math.floor(r()*14),y=Math.floor(r()*14); px(x,y,p.lt,2,1); px(x,y+1,p.sh,2,1); }
}
function topLayer(px,r,cols){

  for(let i=0;i<3;i++) px(Math.floor(r()*15),1+Math.floor(r()*2),cols[0],2,1);
}

  return {name:D.name,style:D.style,scene:D.scene,w:D.w,h:D.h,top:D.top,need:D.need||0,timeLimit:D.timeLimit||0,sky:D.sky,noReturn:D.noReturn,noDeco:!!D.noDeco,build(b){

    (D.back||[]).forEach((row,r)=>{ for(let c=0;c<row.length;c++) if(row[c]==='1') b.back(c,r,c,r); });
    (D.up||[]).forEach((row,r)=>{ for(let c=0;c<row.length;c++) if(row[c]==='1') b.updraft(c,c,r,r); });
    for(const o of D.objs){ switch(o.k){
      case 'start': b.start(o.c,o.r); break; case 'goal': b.goal(o.c,o.r); break;
      case 'coin': b.coin(o.c,o.r); break; case 'crystal': b.crystal(o.c,o.r); break; case 'star': b.star(o.c,o.r); break;
      case 'enemy': b.enemy(o.c,o.r,o.t,o.range!=null?{range:o.range}:{}); break;

const TOGETHER_MS=120;

function recompute(){
  let l=false,r=false;
  for(const x of ptrs.values()){ if(x<innerWidth/2) l=true; else r=true; }
  const pL=L_, pR=R_;
  L_=l||keyL; R_=r||keyR;
  const now=performance.now();
  if(!pL&&!pR&&(L_||R_)){ firstAt=now; standAt=P.ground&&Math.abs(P.vx)<10; }
  const both=L_&&R_;
  if(both&&!wasBoth){
    const together = P.ground && ((!pL&&!pR&&Math.abs(P.vx)<10) || (now-firstAt<TOGETHER_MS&&standAt));
    if(together){ jumpSide=0; neutral=true; P.vx=0; }
    else { neutral=false; jumpSide = (pL&&!pR) ? 1 : (pR&&!pL) ? -1 : -P.face; }
    triggerJump();
  }
  if((jumpSide===-1&&!L_)||(jumpSide===1&&!R_)) jumpSide=0;
  wasBoth=both;

}

const TUT={on:false,i:0,ok:0,x0:0,y0:0,peak:0,air:false,endT:0};

function tutShow(){
  const st=TUT_STEPS[TUT.i]; tutEl.hidden=true; tutText.classList.remove('ok');   // Übungswiese erklärt sich selbst: keine Textleiste, nur pulsierende Hälften
  tutStep.textContent=st.end?'GESCHAFFT':`SCHRITT ${TUT.i+1} VON ${TUT_STEPS.length-1}`; tutText.textContent=st.t;

function tickTutorial(dt){
  if(!TUT.on||state!=='play') return;
  if(L.id!=='uebung'){ tutEnd(); return; }
  const st=TUT_STEPS[TUT.i];
  if(TUT.ok>0){ TUT.ok-=dt; if(TUT.ok<=0){ TUT.i++; tutShow(); } return; }
  if(st.end) return;
  const c=(P.x+P.w/2)/TS, feet=P.y+P.h;
  switch(TUT.i){
    case 0: if(c>13) tutNext(); break;
    case 1: TUT.x0=Math.max(TUT.x0,P.x); if(TUT.x0-P.x>TS*2.5) tutNext(); break;
    case 2: if(c>29&&P.ground) tutNext(); break;
    case 3: if(c>41&&P.ground) tutNext(); break;
    case 4: if(c>51&&P.ground) tutNext(); break;
    case 5: if(c>64.5&&P.ground&&feet<=14*TS+1) tutNext(); break;
    case 6: if(c>90&&P.ground) tutNext(); break;
    case 7: if(c>121&&P.ground&&feet<=17*TS+1) tutNext(); break;
    case 8: if(c>138.5&&P.ground&&feet<=14*TS+1) tutNext(); break;
    case 9: if(c>180&&P.ground) tutNext(); break;
    case 10: if(c>215&&P.ground&&feet<=17*TS+1) tutNext(); break;
    case 11: if(c>226.5&&P.ground&&feet<=10*TS+1) tutNext(); break;
    case 12: if(c>246&&P.ground) tutNext(); break;
    case 13: if(c>263&&P.ground&&feet<=17*TS+1) tutNext(); break;
  }
}

const msgEl=document.getElementById('msg'); let msgTimer=0;
function showMsg(t){ msgEl.textContent=t; msgEl.classList.add('show'); clearTimeout(msgTimer); msgTimer=setTimeout(()=>msgEl.classList.remove('show'),1100); }

// ---------- Physik ----------
function wallContact(){
  const r0=Math.floor((P.y+2)/TS), r1=Math.floor((P.y+P.h-2)/TS);
  const cl=Math.floor((P.x-1)/TS), cr=Math.floor((P.x+P.w+.5)/TS);
  for(let r=r0;r<=r1;r++){ if(solid(cr,r)&&!inner(cr,r)) return 1; if(solid(cl,r)&&!inner(cl,r)) return -1; }
  return 0;
}
function inUpdraft(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(L.up[r]?.[c]) return true;
  return false;
}
function breakCrack(c,r){
  const st=[[c,r]];
  while(st.length){ const [x,y]=st.pop(); if(tileAt(x,y)!=='X') continue; L.grid[y][x]=' ';
    for(let i=0;i<4;i++) particles.push({x:x*TS+Math.random()*16,y:y*TS+Math.random()*16,vx:(Math.random()-.5)*120,vy:-Math.random()*120,t:.6,col:'#b3a8c2'});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  shake=.15; addFlow(6); sfx('smash');
}
function moveX(dt){
  P.x+=P.vx*dt;
  const side=Math.sign(P.vx); if(!side) return;
  const r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  const c=side>0?Math.floor((P.x+P.w)/TS):Math.floor(P.x/TS);
  if(P.dashT>0) for(let r=r0;r<=r1;r++) if(tileAt(c,r)==='X') breakCrack(c,r);
  let hit=false, step=null;
  for(let r=r0;r<=r1;r++) if(solid(c,r)){
    if(r===r1&&inner(c,r)) continue;                      // Erde unter Hängen bremst nicht
    if(r===r1&&(P.ground||P.slope)&&P.y+P.h-r*TS<=8&&!solid(c,r-1)){ step=r*TS; continue; } // kleine Kante hochsteigen
    hit=true; }
  if(!hit&&step!==null) P.y=step-P.h;
  if(hit){
    if(Math.abs(P.vx)>70&&P.dashT<=0&&!(save.ab.wall&&!P.ground)) addFlow(-12);
    P.x=side>0?c*TS-P.w:(c+1)*TS; P.vx=0; P.dashT=0;
  }
}
function land(){ if(P.vy>200){P.squash=1;dust(4);sfx('land');} else if(P.vy>110){ P.squash=.5; dust(2); } P.vy=0; P.ground=true; }
function moveY(dt){
  const wasGround=P.ground, prevBottom=P.y+P.h; P.ground=false;
  P.y+=P.vy*dt;
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS);
  if(P.vy>0){ const r=Math.floor((P.y+P.h)/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)&&!inner(c,r)){
      P.y=r*TS-P.h; if(wasGround) P.vy=0; else land(); P.ground=true; break; }
    if(!P.ground&&prevBottom<=r*TS+.5) for(let c=c0;c<=c1;c++) if(ledge(c,r)){ P.y=r*TS-P.h; if(wasGround) P.vy=0; else land(); P.ground=true; break; } }
  else if(P.vy<0){ const r=Math.floor(P.y/TS); for(let c=c0;c<=c1;c++) if(solid(c,r)){P.y=(r+1)*TS;P.vy=0;break;} }
  // Schrägen: auf die Oberfläche unter der Fußmitte setzen; bergab angeklebt bleiben
  P.slope=false;
  if(P.vy>=0){ const foot=P.y+P.h, sy=slopeSurface(P.x+P.w/2,foot-1);
    if(sy!==null){
      if(foot>sy){ P.y=sy-P.h; if(!wasGround&&!P.ground) land(); else P.vy=0; P.ground=true; P.slope=true; }
      else if(!P.ground&&wasGround&&sy-foot<=8){ P.y=sy-P.h; P.vy=0; P.ground=true; P.slope=true; } } }
  P.plat=null;
  if(P.vy>=0) for(const m of L.movers){
    if(P.x+P.w>m.x+1 && P.x<m.x+m.w-1 && prevBottom<=m.y+2+Math.max(0,-m.dy) && P.y+P.h>=m.y){
      P.y=m.y-P.h; if(!wasGround) land(); else P.vy=0; P.ground=true; P.plat=m; break; }
  }
}
function dust(n){ for(let i=0;i<n;i++) particles.push({x:P.x+P.w/2,y:P.y+P.h,vx:(Math.random()-.5)*60,vy:-Math.random()*40,t:.35,col:C.cream}); }
function burst(x,y,col,n=8,sp=70){ for(let i=0;i<n;i++){const a=i/n*Math.PI*2; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:.4,col});} }
function doJump(v){ P.vy=v; P.buffer=0; P.coyote=0; P.ground=false; P.plat=null; P.squash=-1; P.hold=0; P.rising=true; P.cut=false; dust(5); }
function hazard(){
  const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=tileAt(c,r);
    if(t==='^'){ const x=c*TS+3,y=r*TS+8; if(P.x+P.w>x&&P.x<x+10&&P.y+P.h>y&&P.y<y+8) return 'spike'; }
    if(t==='~'){ const top=tileAt(c,r-1)==='~'?r*TS:r*TS+6; if(P.y+P.h>top+4) return 'water'; }
  }
  return null;
}

function update(dt){
  if(state!=='play') return;
  time+=dt;
  if(P.inv>0) P.inv=Math.max(0,P.inv-dt);
  if(L.timeLimit){ const tl=Math.ceil(timeLeft()); if(tl<=10&&tl>0&&tl!==lastTick){ lastTick=tl; sfx('tick'); } }
  if(livesCheck()){ loseLife(); return; }
  for(const m of L.movers){ const s=(1-Math.cos(clock/m.period*Math.PI*2))/2;
    const nx=m.x0+(m.x1-m.x0)*s, ny=m.y0+(m.y1-m.y0)*s; m.dx=nx-m.x; m.dy=ny-m.y; m.x=nx; m.y=ny; }
  if(P.plat){ P.x+=P.plat.dx; P.y+=P.plat.dy; }
  P.wallDir=(!P.ground&&save.ab.wall)?wallContact():0;

  // Richtung: nur der Laufdaumen lenkt
  let dir;
  if(jumpSide){ const runHeld=jumpSide===-1?R_:L_; if(!runHeld&&P.ground&&P.buffer<=0) jumpSide=0; dir=runHeld?-jumpSide:0; }
  if(!jumpSide) dir=(L_&&!R_)?-1:(R_&&!L_)?1:0;
  if(P.kickT>0){ P.kickT-=dt; dir=0; }

  const updraft=save.ab.glide&&!P.ground&&inUpdraft();
  const held=jumpSide!==0||(neutral&&(L_||R_))||keyJump;
  let maxS=PH.max+tier()*PH.tierBonus;
  if(updraft&&held) maxS=Math.min(maxS,PH.upSpeed);

  if(P.dashT>0){
    P.dashT-=dt; P.vx=P.dashDir*PH.dashSpeed; P.vy=0;
    if(P.dashT<=0) P.vx=P.dashDir*maxS;
  } else {
    const acc=P.ground?PH.accG:PH.accA, fr=P.ground?PH.fricG:PH.fricA;
    const before=Math.abs(P.vx);
    if(dir){ P.vx+=dir*acc*dt; P.face=dir; }
    else if(P.kickT<=0){ const s=Math.sign(P.vx); P.vx-=s*fr*dt; if(Math.sign(P.vx)!==s) P.vx=0; }
    if(Math.abs(P.vx)>maxS&&P.kickT<=0) P.vx=Math.sign(P.vx)*Math.max(maxS,Math.min(Math.abs(P.vx),before-350*dt));
  }
  P.dashCD-=dt;

  // Sprünge: Boden, Wand, Luft
  P.coyote=P.ground?PH.coyote:P.coyote-dt;
  P.buffer-=dt;
  if(P.buffer>0&&P.dashT<=0){
    if(P.coyote>0){ doJump(-PH.jump); sfx('jump'); }
    else if(P.wallDir){ doJump(-PH.kickY); sfx('kick'); P.vx=-P.wallDir*PH.kickX; P.face=-P.wallDir; P.kickT=PH.kickT; P.usedDouble=false; addFlow(5);
      for(let i=0;i<5;i++) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h/2,vx:-P.wallDir*Math.random()*60,vy:(Math.random()-.5)*60,t:.35,col:C.cream}); }
    else if(save.ab.double&&!P.usedDouble){ P.usedDouble=true; doJump(-PH.airJump); sfx('double'); addFlow(3); burst(P.x+P.w/2,P.y+P.h,C.sky,6,50); }
  }

  if(P.dashT<=0){
    let gMul=1;
    if(P.rising){
      if(P.vy>=0) P.rising=false;
      else if(P.cut) gMul=PH.cutGrav;
      else if(held&&P.hold<PH.holdMax){ P.hold+=dt; gMul=PH.holdGrav; }
      else if(!held&&P.hold<PH.holdMax){ P.cut=true; gMul=PH.cutGrav; }
    }
    P.vy=Math.min(PH.fall,P.vy+PH.grav*gMul*dt);
    if(P.wallDir&&dir===P.wallDir&&P.vy>PH.slide){ P.vy=PH.slide; if(Math.random()<.3) particles.push({x:P.wallDir>0?P.x+P.w:P.x,y:P.y+P.h,vx:0,vy:-10,t:.3,col:C.cream}); }
    P.glide=save.ab.glide&&!P.ground&&held&&!P.wallDir&&(P.vy>0||updraft);
    if(P.glide&&updraft) P.vy=Math.max(-PH.upMax,P.vy-PH.upLift*dt);
    else if(P.glide&&P.vy>PH.glideFall) P.vy=PH.glideFall;
  }
  moveX(dt); moveY(dt);
  if(P.ground||P.wallDir){ P.usedDouble=false; P.airDash=false; }
  if(neutral&&P.ground&&!P.rising&&P.buffer<=0) neutral=false;
  P.squash*=Math.pow(.001,dt);
  if(P.ground&&dir) P.run+=dt*Math.abs(P.vx)/10;
  if(P.ground){
    const turning=dir&&Math.sign(P.vx)===-dir&&Math.abs(P.vx)>25, braking=!dir&&Math.abs(P.vx)>30;
    if((turning||braking)&&Math.random()<.55) particles.push({x:P.x+P.w/2+Math.sign(P.vx)*4,y:P.y+P.h,vx:-P.vx*.25+(Math.random()-.5)*20,vy:-10-Math.random()*25,t:.3,col:C.cream});
    else if(Math.abs(P.vx)>=PH.max*.95&&Math.random()<.12) particles.push({x:P.x+P.w/2-Math.sign(P.vx)*5,y:P.y+P.h,vx:-P.vx*.15,vy:-8-Math.random()*12,t:.25,col:C.cream});
  }
  if(tier()===3||P.dashT>0) ribbon.push({x:P.x+P.w/2,y:P.y+P.h*.55,t:.28});

  // Schwung
  const sp=Math.abs(P.vx);
  if(P.dashT>0){}
  else if(sp>=PH.max*.85) addFlow((P.ground?13:8)*dt);
  else if(P.ground&&sp<25) addFlow(-40*dt);
  else addFlow(-5*dt);
  const Tn=tier(); if(Tn>lastTier) sfx('tier',Tn); lastTier=Tn;
  bestTier=Math.max(bestTier,Tn);
  trailT-=dt;
  if((tier()>=2||P.dashT>0)&&trailT<=0){ trail.push({x:P.x,y:P.y,face:P.face,t:.25}); trailT=.04; }
  for(const t of trail) t.t-=dt; trail=trail.filter(t=>t.t>0);
  if(tier()===3&&Math.random()<.3) particles.push({x:P.x+Math.random()*P.w,y:P.y+Math.random()*P.h,vx:-P.vx*.2,vy:-20,t:.4,col:C.gold});

  // Bröckelblöcke
  if(P.ground&&!P.plat){ const r=Math.floor((P.y+P.h+1)/TS);
    for(let c=Math.floor(P.x/TS);c<=Math.floor((P.x+P.w-.01)/TS);c++){ const k=c+','+r; if(tileAt(c,r)==='B'&&!L.crumbles.has(k)) L.crumbles.set(k,{t:.45,gone:false}); } }
  for(const [k,b] of L.crumbles){
    b.t-=dt; const [c,r]=k.split(',').map(Number);
    if(!b.gone&&b.t<=0){ L.grid[r][c]=' '; b.gone=true; b.t=3.5; sfx('crumble'); for(let i=0;i<5;i++) particles.push({x:c*TS+Math.random()*16,y:r*TS+8,vx:(Math.random()-.5)*30,vy:Math.random()*20,t:.6,col:C.crumble}); }
    else if(b.gone&&b.t<=0){ const over=P.x+P.w>c*TS&&P.x<c*TS+TS&&P.y+P.h>r*TS&&P.y<r*TS+TS; if(!over){ L.grid[r][c]='B'; L.crumbles.delete(k);} }
  }
  // Federn
  for(const s of L.springs){ s.t=Math.max(0,s.t-dt);
    if(P.vy>0&&P.x+P.w>s.x+2&&P.x<s.x+14&&P.y+P.h>=s.top&&P.y+P.h<=s.top+10){

  { const c0=Math.floor(P.x/TS), c1=Math.floor((P.x+P.w-.01)/TS), r0=Math.floor(P.y/TS), r1=Math.floor((P.y+P.h-.01)/TS);
    for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(tileAt(c,r)==='H'&&!L.reveal.has(c+','+r)) revealHidden(c,r); }
  for(const k of L.crystals) if(!k.got&&Math.abs(P.x+P.w/2-k.x)<11&&Math.abs(P.y+P.h/2-k.y)<13){ k.got=true; sfx('crystal'); addFlow(20); burst(k.x,k.y,C.sky,12,80); floaters.push({x:k.x,y:k.y-8,txt:'+'+PTS.crystal,t:1,col:'#7fe0ff'}); if(!k.known){ k.known=true; save.crystals[k.id]=true; persist(); showMsg('Diamant gefunden!'); } }

  if(P.y>L.h*TS+24){ die(); return; }

    }
    if(gateDoor>0) gateDoor=Math.min(1,gateDoor+dt*3);
    if(!near&&gateDoor>=1&&!cageOpen){ gateDoor=0; }      // weggegangen: beim nächsten Mal neu prüfen
    if(cageOpen) cageAnim=Math.min(1,cageAnim+dt*2.5);
    const touch=P.x+P.w>L.goal.x-2&&P.x<L.goal.x+18&&P.y+P.h>L.goal.bottom-34&&P.y<L.goal.bottom;
    if(gateDoor>=1&&!cageOpen){
      const inside=touch&&P.ground&&Math.abs(P.vx)<25;
      gateT=inside?gateT+dt:Math.max(0,gateT-dt*2);

  }
  for(const d of L.doors){
    const over=P.x+P.w>d.x+2&&P.x<d.x+14&&Math.abs(P.y+P.h-d.bottom)<20;

    if(d.t>=.7&&d.need&&crystalTotal()<d.need){ d.t=0; d.armed=false; sfx('locked'); showMsg(`Noch ${d.need-crystalTotal()} Diamanten nötig`); continue; }
    if(d.t>=.7&&BOSS_NEEDS_WORLD[d.world]&&!save.done[BOSS_NEEDS_WORLD[d.world]]){ const w=BOSS_NEEDS_WORLD[d.world]; d.t=0; d.armed=false; sfx('locked'); showMsg(`Erst Welt ${WNO(w)} · ${NAMES[w]} schaffen`); continue; }
    if(d.t>=.7&&NEED_FOR_DOOR[d.world]&&!save.ab[NEED_FOR_DOOR[d.world]]){ d.t=0; d.armed=false; sfx('locked'); showMsg(`Braucht ${AB_INFO[NEED_FOR_DOOR[d.world]].name}`); continue; }
    if(d.t>=.7){ clearInput(); sfx('door'); const n=d.world; if(n===0){ const w=L.id; if(w==='uebung'){ tutEnd(); loadLevel('hub'); showMsg('Willkommen in der Hubwelt!'); } else { loadLevel('hub',w); showMsg('Hubwelt'); } } else { loadLevel(n); showMsg(typeof n==='number'?`Welt ${WNO(n)} · ${NAMES[n]}`:`Endgegner: ${NAMES[n]}`); } return; }
  }

let ribbon=[], floaters=[];

// Vier Arenen, je eine pro Abschnitt der Hubwelt. Jeder Boss hat 3 Leben und ist nur mit der Fähigkeit seines Abschnitts zu besiegen.
const CROWN=spr([

  "kyk.kyyk.kyk",
  "kyykyyyykyyk",
  "kyyyywwyyyyk",
  "kyyrryyrryyk",
  "kyyyyyyyyyyk",
  "kYYYYYYYYYYk",
  "kkkkkkkkkkkk"],{k:'#8a4a00',y:'#ffd166',Y:'#e0a030',w:'#ffffff',r:'#d84a4a'});
const BOSS_INFO={

let bossFx=[];   // Felsbrocken, Eissplitter
function initBoss(id){

function hurtPlayer(){ if(P.inv>0||dbg.god) return false; die(); bossFx=[]; return true; }

function updateBoss(dt){
  const B=L.boss; if(!B) return false;
  const ar=DEFS[L.id].arena, fy=ar.floor*TS, left=ar.left*TS, right=ar.right*TS;
  B.t+=dt; B.inv=Math.max(0,B.inv-dt);
  // Siegerkrone

    if(overlapP(T.x-8,T.y-2,16,14)){ B.trophy=null; startBossWin(); return true; } return false; }
  if(B.state==='dying'){ B.deathT+=dt; if(Math.random()<.6) burst(B.x+Math.random()*B.w,B.y+Math.random()*B.h,BOSS_INFO[B.id].col,4,80); shake=Math.max(shake,.05);
    if(B.deathT>=1.8){ B.state='gone'; B.trophy={x:(ar.left+ar.right)/2*TS,y:fy-120,vy:0}; burst(B.x+B.w/2,B.y+B.h/2,'#ffffff',30,160); flash=.8; showMsg(BOSS_INFO[B.id].name+' besiegt!'); }
    return false; }
  if(B.state==='gone') return false;
  if(B.state==='intro'){ B.timer-=dt; if(B.timer<=0){ B.state=B.id==='b2'?'walk':(B.id==='b3'||B.id==='b0')?'fly':'walk'; B.timer=1.4; } }
  const pcx=P.x+P.w/2;

  if(B.id==='b1'){ // Igelkönig: läuft, rollt gegen die Wand, ist dann benommen

    else if(B.state==='curl'){ B.timer-=dt; if(B.timer<=0){ B.state='roll'; B.dir=Math.sign(pcx-(B.x+B.w/2))||B.dir; } }
    else if(B.state==='roll'){ B.x+=B.dir*(B.speed+(3-B.hp)*45)*dt;
      if(B.x<=left||B.x+B.w>=right){ B.x=Math.max(left,Math.min(right-B.w,B.x)); B.state='dizzy'; B.timer=2.2; shake=.25; sfx('smash'); burst(B.dir>0?right:left,fy-20,'#e8c8a0',12,90); } }
    else if(B.state==='dizzy'){ B.timer-=dt; if(B.timer<=0){ B.state='walk'; B.timer=1.2+Math.random(); } }
    B.x=Math.max(left,Math.min(right-B.w,B.x));
    if(overlapP(B.x+4,B.y+6,B.w-8,B.h-6)){
      if(B.state==='dizzy'&&P.dashT>0&&B.inv<=0){ hitBoss(B,false); if(!B.dead){ B.state='walk'; B.timer=1.5; B.x+=(B.x+B.w/2<pcx?-30:30); } }
      else if(B.inv<=0||B.state==='roll'){ if(hurtPlayer()) return true; }
    }
  }

  if(B.id==='b2'){ // Felsgolem: stampft, lässt Brocken regnen; Schwachstelle Kopf (nur von oben)
    if(B.state==='walk'){ B.dir=Math.sign(pcx-(B.x+B.w/2))||B.dir; B.x+=B.dir*(20+(3-B.hp)*8)*dt; B.timer-=dt; if(B.timer<=0){ B.state='wind'; B.timer=.7; } }
    else if(B.state==='wind'){ B.timer-=dt; B.lift=Math.min(10,B.lift+dt*20); if(B.timer<=0){ B.state='slam'; B.timer=.8; B.lift=0; shake=.35; sfx('smash');
      const n=3+(3-B.hp); for(let i=0;i<n;i++){ const x=i===0?pcx:left+TS+Math.random()*(right-left-TS*2); bossFx.push({k:'rock',x,y:(ar.ceil+1)*TS,vy:0,warn:.7+i*.12}); } } }
    else if(B.state==='slam'){ B.timer-=dt; if(B.timer<=0){ B.state='walk'; B.timer=2+Math.random(); } }
    B.x=Math.max(left,Math.min(right-B.w,B.x));
    const head={x:B.x+8,y:B.y-B.lift,w:B.w-16,h:16};
    if(P.vy>0&&P.y+P.h<=head.y+12&&P.y+P.h>=head.y-6&&P.x+P.w>head.x&&P.x<head.x+head.w&&B.inv<=0){ hitBoss(B,true); }
    else if(overlapP(B.x+6,B.y+10-B.lift,B.w-12,B.h-10)&&B.inv<=0){ if(hurtPlayer()) return true; }
    else if(overlapP(B.x+6,B.y+10,B.w-12,B.h-10)){ P.x=pcx<B.x+B.w/2?B.x+6-P.w:B.x+B.w-6; P.vx=0; } // nach Treffer: kurz wie eine Wand
  }

  if(B.id==='b0'){ // Wespenkönigin: schwebt zu hoch für einen einfachen Sprung, stürzt sich mit dem Stachel herab
    if(B.state==='fly'){ B.phase+=dt*.45*B.speedK; const nx=B.cx+Math.sin(B.phase)*B.range; B.dir=nx>B.x+B.w/2?1:-1; B.x=nx-B.w/2; B.y=B.hy+Math.sin(B.t*3)*5;
      B.drop-=dt; if(B.drop<=0){ B.drop=Math.max(1.6,2.8-(3-B.hp)*.4); bossFx.push({k:'sting',x:B.x+B.w/2,y:B.y+B.h,vy:80}); sfx('tick'); }
      B.diveT-=dt; if(B.diveT<=0){ B.state='aim'; B.timer=1; sfx('locked'); } }
    else if(B.state==='aim'){ B.timer-=dt; B.x+=Math.sin(B.t*60)*1.2; if(B.timer<=0){ B.state='dive'; B.tx=Math.max(left,Math.min(right-B.w,pcx-B.w/2)); } }
    else if(B.state==='dive'){ B.y=Math.min(fy-B.h,B.y+300*dt); B.x+=(B.tx-B.x)*Math.min(1,dt*4); if(B.y>=fy-B.h){ B.state='rise'; shake=.2; sfx('smash'); burst(B.x+B.w/2,fy-2,'#ffd166',10,80); } }
    else if(B.state==='rise'){ B.y=Math.max(B.hy,B.y-110*dt); if(B.y<=B.hy){ B.state='fly'; B.diveT=4+Math.random()*1.5-(3-B.hp)*.4; B.cx=Math.max(left+B.range,Math.min(right-B.range,B.x+B.w/2)); B.phase=0; } }

      if(!B.dead){ B.speedK+=.15; B.state='rise'; B.y=Math.max(B.hy,B.y); } }
    else if(overlapP(B.x+8,B.y+10,B.w-16,B.h-12)&&B.inv<=0){ if(hurtPlayer()) return true; }
  }

  if(B.id==='b3'){ // Sturmgeist: schwebt hoch, wirft Eissplitter; nur von oben verwundbar

      B.drop-=dt; if(B.drop<=0){ B.drop=Math.max(.6,1.5-(3-B.hp)*.35); bossFx.push({k:'shard',x:B.x+B.w/2,y:B.y+B.h,vy:60}); sfx('tick'); } }
    if(P.vy>0&&P.y+P.h<=B.y+14&&P.y+P.h>=B.y-8&&P.x+P.w>B.x+4&&P.x<B.x+B.w-4&&B.inv<=0){ hitBoss(B,true);
      if(!B.dead){ B.cx=B.cx<(left+right)/2?right-B.range-TS*3:left+B.range+TS*3; B.cx=Math.max(left+B.range,Math.min(right-B.range,B.cx)); B.speedK+=.35; } }
    else if(overlapP(B.x+6,B.y+10,B.w-12,B.h-12)&&B.inv<=0){ if(hurtPlayer()) return true; }
  }

  // Brocken und Splitter
  for(const f of bossFx){

  }
  bossFx=bossFx.filter(f=>!f.done);
  return false;
}

  }

function updateEnemies(dt){

    if(!e.alive){ e.squish=Math.max(0,e.squish-dt); continue; }
    e.t+=dt; const dx=pcx-(e.x+e.w/2), dy=pcy-(e.y+e.h/2);
    switch(e.type){

      case 'igel': walkStep(e,22,dt); break;
      case 'wespe': { const nx=e.spawn.x+Math.sin(e.t*.9)*e.range*TS; e.dir=nx>e.x?1:-1; e.x=nx; e.y=e.spawn.y+Math.sin(e.t*3)*5; break; }
      case 'skorpion':

        else if(e.state==='charge'){ e.timer-=dt; if(walkStep(e,95,dt)||e.timer<=0){ e.state='rest'; e.timer=1; } }
        else if(e.state==='rest'){ e.timer-=dt; if(e.timer<=0) e.state='idle'; }
        else { walkStep(e,18,dt); if(Math.abs(dx)<TS*5&&Math.abs(dy)<TS*1.5){ e.dir=Math.sign(dx)||e.dir; e.state='wind'; e.timer=.45; } }

        e.vy+=900*dt; e.y+=e.vy*dt; e.x+=e.vx*dt;
        const fc=Math.floor((e.vx>0?e.x+e.w:e.x)/TS), er=Math.floor((e.y+e.h-1)/TS); if(e.vx&&solid(fc,er)){ e.x-=e.vx*dt; e.vx=0; }
        const c0=Math.floor((e.x+1)/TS), c1=Math.floor((e.x+e.w-1)/TS), rb=Math.floor((e.y+e.h)/TS);
        e.ground=false; if(e.vy>=0) for(let c=c0;c<=c1;c++) if(solid(c,rb)||(ledge(c,rb)&&e.y+e.h-e.vy*dt<=rb*TS+1)){ e.y=rb*TS-e.h; e.vy=0; e.vx=0; e.ground=true; break; }
        if(e.ground){ e.timer-=dt; if(e.timer<=0){

          const lc=Math.floor((e.x+e.w/2+d*TS*2.2)/TS); if(!floorAt(lc,rb)) d=-d;   // nicht in Abgründe hüpfen
          e.dir=d; e.vx=d*55; e.vy=-270; e.timer=1.3+Math.random()*.6; } }
        if(e.y>L.h*TS+40) e.alive=false;
        break; }

        break;
      case 'geist': {
        const near=Math.hypot(dx,dy)<TS*7, tx=near?dx:e.spawn.x-e.x, ty=near?dy:e.spawn.y-e.y, d=Math.hypot(tx,ty)||1, sp=near?24:14;

    }
    const T=ETYPE[e.type];
    if(e.type==='fisch'&&(e.state!=='leap'||e.y>e.spawn.y-10)) continue;
    const by=e.y+e.bob;

const mod=(v,n)=>((v%n)+n)%n;
function hash(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
const stars=Array.from({length:90},(_,i)=>({x:hash(i*1.3),y:hash(i*2.9)*.62,s:i%4===0?2:1}));

function styleAt(c,lv=L){ if(!lv.zones) return lv.style; for(const z of lv.zones) if(c<z.to) return z.s; return lv.zones[lv.zones.length-1].s; }
function themeBlend(){
  if(!L||state==='start') return {a:'meadow',b:'meadow',t:0};
  if(!L.zones){ const sc=levelDef(L.id).scene||L.style; return {a:sc,b:sc,t:0}; }
  const c=(camX+viewW/2)/TS, Z=L.zones, F=6;
  for(let i=0;i<Z.length;i++){
    if(c>=Z[i].to&&i<Z.length-1) continue;
    const prev=i?Z[i-1].to:-1e9;
    if(i<Z.length-1&&c>Z[i].to-F) return {a:Z[i].s,b:Z[i+1].s,t:(c-(Z[i].to-F))/(2*F)};
    if(i>0&&c<prev+F) return {a:Z[i-1].s,b:Z[i].s,t:(c-(prev-F))/(2*F)};
    return {a:Z[i].s,b:Z[i].s,t:0};
  }
  return {a:L.style,b:L.style,t:0};
}

// ---------- Parallax-Ebenen ----------
function parY(par){ if(!L||state==='start') return 0; return Math.max(-30,Math.min(70,((L.top+3)*TS-viewH-camY)*par*.45)); }
function ridge(color,base,amp1,amp2,f,par,step,peaks,sharp,flat){
  const oy=parY(par);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(0,SKY_H);
  for(let x=0;x<=skyW+step;x+=step){ const wx=x+camX*par;
    let y=base+oy-Math.sin(wx*f)*amp1-Math.sin(wx*f*2.7+1.3)*amp2;
    if(sharp) y-=Math.abs(Math.sin(wx*f*1.9+.7))*sharp;
    if(peaks) y-=Math.max(0,Math.sin(wx*f*.6+2))**6*peaks;
    if(flat) y=Math.round(y/flat)*flat;
    ctx.lineTo(x,Math.round(y)); }
  ctx.lineTo(skyW+step,SKY_H); ctx.closePath(); ctx.fill();
}
function layerItems(spacing,par,fn){ const off=camX*par, i0=Math.floor(off/spacing)-2, n=Math.ceil(skyW/spacing)+4;
  for(let i=i0;i<i0+n;i++) fn(Math.round(i*spacing-off+hash(i*3.1+spacing)*spacing*.5),hash(i+spacing*7),i); }
function ground(color,base,par){ const y=Math.round(base+parY(par)); ctx.fillStyle=color; ctx.fillRect(0,y,skyW,SKY_H-y+2); return y; }
function pines(color,light,base,spacing,hmin,hmax,par,snow){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const h=hmin+(hmax-hmin)*r;
    for(let k=0;k<3;k++){ const ty=y-k*h*.28, w=h*.32*(1-k*.22);
      ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x-w,ty+1); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x+w,ty+1); ctx.fill();
      if(light){ ctx.fillStyle=light; ctx.beginPath(); ctx.moveTo(x-w,ty+1); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x-w*.35,ty+1); ctx.fill(); }
      if(snow){ ctx.fillStyle='rgba(235,240,248,.85)'; ctx.beginPath(); ctx.moveTo(x-w*.5,ty-h*.22); ctx.lineTo(x,ty-h*.48); ctx.lineTo(x+w*.5,ty-h*.22); ctx.fill(); } }
    ctx.fillStyle=color; ctx.fillRect(x-1,y-2,2,3); });
}
function clumps(color,light,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const s=9+r*10;
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y-s*.6,s,0,7); ctx.arc(x-s*.8,y-s*.2,s*.7,0,7); ctx.arc(x+s*.9,y-s*.25,s*.75,0,7); ctx.fill();
    ctx.fillStyle=light; ctx.beginPath(); ctx.arc(x-s*.3,y-s*.95,s*.45,0,7); ctx.arc(x-s*1.05,y-s*.45,s*.3,0,7); ctx.fill(); });
}
function mesas(color,stripe,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const w=34+r*50, h=26+r*34;
    ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x-w/2-10,y+1); ctx.lineTo(x-w/2,y-h); ctx.lineTo(x+w/2,y-h); ctx.lineTo(x+w/2+12,y+1); ctx.fill();
    ctx.fillStyle=stripe; for(const f of [.3,.62]) ctx.fillRect(Math.round(x-w/2-10*f+1),Math.round(y-h*(1-f)),Math.round(w+20*f-2),2); });
}
function hoodoos(color,light,base,spacing,par){
  const y=ground(color,base,par);
  layerItems(spacing,par,(x,r)=>{ const w=8+r*8, h=24+r*40;
    ctx.fillStyle=color; ctx.fillRect(x-w/2,y-h,w,h+1); ctx.fillRect(x-w/2-3,y-h*.55,w+6,h*.55);
    ctx.fillRect(x-w/2-4,y-h-6,w+8,7);
    ctx.fillStyle=light; ctx.fillRect(x-w/2,y-h,2,h); ctx.fillRect(x-w/2-4,y-h-6,w+8,2); });
}
function cloud(x,y,w,light,shade){
  x=Math.round(x); y=Math.round(y); w=Math.round(w);
  ctx.fillStyle=shade; ctx.fillRect(x,y,w,6); ctx.fillRect(x+4,y+6,w-10,2);
  ctx.fillStyle=light; ctx.fillRect(x+3,y-5,w-8,6); ctx.fillRect(x+w*.25,y-10,w*.35,6); ctx.fillRect(x+w*.5,y-7,w*.3,4);
}
function clouds(n,light,shade,ymin,ymax,par,speed){
  for(let i=0;i<n;i++){ const W=skyW+140, a=hash(i*5.1+n), b=hash(i*7.7+n);
    cloud(mod(a*W+clock*speed*(.6+b*.6)-camX*par,W)-70, ymin+(ymax-ymin)*hash(i*3.3+n), 34+b*46, light, shade); }
}
function birds(n,color,ymin,ymax){
  ctx.fillStyle=color;
  for(let i=0;i<n;i++){ const W=skyW+60, x=Math.round(mod(hash(i*9.1)*W+clock*(14+hash(i)*10),W)-30), y=Math.round(ymin+(ymax-ymin)*hash(i*4.4)+Math.sin(clock*1.5+i)*3);
    const f=Math.sin(clock*9+i*2)>0?1:0; ctx.fillRect(x-3,y-f,3,1); ctx.fillRect(x+1,y-f,3,1); ctx.fillRect(x,y,1,1); }
}
function sunDisc(x,y,r,col,glow){
  ctx.fillStyle=glow; for(const k of [2.2,1.6]){ ctx.globalAlpha=.18; ctx.beginPath(); ctx.arc(x,y,r*k,0,7); ctx.fill(); }
  ctx.globalAlpha=1; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}
function fog(y,h,col,alpha){ const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,col); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=alpha; ctx.fillStyle=g; ctx.fillRect(0,y,skyW,h); ctx.globalAlpha=1; }

// ---------- Szenen ----------
function drawScene(style){
  const th=THEMES[style], [c0,c1,c2,c3]=th.r;
  const g=ctx.createLinearGradient(0,0,0,SKY_H); g.addColorStop(0,th.top); g.addColorStop(.55,th.mid); g.addColorStop(1,th.bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,skyW,SKY_H);
  if(style==='meadow'){
    sunDisc(skyW*.76,50,18,'#fff4b8','#fff4b8');
    clouds(7,'#ffffff','#d6e6f4',22,90,.1,5);
    ridge('#eef4fa',108,18,10,.007,.08,6,55); ridge(c0,118,18,10,.007,.08,6,55);
    fog(120,30,'#ffffff',.35);
    ridge(c1,146,16,8,.012,.22,5,0);
    clumps(c2,mix(c2,'#c8f0a0',.35),166,44,.4);
    ridge(c3,184,8,5,.02,.6,4,0);
    birds(4,'#2a3a4a',40,90);
  } else if(style==='forestDusk'){   // Abendwald (1-2 Wipfelwald)
    sunDisc(skyW*.72,112,24,'#ffe48a','#ffd76a');
    ridge(c0,112,18,10,.007,.07,6,50);
    fog(118,36,'#f7e6a8',.45);
    pines(c1,null,146,15,16,30,.2);
    // Lichtstrahlen
    ctx.fillStyle='#fff0b0';
    for(let i=0;i<4;i++){ const x=mod(i*skyW/3.2-camX*.25+skyW*.2,skyW+120)-60; ctx.globalAlpha=.08+.04*Math.sin(clock*.6+i);
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+26,0); ctx.lineTo(x+90,SKY_H); ctx.lineTo(x+40,SKY_H); ctx.fill(); }
    ctx.globalAlpha=1;
    pines(c2,mix(c2,'#9cd070',.25),162,19,22,44,.36);
    fog(160,26,'#e8f0c0',.3);
    pines(c3,mix(c3,'#4f8a3c',.35),184,28,40,70,.56);
    for(let i=0;i<28;i++){ const x=Math.round(mod(hash(i*2.1)*skyW-camX*.45+Math.sin(clock*.7+i)*12,skyW)), y=Math.round(110+hash(i*6.3)*120+Math.sin(clock*1.1+i*2)*6);
      const a=Math.max(0,Math.sin(clock*2+i*3)); if(a<.05) continue; ctx.globalAlpha=a*.35; ctx.fillStyle='#e8ff8a'; ctx.fillRect(x-1,y-1,4,4); ctx.globalAlpha=a; ctx.fillRect(x,y,2,2); }
    ctx.globalAlpha=1;
  } else if(style==='forest'){
    sunDisc(skyW*.74,46,20,'#fff6c8','#fff6c8');
    clouds(6,'#ffffff','#d8eaf4',20,84,.1,7);
    ridge(c0,112,18,10,.007,.07,6,50);
    fog(118,36,'#f2fae8',.4);
    pines(c1,null,146,15,16,30,.2);
    // Lichtstrahlen
    ctx.fillStyle='#fffbe0';
    for(let i=0;i<4;i++){ const x=mod(i*skyW/3.2-camX*.25+skyW*.2,skyW+120)-60; ctx.globalAlpha=.05+.03*Math.sin(clock*.6+i);
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+26,0); ctx.lineTo(x+90,SKY_H); ctx.lineTo(x+40,SKY_H); ctx.fill(); }
    ctx.globalAlpha=1;
    pines(c2,mix(c2,'#9cd070',.25),162,19,22,44,.36);
    fog(160,26,'#f0f8e4',.25);
    pines(c3,mix(c3,'#4f8a3c',.35),184,28,40,70,.56);
    for(let i=0;i<28;i++){ const x=Math.round(mod(hash(i*2.1)*skyW-camX*.45+Math.sin(clock*.7+i)*12,skyW)), y=Math.round(110+hash(i*6.3)*120+Math.sin(clock*1.1+i*2)*6);
      const a=Math.max(0,Math.sin(clock*2+i*3))*.6; if(a<.05) continue; ctx.globalAlpha=a*.3; ctx.fillStyle='#ffffff'; ctx.fillRect(x-1,y-1,4,4); ctx.globalAlpha=a; ctx.fillRect(x,y,2,2); }   // Pollen im Sonnenlicht
    ctx.globalAlpha=1;
  } else if(style==='stone'){
    sunDisc(skyW*.66,150,38,'#ffd27a','#ffb060');
    clouds(4,'#ffc8a0','#d98070',30,80,.08,3);
    mesas(c0,mix(c0,'#5a2a1e',.35),126,96,.08);
    ridge(c1,150,10,6,.01,.22,5,0,18);
    hoodoos(c2,mix(c2,'#f0a070',.35),166,52,.38);
    ridge(c3,186,6,4,.03,.6,4,0,8);
    for(let i=0;i<24;i++){ const x=Math.round(mod(hash(i*4.7)*skyW+clock*(10+hash(i)*12)-camX*.5,skyW)), y=Math.round(mod(hash(i*8.3)*SKY_H-clock*3,SKY_H));
      ctx.globalAlpha=.35; ctx.fillStyle='#ffd9a0'; ctx.fillRect(x,y,1,1); }
    ctx.globalAlpha=1;
    birds(2,'#3a1a20',50,80);
  } else if(style==='lake'){
    const sx=skyW*.3;
    sunDisc(sx,64,20,'#fffbe0','#fff3c0');
    clouds(6,'#ffffff','#d8ecf2',24,80,.1,4);
    ridge('#f2f8fc',108,18,10,.007,.07,6,55); ridge(c0,118,18,10,.007,.07,6,55);
    // See mit Spiegelung
    const wy=Math.round(150+parY(.28));
    ctx.fillStyle=mix(th.mid,c1,.45); ctx.fillRect(0,wy,skyW,SKY_H-wy);
    ctx.save(); ctx.beginPath(); ctx.rect(0,wy,skyW,SKY_H-wy); ctx.clip(); ctx.translate(0,2*wy); ctx.scale(1,-1);
    ctx.globalAlpha=.3; ridge(c0,118,18,10,.007,.07,6,55); ctx.globalAlpha=1; ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.3)'; layerItems(16,.28,(x,r)=>{ ctx.fillRect(x,wy+4+Math.round(r*30),5+Math.round(r*9),1); });
    ctx.fillStyle='rgba(255,250,220,.7)'; for(let k=0;k<7;k++){ const w=10-k; ctx.fillRect(Math.round(sx-w/2+Math.sin(clock*2+k)*2),wy+3+k*4,w,1); }
    ridge(c2,170,6,3,.02,.42,4,0);
    // Schilf im Vordergrund
    const ry=ground(c3,186,.56);
    layerItems(9,.56,(x,r,i)=>{ const h=8+r*14, sw=Math.round(Math.sin(clock*1.3+i)*1.5); ctx.fillStyle=c3; ctx.fillRect(x+sw,ry-h,1,h); if(r>.6) ctx.fillRect(x+sw-1,ry-h-4,2,4); });
    fog(140,24,'#ffffff',.35);
    birds(5,'#2a4050',36,80);
  } else {
    // Gipfel: Nacht, Nordlicht, Schnee
    for(const s of stars){ ctx.globalAlpha=.4+.6*Math.abs(Math.sin(clock*1.5+s.x*50)); ctx.fillStyle='#f6ead2'; ctx.fillRect(Math.round(s.x*skyW),Math.round(s.y*SKY_H),s.s,s.s); }
    ctx.globalAlpha=1;
    for(const [col,yb,ph] of [['#5affb0',46,0],['#b07aff',62,2]]){
      for(let x=0;x<skyW;x+=3){ const y=yb+Math.sin(x*.012+clock*.35+ph)*12+Math.sin(x*.031+clock*.6)*6, a=.12+.1*Math.sin(x*.02+clock+ph);
        const gr=ctx.createLinearGradient(0,y,0,y+38); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)');
        ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=gr; ctx.fillRect(x,y,3,38); } }
    ctx.globalAlpha=1;
    sunDisc(skyW*.22,56,13,'#efe9d4','#c8d0ff');
    ridge('#e3eaf3',104,16,9,.007,.07,6,62); ridge(c0,116,16,9,.007,.07,6,62);
    ridge('#c9d4e8',140,12,8,.012,.2,5,0); ridge(c1,150,12,8,.012,.2,5,0);
    pines(c2,null,166,22,20,38,.36,true);
    ridge(mix('#dfe6f2',c3,.55),186,8,5,.022,.56,4,0);
    snowFlakes(40,.5,1);
  }
}
function snowFlakes(n,alpha,size){
  ctx.fillStyle='#ffffff';
  for(let i=0;i<n;i++){ const b=hash(i*3.7+n);
    const x=Math.round(mod(hash(i*1.9+n)*skyW+clock*(6+b*10)+Math.sin(clock+i)*6-camX*(.3+b*.5),skyW)), y=Math.round(mod(hash(i*5.3+n)*SKY_H+clock*(14+b*22),SKY_H));
    ctx.globalAlpha=alpha*(.5+b*.5); ctx.fillRect(x,y,size+(b>.7?1:0),size+(b>.7?1:0)); }
  ctx.globalAlpha=1;
}

  const c0=Math.floor((P.x+P.w/2)/TS), base=CAM.base, r0=Math.floor(base/TS);

    const k={up:0,down:0,any:false,lvl:false};
    for(let r=Math.max(1,r0-14);r<=Math.min(L.h-1,r0+10);r++){

// Ziel nur übernehmen, wenn es deutlich anders ist und eine Weile so bleibt (Hysterese gegen Hin-und-her)

function longPress(el,ms,onLong,onShort){
  let downAt=0, upAt=0;
  const finish=cancelled=>{ if(!downAt) return; const held=performance.now()-downAt>=ms; downAt=0; upAt=performance.now();
    if(held) onLong(); else if(!cancelled) onShort(); };
  el.addEventListener('pointerdown',e=>{ e.stopPropagation(); downAt=performance.now(); });
  el.addEventListener('pointerup',()=>finish(false));
  el.addEventListener('pointercancel',()=>finish(true));
  el.addEventListener('click',()=>{ if(performance.now()-upAt<800) return; onShort(); }); // Tastatur
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

// ---------- WebGL-Effektschicht ----------
// Das Spiel zeichnet weiter mit Canvas 2D. Dieses fertige Bild wird hier als Textur durch Shader geschickt:
// Licht und Schatten, Glühen, Überstrahlen (Bloom), Farbstimmung, Dunst und Vignette.
// Ohne WebGL (oder wenn abgeschaltet) bleibt einfach das 2D-Bild sichtbar.
const FXT={
  meadow:{amb:1,   grade:[1,1,.97],    ga:.08,fog:[1,1,1],      fa:.05,vig:.28,bloom:.3},
  forest:{amb:1,   grade:[1.01,1.02,.97],ga:.1,fog:[.95,1,.96],  fa:.06,vig:.26,bloom:.3},
  forestDusk:{amb:.8,grade:[1.06,1,.84], ga:.22,fog:[.95,.9,.65], fa:.1, vig:.38,bloom:.4},
  stone: {amb:.92, grade:[1.1,.93,.8], ga:.25,fog:[1,.8,.6],    fa:.08,vig:.35,bloom:.35},
  lake:  {amb:1,   grade:[.95,1,1.06], ga:.15,fog:[.9,.96,1],   fa:.1, vig:.3, bloom:.35},
  snow:  {amb:.55, grade:[.82,.88,1.15],ga:.3,fog:[.5,.55,.85], fa:.12,vig:.5, bloom:.55}
};
const MAX_LIGHTS=32;
const FX=(()=>{
  const off={ok:false,render(){},resize(){},setActive(){}};
  let c, gl;
  try{
    c=document.createElement('canvas');
    c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100vh;height:var(--vh,100dvh);display:block;pointer-events:none;image-rendering:pixelated';
    gl=c.getContext('webgl',{alpha:false,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false});
  }catch(_){ gl=null; }
  if(!gl) return off;
  const VS='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const BRIGHT='precision mediump float;varying vec2 uv;uniform sampler2D s;uniform float thr;void main(){vec3 c=texture2D(s,uv).rgb;float l=max(max(c.r,c.g),c.b);gl_FragColor=vec4(c*smoothstep(thr,1.,l),1.);}';
  const BLUR='precision mediump float;varying vec2 uv;uniform sampler2D s;uniform vec2 d;void main(){vec3 c=texture2D(s,uv).rgb*.227;'+
    'c+=(texture2D(s,uv+d).rgb+texture2D(s,uv-d).rgb)*.1945;c+=(texture2D(s,uv+2.*d).rgb+texture2D(s,uv-2.*d).rgb)*.1216;'+
    'c+=(texture2D(s,uv+3.*d).rgb+texture2D(s,uv-3.*d).rgb)*.054;c+=(texture2D(s,uv+4.*d).rgb+texture2D(s,uv-4.*d).rgb)*.016;gl_FragColor=vec4(c,1.);}';
  const FINAL=`precision mediump float;varying vec2 uv;
uniform sampler2D scene,bloom;uniform vec2 res;uniform float amb,bloomAmt,vig,ga,fa;uniform vec3 grade,fogC;
uniform vec4 lp[${MAX_LIGHTS}];uniform vec4 lc[${MAX_LIGHTS}];uniform int ln;
void main(){
  vec3 c=texture2D(scene,uv).rgb;
  vec2 asp=vec2(res.x/res.y,1.);
  vec3 light=vec3(0.),glow=vec3(0.);
  for(int i=0;i<${MAX_LIGHTS};i++){ if(i>=ln) break;
    float f=clamp(1.-length((uv-lp[i].xy)*asp)/lp[i].z,0.,1.); f*=f;
    light+=lc[i].rgb*lc[i].a*f; glow+=lc[i].rgb*lc[i].a*f*f*lp[i].w; }
  vec3 o=c*(vec3(amb)+light*(1.-amb)*1.7);
  o+=glow*.28+texture2D(bloom,uv).rgb*bloomAmt;
  o=mix(o,o*grade,ga*2.);
  o=mix(o,fogC*max(amb,.5),fa*smoothstep(.5,0.,uv.y));
  float v=smoothstep(.9,.25,length((uv-vec2(.5,.48))*vec2(1.,1.2)));
  o*=mix(1.-vig,1.,v);
  gl_FragColor=vec4(o,1.);
}`;
  function prog(fs){
    const p=gl.createProgram();
    for(const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){ const sh=gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh);
      if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p,sh); }
    gl.bindAttribLocation(p,0,'p'); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u={}; return {p,u:n=>u[n]??(u[n]=gl.getUniformLocation(p,n))};
  }
  function tex(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
    return t; }
  let P1,P2,P3;
  try{ P1=prog(BRIGHT); P2=prog(BLUR); P3=prog(FINAL); }catch(e){ console.warn('WebGL-Effekte aus:',e.message); return off; }
  const quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const sceneT=tex(); const fb=[0,1].map(()=>({t:tex(),f:gl.createFramebuffer()}));
  let W=0,H=0,qw=1,qh=1, active=true, lost=false;
  const lpA=new Float32Array(MAX_LIGHTS*4), lcA=new Float32Array(MAX_LIGHTS*4);
  function resize(w,h){
    W=w; H=h; c.width=w; c.height=h; qw=Math.max(1,w>>2); qh=Math.max(1,h>>2);
    for(const b of fb){ gl.bindTexture(gl.TEXTURE_2D,b.t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,qw,qh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.bindFramebuffer(gl.FRAMEBUFFER,b.f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,b.t,0); }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  }
  function pass(P,target,w,h,src){ gl.bindFramebuffer(gl.FRAMEBUFFER,target); gl.viewport(0,0,w,h); gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src); gl.uniform1i(P.u('s'),0); }
  function render(p){
    if(!active||lost) return;
    gl.bindTexture(gl.TEXTURE_2D,sceneT); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
    pass(P1,fb[0].f,qw,qh,sceneT); gl.uniform1f(P1.u('thr'),.68); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    pass(P2,fb[1].f,qw,qh,fb[0].t); gl.uniform2f(P2.u('d'),1.5/qw,0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    pass(P2,fb[0].f,qw,qh,fb[1].t); gl.uniform2f(P2.u('d'),0,1.5/qh); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H); gl.useProgram(P3.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneT); gl.uniform1i(P3.u('scene'),0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,fb[0].t); gl.uniform1i(P3.u('bloom'),1);
    gl.uniform2f(P3.u('res'),W,H); gl.uniform1f(P3.u('amb'),p.amb); gl.uniform1f(P3.u('bloomAmt'),p.bloom);
    gl.uniform1f(P3.u('vig'),p.vig); gl.uniform1f(P3.u('ga'),p.ga); gl.uniform1f(P3.u('fa'),p.fa);
    gl.uniform3fv(P3.u('grade'),p.grade); gl.uniform3fv(P3.u('fogC'),p.fog);
    const n=Math.min(MAX_LIGHTS,p.lights.length); lpA.fill(0); lcA.fill(0);
    for(let i=0;i<n;i++){ const l=p.lights[i]; lpA.set([l[0],l[1],l[2],l[3]],i*4); lcA.set([l[4],l[5],l[6],l[7]],i*4); }
    gl.uniform4fv(P3.u('lp[0]'),lpA); gl.uniform4fv(P3.u('lc[0]'),lcA); gl.uniform1i(P3.u('ln'),n);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function setActive(on){ active=on&&!lost; c.style.display=active?'block':'none'; cv.style.visibility=active?'hidden':'visible'; }
  c.addEventListener('webglcontextlost',e=>{ e.preventDefault(); lost=true; setActive(false); });
  if(cv.parentNode) cv.parentNode.insertBefore(c,cv.nextSibling);
  return {ok:true,render,resize,setActive};
})();
const rgb1=h=>hex(h).map(v=>v/255);
function collectLights(){
  if(!L||state==='start') return [];
  const out=[], W=cv.width, H=cv.height;
  const add=(x,y,r,col,i,glow,prio)=>{ const sx=(x-camX)*scale, sy=(y-camY)*scale, rp=r*scale;
    if(sx<-rp||sx>W+rp||sy<-rp||sy>H+rp) return;
    const [R,G,B]=rgb1(col); out.push([sx/W,1-sy/H,rp/H,glow,R,G,B,i,prio]); };
  const wc=WORLD_COL[L.id]||'#ffffff';
  add(P.x+P.w/2,P.y+P.h/2,state==='celebrate'?130:(L.style==='snow'?90:72),state==='celebrate'?wc:'#ffe2b8',state==='celebrate'?1.4:1,.3,0);
  if(L.goal) add(L.goal.x+8,L.goal.bottom-24,48,wc,1,1,1);
  if(L.boss&&L.boss.state!=='gone') add(L.boss.x+L.boss.w/2,L.boss.y+L.boss.h/2,90,BOSS_INFO[L.boss.id].col,1,.8,0);
  if(L.boss&&L.boss.trophy) add(L.boss.trophy.x,L.boss.trophy.y,60,'#ffd166',1,1,0);
  for(const k of L.crystals) if(!k.got) add(k.x,k.y,32,'#7fe0ff',.9,1,1);
  for(const k of L.stars) if(!k.got) add(k.x,k.y,30,'#ffe14d',.9,1,1);
  for(const d of L.doors) add(d.x+8,d.bottom-16,40,WORLD_COL[d.world]||'#f6ead2',.8,.8,2);
  for(const k of L.checkpoints) add(k.x+8,k.bottom-28,k.on?34:20,k.on?'#f2a65a':'#9aa4b8',k.on?.8:.35,.8,2);
  for(const k of L.coins) if(!k.got) add(k.x,k.y,15,'#ffd166',.7,1,3);
  for(const e of L.enemies) if(e.alive&&!(e.type==='fisch'&&e.state!=='leap')) add(e.x+e.w/2,e.y+e.h/2+e.bob,(e.type==='geist'?26:11)*ESCALE,ETYPE[e.type].light,e.type==='geist'?.7:.5,.5,3);
  if(out.length>MAX_LIGHTS){ const px=.5; out.sort((a,b)=>a[8]-b[8]||Math.abs(a[0]-px)-Math.abs(b[0]-px)); out.length=MAX_LIGHTS; }
  return out;
}
function fxRender(){
  if(!FX.ok||!dbg.fx) return;
  const bl=themeBlend(), A=FXT[bl.a], B=FXT[bl.b], t=bl.t, m=(x,y)=>x+(y-x)*t, ma=(x,y)=>x.map((v,i)=>m(v,y[i]));
  FX.render({amb:Math.max(0,1-(1-m(A.amb,B.amb))*PH.fxDark),grade:ma(A.grade,B.grade),ga:m(A.ga,B.ga),fog:ma(A.fog,B.fog),fa:m(A.fa,B.fa),
    vig:m(A.vig,B.vig),bloom:m(A.bloom,B.bloom)*PH.fxBloom,lights:collectLights()});
}

// ---------- Loop mit festem Zeitschritt ----------
const STEP=1/60; let acc=0, last=performance.now(), hudT=0;
// Zwischenbilder: Spieler, Kamera und Plattformen zwischen zwei Rechenschritten weich überblenden
const PREV={px:0,py:0,cx:0,cy:0,z:1,pu:0,m:[]};
function snapshot(){ PREV.px=P.x; PREV.py=P.y; PREV.cx=CAM.cx; PREV.cy=CAM.cy; PREV.z=zoom; PREV.pu=punch;
  PREV.m=L.movers.map(m=>[m.x,m.y]); }
function withInterp(a,fn){
  if(a>=1||!L||PREV.m.length!==L.movers.length){ fn(); return; }
  const lerp=(p,c)=>p+(c-p)*a;
  const sv={px:P.x,py:P.y,cx:CAM.cx,cy:CAM.cy,z:zoom,pu:punch,m:L.movers.map(m=>[m.x,m.y])};
  if(Math.abs(P.x-PREV.px)<64&&Math.abs(P.y-PREV.py)<64){ P.x=lerp(PREV.px,P.x); P.y=lerp(PREV.py,P.y); }
  CAM.cx=lerp(PREV.cx,CAM.cx); CAM.cy=lerp(PREV.cy,CAM.cy); zoom=lerp(PREV.z,zoom); punch=lerp(PREV.pu,punch);
  L.movers.forEach((m,i)=>{ m.x=lerp(PREV.m[i][0],m.x); m.y=lerp(PREV.m[i][1],m.y); });
  applyZoom(); camX=CAM.cx-viewW/2; camY=CAM.cy-viewH/2;
  try{ fn(); } finally {
    P.x=sv.px; P.y=sv.py; CAM.cx=sv.cx; CAM.cy=sv.cy; zoom=sv.z; punch=sv.pu; L.movers.forEach((m,i)=>{ m.x=sv.m[i][0]; m.y=sv.m[i][1]; });
    applyZoom(); camX=CAM.cx-viewW/2; camY=CAM.cy-viewH/2; }
}
// Bildrate (im Pausenmenü einschaltbar): Bilder je Sekunde, längstes Bild und Zeit fürs Zeichnen, halbsekündlich
const FPS={on:false,el:document.getElementById('fps'),n:0,t0:0,max:0,draw:0};
try{ FPS.on=localStorage.getItem('supersam-labor-fps')==='1'; }catch(_){}
function setFps(on){ FPS.on=on; try{ localStorage.setItem('supersam-labor-fps',on?'1':'0'); }catch(_){} if(FPS.el){ FPS.el.hidden=!on; if(on) FPS.el.textContent='… FPS'; } FPS.n=0; FPS.max=0; FPS.draw=0; FPS.t0=0; }
function fpsTick(now,raw,drawMs){ FPS.n++; FPS.max=Math.max(FPS.max,raw); FPS.draw+=drawMs; if(!FPS.t0){ FPS.t0=now; return; }
  const span=now-FPS.t0; if(span<500) return; const f=FPS.n*1000/span, el=FPS.el, n1=v=>v.toFixed(1).replace('.',',');
  if(el){ el.innerHTML=`${Math.round(f)} FPS<small>Bild ${n1(span/FPS.n)} ms · max ${Math.round(FPS.max)} · Zeichnen ${n1(FPS.draw/FPS.n)} ms · ${cv.width}×${cv.height}${dbg.fx&&FX.ok?' · Licht':''}</small>`; el.className=f>=55?'':f>=40?'mid':'low'; }
  FPS.n=0; FPS.max=0; FPS.draw=0; FPS.t0=now; }
function frame(now){
  const raw=now-last; let dt=Math.min(.1,raw/1000); last=now;
  if(matchMedia('(orientation: portrait)').matches&&innerWidth<900) dt=0;
  acc+=dt;
  while(acc>=STEP){ clock+=STEP;
    if(L){ snapshot(); if(hitstop>0) hitstop-=STEP; else { update(STEP); tickCelebrate(STEP); tickParticles(STEP); tickTutorial(STEP); } camera(STEP); }
    if(shake>0) shake-=STEP; acc-=STEP; }
  const td=FPS.on?performance.now():0;
